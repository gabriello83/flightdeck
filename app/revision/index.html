     mas, y el Excel se hace aqui mismo (comun/xlsx.js): no hay libreria de fuera. -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M3 3h4v4H3zm6 0h4v4H9zM3 9h4v4H3zm6 0h4v4H9z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;
  --s1:#2a78d6; --fila:#f0efeb;
  --sombra:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --verde:#15803d; --amarillo:#f2b705; --rojo:#c62828;
  --mal-fondo:#fbe3e1; --mal-tinta:#9b1c1c; --bien-tinta:#166534; --gris-fondo:#ecebe6;
  --ambar-fondo:#fdf0c4; --ambar-tinta:#6b4e00;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --fila:#222220; --sombra:none;
    --verde:#17803f; --amarillo:#e3ac06; --rojo:#c0392b;
    --mal-fondo:#3d1d1b; --mal-tinta:#f4a59e; --bien-tinta:#7fd89d; --gris-fondo:#262624;
    --ambar-fondo:#3a2f0c; --ambar-tinta:#f3d06b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --fila:#222220; --sombra:none;
  --verde:#17803f; --amarillo:#e3ac06; --rojo:#c0392b;
  --mal-fondo:#3d1d1b; --mal-tinta:#f4a59e; --bien-tinta:#7fd89d; --gris-fondo:#262624;
  --ambar-fondo:#3a2f0c; --ambar-tinta:#f3d06b;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marca b{font-size:20px;letter-spacing:-.01em}
.marca span{color:var(--tinta-2);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button.btn,a.btn{
  font:inherit;font-size:13px;color:var(--tinta);background:var(--tarjeta);text-decoration:none;
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:6px 11px;cursor:pointer;
}
button.btn:hover,a.btn:hover{border-color:var(--tinta-3)}
button.btn.primario{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.barra{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 6px}
.barra label{font-size:13px;color:var(--tinta-2);display:flex;align-items:center;gap:8px}
.barra select{
  font:inherit;font-size:14px;color:var(--tinta);background:var(--tarjeta);
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:5px 8px;max-width:280px
}
.nota{
  margin:12px 0 4px;padding:10px 13px;border:1px solid var(--borde);border-left:3px solid var(--s1);
  border-radius:8px;background:var(--tarjeta);color:var(--tinta-2);font-size:13px
}
.nota.mal{border-left-color:var(--rojo)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.kpi{
  font:inherit;text-align:left;cursor:pointer;color:var(--tinta);
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:11px 13px;box-shadow:var(--sombra)
}
.kpi[aria-pressed="true"]{border-color:var(--s1);box-shadow:0 0 0 2px var(--s1) inset}
.kpi:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.kpi .et{font-size:12px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .vl{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .nt{font-size:12px;color:var(--tinta-3);margin-top:2px}
section.caja{
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;
  padding:12px 16px 14px;box-shadow:var(--sombra);margin-top:14px
}
.cabsec{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
section.caja h2{font-size:16px;margin:0;font-weight:650}
.explica{color:var(--tinta-2);font-size:13px;margin:4px 0 0}
.tabla-env{margin-top:12px;overflow-x:auto;border:1px solid var(--borde);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--borde)}
th{font-size:12px;color:var(--tinta-2);font-weight:650;background:var(--fila);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.peq{color:var(--tinta-2);font-size:12px}
.mat{
  font:inherit;font-weight:700;color:var(--s1);background:none;border:0;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px
}
.mat:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.etq{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;white-space:nowrap}
.etq.estandar{color:var(--ambar-tinta);background:var(--ambar-fondo);border:1px solid currentColor}
.etq.otro{color:var(--tinta-2);background:var(--gris-fondo)}
.etq.ninguno{color:var(--mal-tinta);background:var(--mal-fondo)}
.dif{font-weight:700;font-variant-numeric:tabular-nums}
.dif.mas{color:var(--mal-tinta)}
.precios{display:grid;grid-template-columns:auto auto auto;gap:1px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.precios .m{color:var(--tinta-3);font-size:11.5px}
.precios .mal{color:var(--mal-tinta);font-weight:700}
.vacio{color:var(--tinta-2);font-size:13px;padding:10px 0}
tr.grupo td{background:var(--fila);font-weight:650;font-size:13px;color:var(--tinta)}
.kpis.areas{margin-top:12px}
nav.miga{margin:16px 0 4px;font-size:14px;color:var(--tinta-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav.miga a{color:var(--s1);text-decoration:none}
nav.miga a:hover{text-decoration:underline}
nav.miga b{color:var(--tinta)}
footer{margin-top:26px;color:var(--tinta-3);font-size:12px;border-top:1px solid var(--borde);padding-top:12px}
#cargando{padding:40px 0;color:var(--tinta-2)}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:12px}
.persona{border:1px solid var(--borde);border-radius:10px;padding:10px 12px}
.persona h3{font-size:15px;margin:0}
.cifras{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}
.cifras div{font-size:12px;color:var(--tinta-2)}
.cifras b{display:block;font-size:20px;color:var(--tinta);font-variant-numeric:tabular-nums}
.horas{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:54px;margin-top:6px}
.horas span{background:var(--s1);border-radius:2px 2px 0 0;min-height:1px}
.horas span.cero{background:var(--borde)}
.horas-et{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;font-size:10px;color:var(--tinta-3);text-align:center}
@media (max-width:560px){
  .barra label{flex:1 1 100%;min-width:0}
  .barra label select{flex:1;width:100%;max-width:100%;min-width:0}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .vl{font-size:22px}
  th,td{padding:7px 8px}
  .oculta-movil{display:none}
  .personas{grid-template-columns:1fr}
  .horas-et span:nth-child(odd){visibility:hidden}
  section.caja{padding:10px 10px 12px}
}

<body>
<div class="env">
  <header class="top">
    <div class="marca">
      <b>Revisión clientes</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/operativo/">Informe operativo</a>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="barra" id="barra" hidden>
    <span id="fLugar"></span>
    <button class="btn" id="bLimpiar" type="button">Quitar filtros</button>
  </div>
  <nav class="miga" id="miga" aria-label="Dónde estás" hidden></nav>
  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>
  <main id="vista"></main>
  <footer id="pie" hidden></footer>
</div>

<script src="/comun/xlsx.js"></script>
<script>
/* ===================================================================
   Revision de clientes · digivend.es  (docs/59)

   Cuatro tablas de lo que esta mal configurado: maquinas sin planograma,
   maquinas con productos sin tarifa, maquinas que cobran distinto de su tarifa
   y los planogramas creados. Pulsando una matricula se ven sus productos, con
   su Excel. Lo que llega ya es del perfil de la sesion; esta pagina no calcula
   nada, filtra y dibuja lo que escribio la noche.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const num  = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const eur  = n => n==null ? "—" : new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const dif  = n => n==null ? "—" : (n>0 ? "+" : "") + eur(n);
const esc  = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

const NIVEL = {gratuito:"Venta gratuita", maquina:"Precio en la máquina", pdv:"Punto de venta", centro:"Centro", cliente:"Cliente", grupo:"Grupo de clientes", estandar:"Estándar"};
const ASIGNADA = {pdv:"al punto de venta", cliente:"al cliente"};
const MEDIOS = [["ef","Efectivo"],["tp","Tarjeta privada"],["tc","Tarjeta crédito"]];
const TABLAS = [
  ["planograma", "Sin planograma"],
  ["tarifa", "Sin tarifa"],
  ["precio", "Precio distinto"],
  ["creados", "Planogramas creados"],
];
/* La actividad de las personas en VenCloud (M15) solo llega al perfil interno. */
const ACCION = {I:"Alta", U:"Cambio", D:"Borrado"};
let YO=null, D=null;
/* Las tablas que el administrador le quitó a este usuario (docs/61). */
let QUITADAS = new Set(), VISTA_T = null;

function fechaCorta(s){
  const d = new Date(String(s).slice(0,10)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s||"") : d.toLocaleDateString("es-ES",{day:"numeric", month:"short", year:"numeric"});
}
function fechaLarga(s){
  const d = new Date(String(s).slice(0,10)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s||"") : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
}
function avisa(texto, mal){
  const a = $("#aviso");
  a.textContent = texto||""; a.hidden = !texto; a.classList.toggle("mal", !!mal);
}
const limpio = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40);

/* ----------------------------------------------------- estado en la URL */
/* La tabla, la máquina y el día van en el ancla; área, delegación, cliente y
   centro, en la dirección, como en las demás secciones (docs/73). */
function ruta(){
  const q = new URLSearchParams(location.hash.slice(1));
  return {t: q.get("t") || "planograma", m: q.get("m"), dia: q.get("dia") || ""};
}
function ir(cambios){
  const r = Object.assign(ruta(), cambios);
  const q = new URLSearchParams();
  for(const k of ["t","m","dia"]) if(r[k]) q.set(k, r[k]);
  location.hash = q.toString();
}

/* ---------------------------------------------------------- los filtros */
const lista = x => Array.isArray(x) ? x : [];
function todas(){
  return [...D.sin_planograma, ...lista(D.sin_tarifa), ...lista(D.precio_distinto), ...(D.creados||[])];
}
/* Area, delegacion, cliente y centro, con seleccion multiple y buscador
   (David, 22-oct, docs/73). Cada maquina trae los suyos. */
let F = null;
const encaja = m => F.pasaCentro(m.num_centro, m.delegacion);
function montaFiltros(){
  const zonas = {}, centros = {};
  todas().forEach(m=>{
    if(m.delegacion) zonas[m.delegacion] = zonaDe(m.delegacion);
    if(m.num_centro && !centros[m.num_centro]) centros[m.num_centro] = {n: m.centro || m.num_centro, c: m.cliente || m.cod_cliente || "", d: m.delegacion};
  });
  F = Filtros.cuatro($("#fLugar"), {zonas, centros, zonaDe,
    ordenAreas: (x, y)=>(ORDEN_ZONAS.indexOf(x)+99)%99 - (ORDEN_ZONAS.indexOf(y)+99)%99 || x.localeCompare(y,"es"),
    alCambiar: ()=>{ if(ruta().m) ir({m:""}); else pinta(); }});
  /* Un enlace de antes con el área, la delegación o el centro en el ancla. */
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get("a")) F.pon("areas", [q.get("a")]);
  if(q.get("d")) F.pon("delegs", [q.get("d")]);
  if(q.get("ce")) F.pon("centros", [q.get("ce")]);
  $("#barra").hidden = false;
}
$("#bLimpiar").addEventListener("click", ()=>{ F.limpia(); if(ruta().m) ir({m:""}); });

/* -------------------------------------------------- lo comun de las filas */
function sitio(m){
  return `<td>${esc(m.cliente)}<div class="peq">${esc(m.centro)} · ${esc(m.num_centro)}</div></td>`
    + `<td class="oculta-movil">${esc(m.cod_pdv)}${m.ubicacion ? `<div class="peq">${esc(m.ubicacion)}</div>` : ""}</td>`
    + `<td class="oculta-movil">${esc(m.delegacion)}</td>`;
}
const CAB_SITIO = `<th>Cliente · centro</th><th class="oculta-movil">Punto de venta</th><th class="oculta-movil">Delegación</th>`;
function nivelEtq(m){
  /* Las tarifas estandar (menu «Tarifas Vending Estándar») se señalan, como
     pidio Gabriele: van en ambar y con la tabla y a quien esta asignada. */
  if(!m.nivel) return `<span class="etq ninguno">Ninguna tarifa</span>`;
  const otros = Object.entries(m.niveles||{}).sort((a,b)=>b[1]-a[1]);
  const etq = `<span class="etq ${m.nivel==="estandar" ? "estandar" : "otro"}">${esc(NIVEL[m.nivel]||m.nivel)}</span>`;
  const est = (m.estandar||[]).map(t=>`${esc(t.tarifa)}${t.asignada ? ` · asignada ${esc(ASIGNADA[t.asignada]||t.asignada)}` : ""}`);
  const mezcla = otros.length > 1 ? otros.map(([k,v])=>`${esc(NIVEL[k]||k)} ${num(v)}`).join(" · ") : "";
  const estOtro = m.nivel!=="estandar" && est.length ? ` <span class="etq estandar">y Estándar</span>` : "";
  return etq + estOtro
    + (est.length ? `<div class="peq">${est.slice(0,2).join("<br>")}</div>` : "")
    + (mezcla ? `<div class="peq">${mezcla} productos</div>` : "");
}
function textoNivel(m){
  if(!m.nivel) return "Ninguna tarifa";
  return Object.entries(m.niveles||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${NIVEL[k]||k} (${v})`).join(" · ");
}
function textoEstandar(m){
  return (m.estandar||[]).map(t=>`${t.tarifa}${t.asignada ? ` (asignada ${ASIGNADA[t.asignada]||t.asignada})` : ""}`).join(" · ");
}
function boton(m){
  return `<button class="mat" type="button" data-m="${esc(m.matricula)}" aria-label="Ver los productos de la máquina ${esc(m.matricula)}">${esc(m.matricula)}</button>`;
}

/* ------------------------------------------------------------ la vista */
function pinta(){
  avisa("");
  const r = ruta();
  /* Una tabla quitada no se abre ni pidiéndola en la dirección: se va a la
     primera que sí ve. */
  const vistas = TABLAS.map(([k])=>k).concat(D.actividad ? ["usuarios"] : []).filter(k=>!QUITADAS.has(k));
  if(!vistas.length){
    $("#barra").hidden = true; $("#miga").hidden = true;
    $("#vista").innerHTML = `<p class="vacio">No tienes ninguna tabla de la revisión de clientes concedida.</p>`;
    return;
  }
  if(!vistas.includes(r.t)){ r.t = vistas[0]; r.m = null; }
  $("#barra").hidden = false;
  /* La tabla que se ve, para su estrella de preferidos (docs/62); la ficha de
     una máquina no es una tabla. */
  VISTA_T = r.m ? null : r.t;
  if(r.t==="usuarios" && D.actividad) return vistaUsuarios(r);
  if(r.m && (r.t==="tarifa" || r.t==="precio")) return vistaMaquina(r);
  $("#miga").hidden = true;
  const filtra = x => Array.isArray(x) ? x.filter(encaja) : x;
  const sp = filtra(D.sin_planograma), st = filtra(D.sin_tarifa), pd = filtra(D.precio_distinto);
  const cr = filtra(D.creados||[]);
  const dias = [...new Set(cr.map(c=>c.dia))].sort().reverse();
  const cuenta = {planograma: sp.length, tarifa: Array.isArray(st) ? st.length : null,
                  precio: Array.isArray(pd) ? pd.length : null, creados: cr.filter(c=>c.dia===(dias[0]||"")).length};
  const nota = {planograma:"máquinas", tarifa:"máquinas con productos sin tarifa", precio:"máquinas que cobran distinto",
                creados: dias[0] ? `el ${fechaLarga(dias[0])}` : "todavía ninguno"};
  const v = $("#vista");
  v.innerHTML = kpis(r, cuenta, nota) + `<section class="caja" id="tabla"></section>`;
  conectaKpis(v);
  const caja = $("#tabla");
  if(r.t==="creados") tablaCreados(caja, cr, dias, r);
  else {
    /* Sin planograma, sin tarifa y precio distinto (Gabriele, 19-oct): primero
       un cuadrado por area con sus maquinas; pulsando, la lista por delegacion.
       Con una delegacion elegida en el filtro se va directo a su lista. */
    const sel = r.t==="tarifa" ? st : r.t==="precio" ? pd : sp;
    const tabla = r.t==="tarifa" ? tablaTarifa : r.t==="precio" ? tablaPrecio : tablaPlanograma;
    if(!Array.isArray(sel)) tabla(caja, sel);
    else if(!F.alguno()) vistaAreas(caja, r, sel);
    else {
      const mi = $("#miga");
      mi.innerHTML = `<a href="#" id="volverArea">${esc(TITULO_T[r.t])}</a> › <b>${esc(F.texto())}</b>`;
      mi.hidden = false;
      $("#volverArea").addEventListener("click", e=>{ e.preventDefault(); F.limpia(); });
      tabla(caja, sel);
    }
  }
  caja.querySelectorAll(".mat").forEach(b=>b.addEventListener("click", ()=>ir({m:b.dataset.m})));
}

/* ------------------------------------------------------------- las areas */
const ORDEN_ZONAS = ["Centro", "Sur", "Cataluña", "Levante", "Norte", "Otra zona"];
const TITULO_T = {planograma:"Sin planograma", tarifa:"Sin tarifa", precio:"Precio distinto"};
const zonaDe = d => (D.zonas||{})[d] || "Otra zona";
function vistaAreas(caja, r, filas){
  const explica = {
    planograma: "Las máquinas sin planograma de cada área. Pulsa un área para ver sus máquinas por delegación.",
    tarifa: "Las máquinas con productos sin tarifa de cada área, y cuántos productos son. Pulsa un área para ver sus máquinas por delegación.",
    precio: "Las máquinas que cobran distinto de su tarifa en cada área, y cuántos productos son. Pulsa un área para ver sus máquinas por delegación."}[r.t];
  const excel = {planograma:()=>excelPlanograma(filas), tarifa:()=>excelTarifas(filas, "todas"), precio:()=>excelPrecios(filas, "todas")}[r.t];
  cabecera(caja, `${TITULO_T[r.t]} por área`, explica, filas.length ? excel : null);
  if(!filas.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Ninguna máquina con estos filtros.</p>`); return; }
  const areas = new Map();
  filas.forEach(m=>{
    const z = zonaDe(m.delegacion);
    const a = areas.get(z) || {maquinas:0, productos:0, delegs:new Set()};
    a.maquinas++; a.delegs.add(m.delegacion);
    a.productos += r.t==="tarifa" ? (m.sin_tarifa||0) : r.t==="precio" ? (m.distintos||0) : 0;
    areas.set(z, a);
  });
  const orden = [...areas.keys()].sort((x,y)=>(ORDEN_ZONAS.indexOf(x)+99)%99 - (ORDEN_ZONAS.indexOf(y)+99)%99 || x.localeCompare(y,"es"));
  caja.insertAdjacentHTML("beforeend", `<div class="kpis areas">` + orden.map(z=>{
      const a = areas.get(z);
      const prod = r.t==="tarifa" ? ` · ${num(a.productos)} productos sin tarifa` : r.t==="precio" ? ` · ${num(a.productos)} productos con precio distinto` : "";
      return `<button class="kpi area" type="button" data-a="${esc(z)}"><div class="et">${esc(z)}</div>`
        + `<div class="vl">${num(a.maquinas)}</div><div class="nt">máquinas en ${num(a.delegs.size)} ${a.delegs.size===1?"delegación":"delegaciones"}${prod}</div></button>`;
    }).join("") + `</div>`);
  caja.querySelectorAll(".area").forEach(b=>b.addEventListener("click", ()=>F.pon("areas", [b.dataset.a])));
}
/* Las filas de una tabla, con una cabecera por delegacion. */
function porDeleg(filas, columnas, fila){
  let actual = null, out = "";
  const cuenta = filas.reduce((c,m)=>(c[m.delegacion]=(c[m.delegacion]||0)+1, c), {});
  [...filas].sort((a,b)=>a.delegacion.localeCompare(b.delegacion,"es")).forEach(m=>{
    if(m.delegacion!==actual){
      actual = m.delegacion;
      out += `<tr class="grupo"><td colspan="${columnas}">${esc(actual)} <span class="peq">· ${num(cuenta[actual])} ${cuenta[actual]===1?"máquina":"máquinas"}</span></td></tr>`;
    }
    out += fila(m);
  });
  return out;
}

function kpis(r, cuenta, nota){
  const tablas = TABLAS.filter(([k])=>!QUITADAS.has(k));
  if(D.actividad && !QUITADAS.has("usuarios")){
    const a = resumenActividad();
    tablas.push(["usuarios", "García y Marcos"]);
    cuenta.usuarios = a ? a.acciones : null;
    nota.usuarios = a ? `acciones el ${fechaLarga(a.dia)}` : "sin dato todavía";
  }
  return `<div class="kpis" role="group" aria-label="Qué tabla ver">`
    + tablas.map(([k,t])=>`<button class="kpi" type="button" data-t="${k}" aria-pressed="${k===r.t}">`
      + `<div class="et">${t}</div><div class="vl">${cuenta[k]==null ? "Sin dato" : num(cuenta[k])}</div>`
      + `<div class="nt">${esc(nota[k])}</div></button>`).join("")
    + `</div>`;
}
function conectaKpis(v){
  v.querySelectorAll(".kpi[data-t]").forEach(b=>b.addEventListener("click", ()=>ir({t:b.dataset.t, m:""})));
}

function cabecera(caja, titulo, explica, excel){
  caja.innerHTML = `<div class="cabsec" data-estrella="*"><h2>${esc(titulo)}</h2>`
    + (excel ? `<button class="btn primario" id="bExcel" type="button">Descargar Excel</button>` : "")
    + `</div><p class="explica">${explica}</p>`;
  if(excel) $("#bExcel").addEventListener("click", excel);
}

function tablaPlanograma(caja, filas){
  cabecera(caja, "Máquinas sin planograma",
    "Instaladas, y marcadas en VenCloud como sin planograma o sin un solo canal con artículo. Sin planograma no se puede saber si la máquina estaba vacía o es que no había demanda.",
    filas.length ? ()=>excelPlanograma(filas) : null);
  if(!filas.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Ninguna máquina sin planograma con estos filtros.</p>`); return; }
  caja.insertAdjacentHTML("beforeend", `<div class="tabla-env"><table><thead><tr><th>Máquina</th>${CAB_SITIO}<th>Qué le pasa</th></tr></thead><tbody>`
    + porDeleg(filas, 5, m=>`<tr><td><b>${esc(m.matricula)}</b></td>${sitio(m)}`
      + `<td>${m.marcada ? "Marcada «sin planograma»" : "Ningún canal con artículo"}</td></tr>`)
    + `</tbody></table></div>`);
}

function tablaTarifa(caja, filas){
  if(!Array.isArray(filas)){ cabecera(caja, "Máquinas con productos sin tarifa", esc(filas.sin_dato)); return; }
  cabecera(caja, "Máquinas con productos sin tarifa",
    "Productos repuestos en los últimos seis meses para los que VenCloud no encuentra precio, buscando en su orden: punto de venta, centro, cliente, grupo y tarifa estándar. El nivel dice de dónde sacan el precio los demás productos de la máquina; las de tarifa estándar van señaladas. Pulsa la matrícula para ver los productos.",
    filas.length ? ()=>excelTarifas(filas, "todas") : null);
  if(!filas.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Ninguna máquina con productos sin tarifa con estos filtros.</p>`); return; }
  caja.insertAdjacentHTML("beforeend", `<div class="tabla-env"><table><thead><tr><th>Máquina</th>${CAB_SITIO}<th>Nivel de las tarifas</th><th class="n">Sin tarifa</th></tr></thead><tbody>`
    + porDeleg(filas, 6, m=>`<tr><td>${boton(m)}</td>${sitio(m)}<td>${nivelEtq(m)}</td>`
      + `<td class="n"><b>${num(m.sin_tarifa)}</b><div class="peq">de ${num(m.productos_total)}</div></td></tr>`)
    + `</tbody></table></div>`);
}

function tablaPrecio(caja, filas){
  if(!Array.isArray(filas)){ cabecera(caja, "Máquinas con precio distinto", esc(filas.sin_dato)); return; }
  cabecera(caja, "Máquinas con precio distinto de la tarifa",
    "La última venta de cada medio de pago, por telemetría o por el audit de la visita, después del último cambio de la tarifa y como mucho de hace seis meses, contra el precio de la tarifa, exacto. La diferencia es la más grande de la máquina: lo cobrado menos la tarifa. Pulsa la matrícula para ver los productos.",
    filas.length ? ()=>excelPrecios(filas, "todas") : null);
  if(!filas.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Ninguna máquina con precio distinto con estos filtros.</p>`); return; }
  caja.insertAdjacentHTML("beforeend", `<div class="tabla-env"><table><thead><tr><th>Máquina</th>${CAB_SITIO}<th class="oculta-movil">Nivel de las tarifas</th><th class="n">Productos distintos</th><th class="n">Diferencia máxima</th></tr></thead><tbody>`
    + porDeleg(filas, 7, m=>`<tr><td>${boton(m)}</td>${sitio(m)}<td class="oculta-movil">${nivelEtq(m)}</td>`
      + `<td class="n"><b>${num(m.distintos)}</b><div class="peq">de ${num(m.comprobados)} comprobados</div></td>`
      + `<td class="n"><span class="dif ${m.max_diferencia>0 ? "mas" : ""}">${dif(m.max_diferencia)}</span></td></tr>`)
    + `</tbody></table></div>`);
}

function tablaCreados(caja, filas, dias, r){
  const dia = r.dia && dias.includes(r.dia) ? r.dia : (dias[0] || "");
  const delDia = filas.filter(c=>c.dia===dia);
  cabecera(caja, "Planogramas creados",
    `Máquinas que la noche anterior no tenían planograma y en esta ya lo tienen. VenCloud no guarda la historia del planograma, así que se ve comparando una noche con la siguiente`
      + (D.creados_desde ? `, desde el ${esc(fechaCorta(D.creados_desde))}` : "") + ".",
    delDia.length ? ()=>excelCreados(delDia, dia) : null);
  if(D.sin_usuario) caja.insertAdjacentHTML("beforeend", `<div class="nota">${esc(D.sin_usuario)}</div>`);
  if(!dias.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Todavía no se ha creado ningún planograma desde que se vigila.</p>`); return; }
  caja.insertAdjacentHTML("beforeend", `<div class="barra"><label>Día <select id="fDia">`
    + dias.map(d=>`<option value="${d}"${d===dia?" selected":""}>${esc(fechaLarga(d))} (${num(filas.filter(c=>c.dia===d).length)})</option>`).join("")
    + `</select></label></div>`);
  $("#fDia").addEventListener("change", e=>ir({dia:e.target.value}));
  caja.insertAdjacentHTML("beforeend", `<div class="tabla-env"><table><thead><tr><th>Máquina</th>${CAB_SITIO}<th class="n">Canales</th><th>Usuario</th></tr></thead><tbody>`
    + delDia.map(c=>`<tr><td><b>${esc(c.matricula)}</b></td>${sitio(c)}<td class="n">${num(c.canales)}</td>`
      + `<td>${c.usuario ? esc(c.usuario) : `<span class="peq">Sin dato</span>`}</td></tr>`).join("")
    + `</tbody></table></div>`);
}

/* ------------------------------------------- lo que hace cada persona */
function diasActividad(){
  const g = lista((D.actividad||{}).grupos);
  return [...new Set(g.flatMap(x=>x.dias.map(d=>d.dia)))].sort().reverse();
}
function resumenActividad(){
  const dia = diasActividad()[0];
  if(!dia) return null;
  return {dia, acciones: D.actividad.grupos.reduce((s,g)=>s+((g.dias.find(d=>d.dia===dia)||{}).acciones||0), 0)};
}
function vistaUsuarios(r){
  /* No depende de delegacion, cliente ni centro: es lo que hace cada persona
     en VenCloud, en toda la red. */
  $("#miga").hidden = true; $("#barra").hidden = true;
  const v = $("#vista");
  const cuenta = {}, nota = {};
  const vacio = TABLAS.map(([k])=>k);
  vacio.forEach(k=>{ cuenta[k] = null; nota[k] = ""; });
  cuenta.planograma = D.sin_planograma.length; nota.planograma = "máquinas";
  cuenta.tarifa = Array.isArray(D.sin_tarifa) ? D.sin_tarifa.length : null; nota.tarifa = "máquinas con productos sin tarifa";
  cuenta.precio = Array.isArray(D.precio_distinto) ? D.precio_distinto.length : null; nota.precio = "máquinas que cobran distinto";
  const cr = D.creados||[], dc = [...new Set(cr.map(c=>c.dia))].sort().reverse();
  cuenta.creados = cr.filter(c=>c.dia===(dc[0]||"")).length; nota.creados = dc[0] ? `el ${fechaLarga(dc[0])}` : "todavía ninguno";
  v.innerHTML = kpis(r, cuenta, nota) + `<section class="caja" id="tabla"></section>`;
  conectaKpis(v);
  const caja = $("#tabla");
  const dias = diasActividad();
  if(D.actividad.sin_dato){ cabecera(caja, "M. García y J. Marcos en VenCloud", esc(D.actividad.sin_dato)); return; }
  const dia = r.dia && dias.includes(r.dia) ? r.dia : (dias[0] || "");
  cabecera(caja, "M. García y J. Marcos en VenCloud",
    "Lo que M. García (M.GARCIA y M2.GARCIA) y J. Marcos (J.MARCOS y J2.MARCOS) han hecho en VenCloud cada día, con sus dos cuentas juntas: cuántas acciones (cada alta, cambio o borrado que VenCloud apunta en su registro de actividad), en qué horas, a qué hora empezaron y terminaron y qué tocaron. Es de toda la red: los filtros de delegación, cliente y centro no se aplican. Todos los usuarios están en el cuadrado Utilizo.",
    dia ? ()=>excelUsuarios(dia) : null);
  if(!dias.length){ caja.insertAdjacentHTML("beforeend", `<p class="vacio">Todavía no hay ningún día con actividad de estas personas.</p>`); return; }
  caja.insertAdjacentHTML("beforeend", `<div class="barra"><label>Día <select id="fDia">`
    + dias.map(d=>`<option value="${d}"${d===dia?" selected":""}>${esc(fechaLarga(d))}</option>`).join("")
    + `</select></label></div><div class="personas">`
    + D.actividad.grupos.map(g=>persona(g, g.dias.find(d=>d.dia===dia))).join("")
    + `</div><h2 style="margin-top:18px">Día a día</h2>`
    + `<div class="tabla-env"><table><thead><tr><th>Día</th>`
    + D.actividad.grupos.map(g=>`<th class="n">${esc(g.nombre)} · acciones</th><th class="n oculta-movil">horas</th><th class="oculta-movil">de · a</th>`).join("")
    + `</tr></thead><tbody>`
    + dias.map(d=>`<tr><td>${esc(fechaCorta(d))}</td>` + D.actividad.grupos.map(g=>{
        const x = g.dias.find(y=>y.dia===d);
        return x ? `<td class="n"><b>${num(x.acciones)}</b></td><td class="n oculta-movil">${num(x.horas)}</td><td class="oculta-movil">${esc(deA(x))}</td>`
                 : `<td class="n">0</td><td class="n oculta-movil">0</td><td class="oculta-movil peq">sin actividad</td>`;
      }).join("") + `</tr>`).join("")
    + `</tbody></table></div>`);
  $("#fDia").addEventListener("change", e=>ir({dia:e.target.value}));
}
const deA = x => x.primera ? `${x.primera.slice(0,5)} – ${x.ultima.slice(0,5)}` : "—";
function persona(g, x){
  const cab = `<div class="persona"><h3>${esc(g.nombre)}</h3><div class="peq">Cuentas ${g.cuentas.map(esc).join(" y ")}</div>`;
  if(!x) return cab + `<p class="vacio">Ninguna acción en VenCloud este día.</p></div>`;
  const max = Math.max(1, ...Object.values(x.por_hora||{}));
  const barras = Array.from({length:24}, (_,h)=>{
    const n = (x.por_hora||{})[h] || 0;
    return `<span class="${n ? "" : "cero"}" style="height:${n ? Math.max(4, Math.round(n/max*100)) : 2}%" title="${h}:00 · ${num(n)} acciones"></span>`;
  }).join("");
  return cab + `<div class="cifras"><div><b>${num(x.acciones)}</b>acciones</div><div><b>${num(x.horas)}</b>horas con actividad</div>`
    + `<div><b>${esc(deA(x))}</b>primera · última</div></div>`
    + (x.cuentas.length < g.cuentas.length ? `<div class="peq">Sólo trabajó con ${x.cuentas.map(esc).join(" y ")}.</div>` : "")
    + `<div class="horas" aria-label="Acciones por hora">${barras}</div>`
    + `<div class="horas-et">${Array.from({length:24},(_,h)=>`<span>${h}</span>`).join("")}</div>`
    + `<div class="tabla-env"><table><thead><tr><th>Qué tocó</th><th>Acción</th><th class="n">Veces</th></tr></thead><tbody>`
    + x.entidades.map(([e,a,n])=>`<tr><td>${esc(e)}</td><td>${esc(ACCION[a]||a)}</td><td class="n">${num(n)}</td></tr>`).join("")
    + `</tbody></table></div></div>`;
}
function excelUsuarios(dia){
  const gs = D.actividad.grupos, dias = diasActividad();
  const hoja1 = [];
  dias.forEach(d=>gs.forEach(g=>{
    const x = g.dias.find(y=>y.dia===d);
    hoja1.push([d, g.nombre, x ? x.cuentas.join(" + ") : "", x ? x.acciones : 0, x ? x.horas : 0,
                x && x.primera ? x.primera : "", x && x.primera ? x.ultima : ""]);
  }));
  const hoja2 = [], hoja3 = [];
  gs.forEach(g=>{
    const x = g.dias.find(y=>y.dia===dia);
    if(!x) return;
    x.entidades.forEach(([e,a,n])=>hoja2.push([g.nombre, e, ACCION[a]||a, n]));
    Object.entries(x.por_hora||{}).forEach(([h,n])=>hoja3.push([g.nombre, `${String(h).padStart(2,"0")}:00`, n]));
  });
  const tit = que => [`Revisión clientes · M. García y J. Marcos · ${que}`, `Generado el ${HOY.toLocaleDateString("es-ES")}`];
  XLSX.descarga(XLSX.libro([
    {nombre:"Día a día", titulo:tit("usuarios en VenCloud, día a día"), filas:hoja1,
     columnas:[{titulo:"Día",ancho:12},{titulo:"Persona",ancho:14},{titulo:"Cuentas",ancho:22},{titulo:"Acciones",ancho:10},
       {titulo:"Horas con actividad",ancho:10},{titulo:"Primera",ancho:10},{titulo:"Última",ancho:10}]},
    {nombre:"Qué tocó", titulo:tit(`qué tocó cada persona el ${fechaLarga(dia)}`), filas:hoja2,
     columnas:[{titulo:"Persona",ancho:14},{titulo:"Qué tocó",ancho:30},{titulo:"Acción",ancho:10},{titulo:"Veces",ancho:10}]},
    {nombre:"Por hora", titulo:tit(`acciones por hora el ${fechaLarga(dia)}`), filas:hoja3,
     columnas:[{titulo:"Persona",ancho:14},{titulo:"Hora",ancho:8},{titulo:"Acciones",ancho:10}]}]),
    nombre("garcia_marcos", dia));
}

/* ------------------------------------------------- una maquina por dentro */
function vistaMaquina(r){
  const filas = r.t==="tarifa" ? D.sin_tarifa : D.precio_distinto;
  const m = Array.isArray(filas) && filas.find(x=>x.matricula===r.m);
  if(!m){ ir({m:""}); return; }
  const titulo = r.t==="tarifa" ? "Sin tarifa" : "Precio distinto";
  const mi = $("#miga");
  mi.innerHTML = `<a href="#" id="volver">${titulo}</a> › <b>${esc(m.matricula)}</b>`;
  mi.hidden = false;
  $("#volver").addEventListener("click", e=>{ e.preventDefault(); ir({m:""}); });
  const v = $("#vista");
  v.innerHTML = `<section class="caja"><div class="cabsec"><div><h2>${esc(m.matricula)} · ${esc(titulo.toLowerCase())}</h2>`
    + `<div class="peq">${esc(m.cliente)} · ${esc(m.centro)} (${esc(m.num_centro)}) · ${esc(m.cod_pdv)}${m.ubicacion ? " · "+esc(m.ubicacion) : ""} · ${esc(m.delegacion)}${m.subvencion ? " · con subvención" : ""}</div>`
    + `<div class="peq" style="margin-top:4px">Nivel de las tarifas: ${nivelEtq(m)}</div></div>`
    + `<button class="btn primario" id="bExcel" type="button">Descargar Excel</button></div>`
    + `<div class="tabla-env"><table><thead><tr><th>Producto</th>`
    + (r.t==="tarifa"
        ? `<th class="oculta-movil">Última carga</th><th>Cobra hoy</th>`
        : `<th class="oculta-movil">Nivel</th><th>Tarifa · cobrado</th><th class="n">Diferencia</th>`)
    + `</tr></thead><tbody>`
    + m.productos.map(p=> r.t==="tarifa" ? filaSinTarifa(p) : filaDistinto(p)).join("")
    + `</tbody></table></div></section>`;
  $("#bExcel").addEventListener("click", ()=> r.t==="tarifa" ? excelTarifas([m], m.matricula) : excelPrecios([m], m.matricula));
}
function producto(p){
  return `<td>${esc(p.articulo || p.cod_articulo)}<div class="peq">${esc(p.cod_articulo)}</div></td>`;
}
function filaSinTarifa(p){
  const precios = MEDIOS.map(([k,t])=>{
    const x = ((p.medios||{})[k]||{}).venta;
    return x ? `<span class="m">${t}</span><span>${eur(x.precio)}</span><span class="peq">${esc(fechaCorta(x.fecha))}</span>` : "";
  }).join("");
  return `<tr>${producto(p)}<td class="oculta-movil">${esc(fechaCorta(p.ultima_carga))}</td>`
    + `<td>${precios ? `<div class="precios">${precios}</div>` : `<span class="peq">Sin venta electrónica</span>`}</td></tr>`;
}
function filaDistinto(p){
  const precios = MEDIOS.map(([k,t])=>{
    const x = (p.medios||{})[k];
    if(!x || x.tarifa==null) return "";
    const venta = x.venta ? eur(x.venta.precio) : "—";
    return `<span class="m">${t}</span><span>${eur(x.tarifa)}</span>`
      + `<span class="${x.ok===false ? "mal" : ""}" title="${x.venta ? esc(fechaCorta(x.venta.fecha)+" · "+(x.venta.fuente==="audit"?"audit de la visita":"telemetría")) : "sin venta desde el cambio"}">${venta}</span>`;
  }).join("");
  return `<tr>${producto(p)}<td class="oculta-movil">${p.nivel ? esc(NIVEL[p.nivel]||p.nivel) : "—"}`
    + `${p.tarifa ? `<div class="peq">${esc(p.tarifa)}${p.asignada ? " · asignada "+esc(ASIGNADA[p.asignada]||p.asignada) : ""}</div>` : ""}</td>`
    + `<td><div class="precios">${precios}</div></td>`
    + `<td class="n"><span class="dif ${p.diferencia>0 ? "mas" : ""}">${dif(p.diferencia)}</span></td></tr>`;
}

/* ------------------------------------------------------------- los Excel */
const HOY = new Date();
function titulo(que){
  return [`Revisión clientes · ${que}`,
          `${F.texto() || "Todo el ámbito"} · generado el ${HOY.toLocaleDateString("es-ES")}`];
}
const COL_SITIO = [{titulo:"Máquina",ancho:11},{titulo:"Delegación",ancho:18},{titulo:"Cód. cliente",ancho:10},
  {titulo:"Cliente",ancho:28},{titulo:"Nº centro",ancho:9},{titulo:"Centro",ancho:28},
  {titulo:"Punto de venta",ancho:11},{titulo:"Ubicación",ancho:20}];
const base = m => [m.matricula, m.delegacion, m.cod_cliente, m.cliente, m.num_centro, m.centro, m.cod_pdv, m.ubicacion];
function nombre(que, sufijo){
  return `revision_${que}_${limpio(sufijo)}_${HOY.toISOString().slice(0,10)}.xlsx`;
}

function excelPrecios(maquinas, sufijo){

  })));
  XLSX.descarga(XLSX.libro([

(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  YO = await r.json();
  if(YO.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  $("#quien").textContent = (YO.perfil ? YO.perfil + " · " : "") + (YO.nombre || YO.correo);

  let rr;
  try{ rr = await fetch("/api/revision", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(rr.status === 401){ location.href = "/"; return; }
  $("#cargando").hidden = true;
  if(!rr.ok){
    let e={}; try{ e = await rr.json(); }catch(x){}
    avisa(e.error || "La revisión de clientes no está disponible ahora mismo.", true);
    return;
  }
  D = await rr.json();
  D.sin_planograma = D.sin_planograma || [];
  QUITADAS = new Set((YO.tablas_ocultas||{}).revision || []);
  montaFiltros();
  window.addEventListener("hashchange", pinta);
  pinta();
  const gen = D.generado ? new Date(D.generado) : null;
  $("#pie").textContent = "Sin planograma es la misma regla que el bloque de instalaciones. Sin tarifa y precio distinto son el detalle de la página de tarifas, máquina a máquina: productos repuestos en seis meses, precio exacto por medio de pago."
    + (gen ? ` Calculado el ${gen.toLocaleString("es-ES")}.` : "");
  $("#pie").hidden = false;
  /* La estrella de preferidos de cada tabla, y la vista suelta de /preferidos/ (docs/62). */
  Preferidos.monta("revision", {
    actual: () => VISTA_T,
    abre: t => { if(ruta().t !== t || ruta().m) ir({t, m: ""}); },
    ocultar: ["#vista > .kpis"]});
})();
</script>
