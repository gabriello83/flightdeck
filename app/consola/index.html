<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola · digivend</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M3 4h10v2H3zm0 3h10v2H3zm0 3h6v2H3z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --bien:#0ca30c; --aviso:#fab219; --grave:#ec835a; --critico:#d03b3b;
  /* Las cuatro que lee el selector de tiempo de /comun/periodos.js, para que
     herede el tema de esta pantalla sin conocerlo. */
  --pd-acento:var(--s1); --pd-apagado:var(--tinta-2); --pd-borde:var(--borde-fuerte);
  --pd-fondo:var(--tarjeta);
  --sombra:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --sombra:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --sombra:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.env{max-width:1060px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.marca b{font-size:20px;letter-spacing:-.01em}
.marca span{color:var(--tinta-2);font-size:13px;margin-left:8px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button.btn{
  font:inherit;font-size:13px;color:var(--tinta);background:var(--tarjeta);
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:6px 11px;cursor:pointer;
}
button.btn:hover{border-color:var(--tinta-3)}
button.btn.fuerte{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
button.btn[disabled]{opacity:.55;cursor:progress}
button.btn[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.pestanas{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.nota{
  margin:16px 0;padding:10px 13px;border:1px solid var(--borde);border-left:3px solid var(--s1);
  border-radius:8px;background:var(--tarjeta);color:var(--tinta-2);font-size:13px
}
.nota.mal{border-left-color:var(--critico);color:var(--critico)}
.nota.bien{border-left-color:var(--bien);color:var(--tinta-2)}
section.caja{
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;
  padding:14px 16px 16px;box-shadow:var(--sombra);margin-top:16px
}
section.caja h2{font-size:15px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
section.caja .sub{font-size:12.5px;color:var(--tinta-2);margin:2px 0 12px}
.cabsec{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla{overflow-x:auto}
th{text-align:left;font-weight:600;color:var(--tinta-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:6px 10px 6px 0;border-bottom:1px solid var(--borde)}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--borde);vertical-align:top}
td.n,th.n{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
/* El padding-right:0 es para la ultima columna; si la columna numerica lleva
   otra detras, su cabecera se pega a la siguiente y se leen como una sola. */
td.n:not(:last-child),th.n:not(:last-child){padding-right:18px}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.b{color:var(--bien);border-color:var(--bien)}
.pill.a{color:var(--grave);border-color:var(--grave)}
.pill.c{color:var(--critico);border-color:var(--critico)}
.pill.g{color:var(--tinta-3);border-color:var(--borde-fuerte)}
.cond{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--tinta-2)}
.vacio{color:var(--tinta-3);font-size:13.5px;padding:8px 0}
.enlace{font:inherit;font-size:12.5px;color:var(--critico);background:transparent;border:0;border-bottom:1px dotted;cursor:pointer;padding:0}
.enlace.neutro{color:var(--tinta-2)}
dialog{
  border:1px solid var(--borde);border-radius:14px;background:var(--tarjeta);color:var(--tinta);
  padding:0;width:min(600px,calc(100% - 24px));box-shadow:0 10px 40px rgba(0,0,0,.25)
}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-size:16px;margin:0;padding:16px 18px 2px}
dialog .sub{font-size:12.5px;color:var(--tinta-2);margin:0;padding:0 18px 12px}
dialog .cuerpo{padding:0 18px 4px;max-height:70dvh;overflow-y:auto}
dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--borde);margin-top:12px}
label{display:block;font-size:13px;font-weight:500;margin:0 0 5px}
.campo{margin-bottom:14px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila>.campo{flex:1;min-width:150px}
input,select,textarea{
  width:100%;padding:8px 10px;font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--borde-fuerte);border-radius:8px
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:1px;border-color:var(--s1)}
.marcas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;font-size:13.5px;color:var(--tinta-2)}
.marcas label{display:flex;align-items:center;gap:7px;font-weight:400;margin:0}
.marcas input{width:auto;flex-shrink:0}
.marcas label.fuera{color:var(--tinta-3)}
.marcas label.fuera span{text-decoration:line-through}
.marcas .porque{font-size:11.5px;color:var(--tinta-3);text-decoration:none}
.pista{font-size:12px;color:var(--tinta-3);margin:4px 0 0}
.pista.mal{color:var(--grave)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:11px 13px}
.kpi .et{font-size:12px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .vl{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .nt{font-size:12px;color:var(--tinta-3);margin-top:2px}
@media (max-width:640px){
  .tabla table,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
  .tabla thead{display:none}
  .tabla tr{border-bottom:1px solid var(--borde);padding:10px 0}
  .tabla tr:last-child{border-bottom:0}
  .tabla td{border:0;padding:3px 0}
  .tabla td.n{text-align:left;padding-top:8px}
  .tabla td[data-et]:not(:empty)::before{content:attr(data-et) " · ";color:var(--tinta-3);font-size:12px}
}
footer.pie{margin-top:26px;color:var(--tinta-3);font-size:12px;border-top:1px solid var(--borde);padding-top:12px}
#cargando{padding:40px 0;color:var(--tinta-2)}
</style>
</head>
<body>
<div class="env">
  <header class="top">
    <div class="marca"><b>Consola</b><span id="quien"></span></div>
    <div class="acciones">
      <button class="btn" id="bPanel" type="button">Panel</button>
      <button class="btn" id="bAvisos" type="button">Avisos</button>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="pestanas" id="pestanas" hidden></div>
  <div id="cargando">Cargando…</div>
  <div class="nota mal" id="error" hidden></div>
  <div id="vista"></div>

  <footer class="pie">Todo se sirve desde este dominio. Esta página no llama a ningún sitio externo.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="form">
  <h2 id="dlgTitulo"></h2>
  <p class="sub" id="dlgSub"></p>
  <div class="cuerpo" id="dlgCuerpo"></div>
  <footer>
    <button class="btn" type="button" id="bCancelar">Cancelar</button>
    <button class="btn fuerte" type="submit" id="bGuardar">Guardar</button>
  </footer>
</form></dialog>

<script src="/comun/periodos.js"></script>
<script>
/* ===================================================================
   Consola de administración · digivend.es

   Todo lo que se ve aquí sale de /api/admin/*, y el servidor comprueba en cada
   ruta que quien llama es administrador. Esta página no decide nada: si alguien
   la abre sin serlo, no es que no vea los botones — es que las rutas le
   contestan 403.

   Y no lleva copiadas las reglas del modelo de permisos. El techo de cada tipo
   de perfil, el tipo mínimo de cada sesión y lo que cada tipo trae puesto los
   manda la API en /api/admin/perfiles. Una copia aquí se quedaría vieja el día
   que cambie autorizacion.py, y el síntoma sería un administrador marcando una
   casilla que no hace nada.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => new Intl.NumberFormat("es-ES").format(n||0);
const eur = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bPanel").addEventListener("click", ()=>{ location.href="/panel/"; });
$("#bAvisos").addEventListener("click", ()=>{ location.href="/avisos/"; });
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

/* ---------- llamadas ---------- */
async function api(metodo, ruta, cuerpo){
  const o = {method: metodo, credentials: "same-origin"};
  if(cuerpo !== undefined){ o.headers = {"content-type":"application/json"}; o.body = JSON.stringify(cuerpo); }
  const r = await fetch(ruta, o);
  if(r.status === 401){ location.href = "/"; throw new Error("sin sesion"); }
  let d = {};
  try{ d = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}
function avisa(t, bien){
  const e=$("#error"); e.textContent=t; e.hidden=false;
  e.className = "nota " + (bien ? "bien" : "mal");
  clearTimeout(window._av); window._av = setTimeout(()=>{ e.hidden = true; }, 6000);
}

/* ---------- estado ---------- */
let YO=null, USUARIOS=[], PERFILES=[], SESIONES={}, TECHO={}, NIVELES={}, IMPLICITOS={},
    CONFIG={}, TELEFONOS=[], COLA=[], CARGA=null, SECCION="usuarios", guardando=null;
/* El histórico: la serie diaria del perfil de la sesión y lo último que se
   sumó. Se queda en memoria para que volver a esta pestaña no vuelva a pedirlo. */
let SERIE=null, SELECTOR=null, SUMA=null, RANGO=null;

const SECCIONES = [
  ["usuarios",  "Usuarios"],
  ["perfiles",  "Perfiles"],
  ["plataforma","Plataforma"],
  ["telefonos", "Teléfonos"],
  ["carga",     "Carga"],
  ["historico", "Histórico"],
  ["cola",      "Cola de acciones"],
];

/* El nombre del tipo tal y como se lee, no como se llama la clave. */
const NOMBRE_TIPO = {cliente:"cliente", operaciones:"operaciones", direccion:"dirección", admin:"administrador"};
const tipoLegible = t => NOMBRE_TIPO[t] || t;

function nombrePerfil(id){
  const p = PERFILES.find(x=>x._id===id);
  return p ? (p.nombre || id) : id;
}
function cuando(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? String(iso)
    : d.toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}

/* ================= usuarios ================= */
function vistaUsuarios(){
  const filas = USUARIOS.map(u=>`<tr>
    <td><b>${esc(u.nombre||"—")}</b><br><span class="cond">${esc(u._id)}</span></td>
    <td data-et="Perfil">${esc(nombrePerfil(u.perfil_id))}</td>
    <td data-et="Estado">${u.estado==="bloqueado"
      ? `<span class="pill c">bloqueado</span>` : `<span class="pill b">activo</span>`}</td>
    <td data-et="Asistente">${u.asistente===false ? `<span class="pill g">no</span>` : "sí"}
      ${u.limite_preguntas_dia ? `<br><span class="cond">${num(u.limite_preguntas_dia)}/día</span>` : ""}</td>
    <td class="n">
      <button class="btn" data-ed="${esc(u._id)}">Editar</button>
      <button class="enlace neutro" data-cl="${esc(u._id)}">Nueva contraseña</button>
      <button class="enlace" data-bo="${esc(u._id)}">Borrar</button></td>
  </tr>`).join("");
  return `<section class="caja">
    <div class="cabsec"><h2>Usuarios</h2>
      <button class="btn fuerte" id="bNuevoUsuario" type="button">Nuevo usuario</button></div>
    <p class="sub">${USUARIOS.length} de alta. La contraseña inicial la entregas tú: el usuario tiene que cambiarla al entrar.</p>
    ${USUARIOS.length ? `<div class="tabla"><table>
      <thead><tr><th>Quién</th><th>Perfil</th><th>Estado</th><th>Asistente</th><th></th></tr></thead>
      <tbody>${filas}</tbody></table></div>`
     : `<p class="vacio">Todavía no hay ningún usuario además de ti.</p>`}
  </section>`;
}

function formUsuario(correo){
  const u = correo ? USUARIOS.find(x=>x._id===correo) : null;
  abreDlg(u ? "Editar usuario" : "Nuevo usuario",
    u ? "El correo no se cambia: es la identidad de la cuenta en Cognito."
      : "Se crea en Cognito con la contraseña que pongas, de un solo uso.",
    `<div class="campo">
       <label for="fNombre">Nombre</label>
       <input id="fNombre" required maxlength="80" value="${esc(u?u.nombre:"")}">
     </div>
     <div class="campo">
       <label for="fCorreo">Correo</label>
       <input id="fCorreo" type="email" required ${u?"disabled":""} value="${esc(u?u._id:"")}">
     </div>
     ${u ? "" : `<div class="campo">
       <label for="fClave">Contraseña inicial</label>
       <input id="fClave" type="text" required minlength="12" autocomplete="off">
       <p class="pista">Doce caracteres como mínimo, con mayúscula, minúscula y número. Apúntala: se la tienes que dar tú.</p>
     </div>`}
     <div class="campo">
       <label for="fPerfil">Perfil</label>
       <select id="fPerfil" required>${PERFILES.map(p=>
         `<option value="${esc(p._id)}" ${u&&u.perfil_id===p._id?"selected":""}>${esc(p.nombre||p._id)} · ${esc(tipoLegible(p.tipo||""))}</option>`).join("")}</select>
     </div>
     <div class="fila">
       <div class="campo">
         <label for="fEstado">Estado</label>
         <select id="fEstado">
           <option value="activo" ${u&&u.estado==="bloqueado"?"":"selected"}>Activo</option>
           <option value="bloqueado" ${u&&u.estado==="bloqueado"?"selected":""}>Bloqueado</option>
         </select>
         <p class="pista">Bloquear corta la sesión abierta en la siguiente llamada.</p>
       </div>
       <div class="campo">
         <label for="fLimite">Preguntas al asistente por día</label>
         <input id="fLimite" type="number" min="0" value="${u&&u.limite_preguntas_dia?u.limite_preguntas_dia:0}">
         <p class="pista">0 = el límite general de la plataforma.</p>
       </div>
     </div>
     <div class="campo">
       <label for="fTelefono">Teléfono</label>
       <input id="fTelefono" maxlength="30" placeholder="+34600000000" value="${esc(u&&u.telefono||"")}">
     </div>
     <div class="campo"><div class="marcas">
       <label><input type="checkbox" id="fAsistente" ${u&&u.asistente===false?"":"checked"}> <span>Puede usar el asistente</span></label>
     </div><p class="pista">Aun así hace falta que el perfil lo tenga y que esté encendido para la plataforma.</p></div>`,
    async ()=>{
      const cuerpo = {
        correo: u ? u._id : $("#fCorreo").value.trim().toLowerCase(),
        nombre: $("#fNombre").value.trim(),
        perfil_id: $("#fPerfil").value,
        estado: $("#fEstado").value,
        asistente: $("#fAsistente").checked,
        limite_preguntas_dia: Number($("#fLimite").value)||0,
        telefono: $("#fTelefono").value.trim(),
      };
      if(!u) cuerpo.clave = $("#fClave").value;
      const res = await api("POST","/api/admin/usuarios",cuerpo);
      avisa(res.nuevo ? "Usuario creado. Dale la contraseña y que la cambie al entrar."
                      : "Usuario guardado.", true);
      await carga();
    });
}

function nuevaClave(correo){
  abreDlg("Nueva contraseña", `Para ${correo}. Es de un solo uso: la cambiará al entrar.`,
    `<div class="campo">
       <label for="fClave2">Contraseña</label>
       <input id="fClave2" type="text" required minlength="12" autocomplete="off">
       <p class="pista">Doce caracteres, con mayúscula, minúscula y número.</p>
     </div>`,
    async ()=>{
      await api("POST", `/api/admin/usuarios/${encodeURIComponent(correo)}/clave`, {clave: $("#fClave2").value});
      avisa("Contraseña cambiada. Entrégasela y que la cambie al entrar.", true);
    });
}

/* ================= perfiles ================= */
function vistaPerfiles(){
  const filas = PERFILES.map(p=>{
    const amb = p.ambito || {};
    const trozos = [];
    if((amb.clientes||[]).length) trozos.push("clientes: " + amb.clientes.join(", "));
    if((amb.centros||[]).length) trozos.push("centros: " + amb.centros.length);
    if((amb.delegaciones||[]).length) trozos.push("delegaciones: " + amb.delegaciones.join(", "));
    const cuantos = USUARIOS.filter(u=>u.perfil_id===p._id).length;
    /* Los agregados calculan cada noche el panel de todo perfil de aquí que
       tenga ámbito, sumado a lo que diga config/perfiles.json. Un perfil sin
       ámbito no se calcula: «todo el parque» sólo se declara en ese fichero. */
    const pan = p.panel || {};
    const panel = pan.existe
      ? `<span class="pill b">calculado</span><br><span class="cond">${esc(cuando(pan.calculado))}</span>`
      : `<span class="pill c">sin panel</span>`;
    return `<tr>
      <td><b>${esc(p.nombre||p._id)}</b><br><span class="cond">${esc(p._id)}</span></td>
      <td data-et="Tipo">${esc(tipoLegible(p.tipo||"cliente"))}</td>
      <td data-et="Ámbito"><span class="cond">${esc(trozos.join(" · ") || (pan.existe ? "todo (interno)" : "sin ámbito: no se calcula"))}</span></td>
      <td data-et="Sesiones" class="n">${num((p.sesiones||[]).length)}</td>
      <td data-et="Usuarios" class="n">${num(cuantos)}</td>
      <td data-et="Panel">${panel}</td>
      <td class="n">
        <button class="btn" data-ed="${esc(p._id)}">Editar</button>
        ${cuantos ? "" : `<button class="enlace" data-bo="${esc(p._id)}">Borrar</button>`}</td>
    </tr>`;
  }).join("");
  return `<section class="caja">
    <div class="cabsec"><h2>Perfiles</h2>
      <button class="btn fuerte" id="bNuevoPerfil" type="button">Nuevo perfil</button></div>

      <div class="marcas" id="cajaPermisos"></div>

    <div class="campo">
      <label for="fUmbral">Umbral de rentabilidad por máquina</label>
      <input id="fUmbral" type="number" min="0" step="25"

             placeholder="${esc(CONFIG.umbral_rentabilidad_mes||350)}">
      <p class="pista">€/mes. Vacío = el general de la plataforma (${esc(CONFIG.umbral_rentabilidad_mes||350)} €).</p>
    </div>`;
  abreDlg(p ? "Editar perfil" : "Nuevo perfil",
    "El ámbito se aplica al calcular, no al servir: su panel se escribe ya con sus centros y ningún otro.",
    html, async ()=>{
      const lista = id => $(id).value.split(",").map(x=>x.trim()).filter(Boolean);
      const sesiones = [...document.querySelectorAll("#cajaSesiones input:checked")].map(i=>i.value);
      const permisos = {};
      document.querySelectorAll("#cajaPermisos input").forEach(i=>{ permisos[i.value] = i.checked; });

        perfil_id: p ? p._id : $("#fPid").value.trim(),

        reglas_negocio: umbral ? {umbral_rentabilidad_mes: Number(umbral)} : {},
      });
      avisa(res.ignorados && res.ignorados.length
        ? `Perfil guardado. Sin efecto en este tipo: ${res.ignorados.join(", ")}.`
        : "Perfil guardado.", true);
      await carga();
    });
  /* Las casillas se repintan al cambiar el tipo: lo que un cliente no puede
     tener tiene que verse tachado en el momento, no al guardar. */
  const repinta = () => pintaCasillas(p);
  $("#fTipo").addEventListener("change", repinta);
  repinta();
}

function pintaCasillas(p){
  const tipo = $("#fTipo").value;
  const nivel = NIVELES[tipo] != null ? NIVELES[tipo] : 0;
  const puestas = new Set(p ? (p.sesiones||[]) : []);
  $("#cajaSesiones").innerHTML = Object.entries(SESIONES).map(([id,s])=>{
    const alcanza = (NIVELES[s.minimo] != null ? NIVELES[s.minimo] : 0) <= nivel;
    return `<label class="${alcanza?"":"fuera"}">
      <input type="checkbox" value="${esc(id)}" ${puestas.has(id)?"checked":""} ${alcanza?"":"disabled"}>
      <span>${esc(s.nombre)}</span>${alcanza?"":`<span class="porque">· desde ${esc(tipoLegible(s.minimo))}</span>`}</label>`;
  }).join("");

  const techo = new Set(TECHO[tipo] || []);
  const implicitos = new Set(IMPLICITOS[tipo] || []);
  const dados = (p && p.permisos) || {};
  const todos = [...new Set([].concat(...Object.values(TECHO)))].sort();
  $("#cajaPermisos").innerHTML = todos.map(perm=>{
    const dentro = techo.has(perm);
    const marcado = perm in dados ? !!dados[perm] : (dentro && implicitos.has(perm));
    return `<label class="${dentro?"":"fuera"}">
      <input type="checkbox" value="${esc(perm)}" ${marcado?"checked":""} ${dentro?"":"disabled"}>
      <span>${esc(perm)}</span>${dentro
        ? (implicitos.has(perm) ? `<span class="porque">· de serie</span>` : "")
        : `<span class="porque">· no en ${esc(tipoLegible(tipo))}</span>`}</label>`;
  }).join("");
}

function vistaCarga(){
  if(!CARGA || CARGA.retraso_dias == null)
    return `<section class="caja"><h2>La carga de esta noche</h2>
      <p class="vacio">${esc((CARGA&&CARGA._nota) || "Todavía no hay ninguna carga registrada.")}</p></section>`;
  const r = CARGA;
  const tarde = (r.retraso_dias||0) > 0;
  const fallos = r.descargas_fallidas || 0;
  const porInforme = Object.entries(r.filas_por_informe||{}).sort((a,b)=>(b[1]||0)-(a[1]||0));
  const aCero = porInforme.filter(([,v])=>v===0).map(([k])=>k);
  return `<section class="caja">
    <h2>La carga de esta noche</h2>
    <p class="sub">Corre a las 3:15 y los agregados a las 4:45. La última dejó escrito esto
      ${r.ejecucion ? "el " + esc(cuando(r.ejecucion)) : ""}.</p>
    <div class="kpis">
      <div class="kpi"><div class="et">Descargas</div><div class="vl">${num(r.descargas_ok)}</div>
        <div class="nt">correctas</div></div>
      <div class="kpi"><div class="et">Fallidas</div>
        <div class="vl" ${fallos?'style="color:var(--critico)"':""}>${num(fallos)}</div>
        <div class="nt">${fallos?"hay que mirarlas":"ninguna"}</div></div>
      <div class="kpi"><div class="et">Descargado</div><div class="vl">${((r.bytes||0)/1048576).toFixed(1)} MB</div>
        <div class="nt">en crudo</div></div>
      <div class="kpi"><div class="et">Retraso</div>
        <div class="vl" ${tarde?'style="color:var(--grave)"':""}>${num(r.retraso_dias)} d</div>
        <div class="nt">${tarde?"lo que ves es de otra noche":"al día"}</div></div>
    </div>
    ${tarde ? `<div class="nota mal" style="margin-bottom:0">La carga de esta noche no ha corrido: lo que ven
      los paneles es de hace ${esc(r.retraso_dias)} día(s).</div>` : ""}
    ${aCero.length ? `<div class="nota mal" style="margin-bottom:0">Descargado sin una sola fila:
      <span class="cond">${esc(aCero.join(", "))}</span>. Un informe que baja a cero no da error —se
      descarga igual, vacío—, así que es aquí donde se ve.</div>` : ""}
    ${(r.errores||[]).length ? `<div class="tabla" style="margin-top:14px"><table>
      <thead><tr><th>Informe</th><th>Qué pasó</th></tr></thead><tbody>
      ${r.errores.map(e=>`<tr><td><span class="cond">${esc(e.id||e.informe||"—")}</span></td>
        <td data-et="Error">${esc(e.error||e.motivo||JSON.stringify(e))}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
  </section>
  ${porInforme.length ? `<section class="caja"><h2>Filas por informe</h2>
    <p class="sub">De la última carga. Un informe que baja a cero de un día para otro es la primera señal de que algo cambió en VenCloud.</p>
    <div class="tabla"><table><thead><tr><th>Informe</th><th class="n">Filas</th></tr></thead><tbody>
    ${porInforme.map(([k,v])=>`<tr><td><span class="cond">${esc(k)}</span>
        ${v===0?` <span class="pill c">a cero</span>`:""}</td>
      <td class="n" data-et="Filas">${v==null?"—":num(v)}</td></tr>`).join("")}
    </tbody></table></div></section>` : ""}`;
}

   sale de /api/serie, una fila por día, y la suma la hace /comun/periodos.js:
   el mismo fichero que usan el panel y el cuadro, para que «este mes» signifique
   lo mismo en las tres pantallas. */
function vistaHistorico(){
  const sinHistoria = SERIE && !SERIE.mesesConDato().length;
  return `<section class="caja">
    <h2>Histórico</h2>
    <p class="sub">Desde el 1 de enero de 2025, día a día. Elige el tiempo que quieras mirar:
      los totales y las medias son exactos; las medianas de un rango son aproximadas, porque
      salen del histograma de cada día.</p>
    <div id="selectorPeriodo"></div>
    ${SERIE === null ? `<p class="vacio">El histórico todavía no está calculado. Lo escriben los
       agregados cada noche; la historia anterior al despliegue se rellena una vez a mano.</p>`
      : sinHistoria ? `<p class="vacio">Todavía no hay ningún mes en el histórico. Se rellena una
       vez desde el 1 de enero de 2025 con el evento {"desde": "...", "hasta": "..."} de la Lambda

  </section>
  ${SERIE && !sinHistoria ? `<section class="caja"><h2>Lo que hay cargado, mes a mes</h2>
    <p class="sub">Lo que la serie tiene escrito. Un mes que falta o con pocos días es un relleno

    <div class="tabla"><table><thead><tr><th>Mes</th><th class="n">Días</th>
      <th class="n">Visitas</th><th class="n">Venta</th><th class="n">Tareas SAT</th></tr></thead><tbody>
    ${(SERIE.indice.meses||[]).slice().reverse().map(m=>`<tr>

      <td class="n" data-et="Días">${num(m.dias)}</td>
      <td class="n" data-et="Visitas">${num(m.visitas)}</td>
      <td class="n" data-et="Venta">${eur(m.importe)}</td>
      <td class="n" data-et="Tareas SAT">${num(m.tareas)}</td></tr>`).join("")}
    </tbody></table></div></section>` : ""}`;
}

function pintaCifrasPeriodo(){
  const c = document.getElementById("cifrasPeriodo");
  if(!c) return;
  if(!SUMA){ c.innerHTML = `<p class="vacio">Elige un periodo.</p>`; return; }
  const T = SUMA;
  if(!T.dias){
    c.innerHTML = `<p class="vacio">No hay ningún día cargado en ${esc(Periodos.etiqueta(RANGO.desde, RANGO.hasta))}.
      Si es anterior al relleno, todavía no está; si es hoy, la carga va de noche y trae hasta ayer.</p>`;
    return;
  }
  const d = T.servicio.duracion_min, h = T.sat.horas_cierre;
  const dec = n => new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}).format(n||0);
  c.innerHTML = `<p class="sub">${esc(Periodos.etiqueta(T.desde, T.hasta))} ·
      ${num(T.dias)} ${T.dias===1?"día":"días"} con dato</p>
    <div class="kpis">
      <div class="kpi"><div class="et">Visitas</div><div class="vl">${num(T.servicio.visitas)}</div>
        <div class="nt">de persona</div></div>
      <div class="kpi"><div class="et">Venta</div><div class="vl">${eur(T.venta.importe)}</div>
        <div class="nt">${T.venta.fuentes.includes("visita_ventas")?"del parte: parcial":"telemetría"}</div></div>
      <div class="kpi"><div class="et">Cargado</div><div class="vl">${eur(T.servicio.carga.valor)}</div>
        <div class="nt">${num(T.servicio.carga.unidades)} unidades</div></div>
      <div class="kpi"><div class="et">Merma</div>
        <div class="vl">${eur(Object.values(T.servicio.merma).reduce((a,m)=>a+(m.euros||0),0))}</div>
        <div class="nt">caducidad, rotura y retirada</div></div>
      <div class="kpi"><div class="et">Tareas SAT</div><div class="vl">${num(T.sat.tareas)}</div>
        <div class="nt">${num(T.sat.fallos_tecnicos)} fallos técnicos</div></div>
      <div class="kpi"><div class="et">Visita (mediana)</div>
        <div class="vl">${d.n?dec(d.mediana)+" min":"—"}</div>
        <div class="nt">${d.n?"aproximada · media "+dec(d.media)+" min":"sin medir"}</div></div>
      <div class="kpi"><div class="et">Jornadas</div><div class="vl">${num(T.jornadas.jornadas)}</div>
        <div class="nt">${num(T.jornadas.km_total)} km</div></div>
      <div class="kpi"><div class="et">Cierre de avería</div>
        <div class="vl">${h.n?dec(h.mediana)+" h":"—"}</div>
        <div class="nt">${h.n?"sólo las que abren y cierran el mismo día":"sin cierres del día"}</div></div>
    </div>
    ${T.dinero.lista.length ? `<div class="tabla" style="margin-top:14px"><table>
      <thead><tr><th>Periodo contable</th><th class="n">Efectivo</th><th class="n">Banco</th>
        <th class="n">Total</th><th class="n">Ciego</th></tr></thead><tbody>
      ${T.dinero.lista.slice().reverse().map(p=>`<tr>
        <td><span class="cond">${esc(p.periodo)}</span></td>
        <td class="n" data-et="Efectivo">${eur(p.efectivo)}</td>
        <td class="n" data-et="Banco">${eur(p.banco)}</td>
        <td class="n" data-et="Total">${eur(p.efectivo+p.banco)}</td>
        <td class="n" data-et="Ciego">${p.efectivo>0?dec(100*p.ciego/p.efectivo)+" %":"—"}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="sub">La recaudación se agrupa por su periodo contable, no por el día en que se
        escribió: en un rango de días pueden aparecer meses anteriores.</p>` : ""}`;
}

async function montaSelectorHistorico(){
  const caja = document.getElementById("selectorPeriodo");
  if(!caja || !window.Periodos || !SERIE) return;
  Periodos.ponEstilo();
  SELECTOR = Periodos.montaSelector(caja, {
    primerDia: SERIE.primerDia(),
    inicial: RANGO ? null : "mes",
    alCambiar: async ({desde, hasta}) => {
      RANGO = {desde, hasta};
      try{ SUMA = await SERIE.totales(desde, hasta); }
      catch(e){ avisa("No se ha podido leer el histórico: " + e.message); return; }
      pintaCifrasPeriodo();
    }
  });
  if(RANGO){ SELECTOR.pon(RANGO.desde, RANGO.hasta); }
}

    ${COLA.length ? `<div class="tabla"><table>
      <thead><tr><th>Cuándo</th><th>Qué</th><th>Pedido por</th><th>Estado</th></tr></thead>
      <tbody>${filas}</tbody></table></div>` : `<p class="vacio">No hay nada en cola.</p>`}
  </section>`;
}

/* ---------- diálogo genérico ---------- */
function abreDlg(titulo, sub, html, alGuardar){
  $("#dlgTitulo").textContent = titulo;
  $("#dlgSub").textContent = sub || "";
  $("#dlgCuerpo").innerHTML = html + `<p class="nota mal" id="errForm" hidden></p>`;
  guardando = alGuardar;
  $("#dlg").showModal();
  const primero = $("#dlgCuerpo").querySelector("input:not([disabled]),select");
  if(primero) primero.focus();
}
$("#bCancelar").addEventListener("click", ()=>$("#dlg").close());
$("#form").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!guardando) return;
  $("#bGuardar").disabled = true;
  try{
    await guardando();
    $("#dlg").close();
  }catch(err){
    const p = $("#errForm"); p.textContent = err.message || "No se ha podido guardar."; p.hidden = false;
  }finally{ $("#bGuardar").disabled = false; }
});

/* ---------- montaje ---------- */
function pinta(){
  $("#pestanas").innerHTML = SECCIONES.map(([id,n])=>
    `<button class="btn" type="button" data-s="${id}" aria-pressed="${id===SECCION}">${esc(n)}</button>`).join("");
  $("#pestanas").hidden = false;
  $("#pestanas").querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    SECCION = b.dataset.s; pinta();
  }));
  const v = $("#vista");
  v.innerHTML = ({usuarios: vistaUsuarios, perfiles: vistaPerfiles, plataforma: vistaPlataforma,
                  telefonos: vistaTelefonos, carga: vistaCarga, historico: vistaHistorico,
                  cola: vistaCola}[SECCION] || vistaUsuarios)();
  if(SECCION==="historico") montaSelectorHistorico();

  if(SECCION==="usuarios"){
    $("#bNuevoUsuario").addEventListener("click", ()=>formUsuario(null));
    v.querySelectorAll("[data-ed]").forEach(b=>b.addEventListener("click", ()=>formUsuario(b.dataset.ed)));
    v.querySelectorAll("[data-cl]").forEach(b=>b.addEventListener("click", ()=>nuevaClave(b.dataset.cl)));
    v.querySelectorAll("[data-bo]").forEach(b=>b.addEventListener("click", ()=>borraUsuario(b.dataset.bo)));
  }
  if(SECCION==="perfiles"){
    $("#bNuevoPerfil").addEventListener("click", ()=>formPerfil(null));
    v.querySelectorAll("[data-ed]").forEach(b=>b.addEventListener("click", ()=>formPerfil(b.dataset.ed)));
    v.querySelectorAll("[data-bo]").forEach(b=>b.addEventListener("click", ()=>borraPerfil(b.dataset.bo)));
  }
  if(SECCION==="plataforma") $("#bGuardaConfig").addEventListener("click", guardaConfig);
  if(SECCION==="telefonos"){
    $("#bNuevoTel").addEventListener("click", formTelefono);
    v.querySelectorAll("[data-bo]").forEach(b=>b.addEventListener("click", ()=>borraTelefono(b.dataset.bo)));
  }
}

async function borraUsuario(correo){
  if(correo === YO.correo) return avisa("No puedes borrar tu propia cuenta.");
  if(!confirm(`¿Borrar a ${correo}? Se borra también de Cognito y no se puede deshacer.`)) return;
  try{ await api("DELETE", `/api/admin/usuarios/${encodeURIComponent(correo)}`); avisa("Usuario borrado.", true); await carga(); }
  catch(e){ avisa(e.message); }
}
async function borraPerfil(pid){
  if(!confirm(`¿Borrar el perfil «${nombrePerfil(pid)}»?`)) return;
  try{ await api("DELETE", `/api/admin/perfiles/${encodeURIComponent(pid)}`); avisa("Perfil borrado.", true); await carga(); }
  catch(e){ avisa(e.message); }
}
async function borraTelefono(id){
  if(!confirm("¿Borrar este teléfono?")) return;
  try{ await api("DELETE", `/api/admin/telefonos/${encodeURIComponent(id)}`); avisa("Teléfono borrado.", true); await carga(); }
  catch(e){ avisa(e.message); }
}
async function guardaConfig(){
  const b = $("#bGuardaConfig"); b.disabled = true;
  try{
    CONFIG = await api("PUT","/api/admin/config",{
      asistente_global: $("#cAsistente").checked,
      limite_preguntas_dia: Number($("#cLimite").value)||0,
      umbral_rentabilidad_mes: Number($("#cUmbral").value)||0,
    });
    avisa("Guardado. El interruptor global tiene efecto en la siguiente pregunta de cualquiera.", true);
  }catch(e){ avisa(e.message); }
  finally{ b.disabled = false; }
}

async function carga(){
  const [us, pf, cf, tl] = await Promise.all([
    api("GET","/api/admin/usuarios"),
    api("GET","/api/admin/perfiles"),
    api("GET","/api/admin/config"),
    api("GET","/api/admin/telefonos"),
  ]);
  USUARIOS = us.usuarios || [];
  PERFILES = pf.perfiles || [];
  SESIONES = pf.catalogo_sesiones || {};
  TECHO = pf.techo || {};
  NIVELES = pf.niveles || {};
  IMPLICITOS = pf.implicitos || {};
  CONFIG = cf || {};
  TELEFONOS = tl.telefonos || [];
  /* Estas dos pueden no estar todavía (sin carga nocturna aún, por ejemplo) y no
     deben impedir que la consola se abra. */
  try{ COLA = (await api("GET","/api/admin/cola")).cola || []; }catch(e){ COLA = []; }
  try{ CARGA = await api("GET","/api/estado-carga"); }catch(e){ CARGA = null; }
  /* El histórico tampoco debe impedir que la consola se abra: recién
     desplegado no existe todavía, y la pestaña lo dice en vez de fallar. */
  try{
    const s = new Periodos.Serie();
    await s.abre();
    SERIE = s;
  }catch(e){ SERIE = null; }
  pinta();
}

(async function(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  YO = await r.json();
  $("#quien").textContent = `${YO.nombre || YO.correo} · ${YO.perfil || ""}`;
  if(YO.tipo !== "admin"){
    $("#cargando").hidden = true;
    avisa("Esta pantalla es sólo para el administrador.");
    $("#vista").innerHTML = `<section class="caja"><h2>No es tu pantalla</h2>
      <p class="sub">Tu panel está en <a href="/panel/">/panel/</a>.</p></section>`;
    return;
  }
  try{ await carga(); }
  catch(e){ $("#cargando").textContent = "No se ha podido cargar la consola: " + e.message; return; }
  $("#cargando").hidden = true;
})();
</script>
