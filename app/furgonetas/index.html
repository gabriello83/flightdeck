<style>

  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;

}

/* Las cifras de un área filtran la tabla: son botones. */
button.kpi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;cursor:pointer;
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:11px 13px;box-shadow:var(--sombra)}

@media (max-width:700px){

<body>
<div class="env">
  <header class="top">
    <div class="marca">
      <b>Furgonetas</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/operativo/">Informe general</a>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>

  <div id="todo" hidden>
    <div class="barra">
      <label>Día <select id="dia"></select></label>
      <span id="fLugar"></span>
      <label class="busca enArea">Buscar <input id="busca" type="search" placeholder="Matrícula, modelo, persona…"></label>
      <button class="btn enArea" id="bCsv" type="button">Descargar CSV</button>
    </div>

    <div id="portada" hidden>
      <p class="sub" id="sAreas"></p>
      <div class="areas" id="areas"></div>
    </div>

    <div id="vistaArea" hidden>
      <div class="volver"><button class="btn" id="bAreas" type="button">← Todas las áreas</button><h2 id="tArea"></h2></div>
      <div class="kpis" id="kpis"></div>
      <section class="caja" id="cajaTabla" data-tabla="vehiculos">
        <div class="cabsec" data-estrella="vehiculos"><h2 id="tTabla">Furgonetas activas</h2><span class="tenue" id="cuenta"></span></div>
        <p class="sub" id="sTabla"></p>
        <div class="tabla" id="tabla"></div>
        <div class="leyenda" id="leyenda"></div>
      </section>
      <section class="caja" data-tabla="dias">
        <div class="cabsec" data-estrella="dias"><h2>Furgonetas con visitas, día a día</h2><span class="tenue" id="cuentaDias"></span></div>
        <p class="sub" id="sDias"></p>

  <footer id="pie" hidden></footer>

<script>
/* ===================================================================
   Furgonetas · digivend.es  (docs/58)

   Lo que hay detrás del cuadrado de Furgonetas del informe general, como lo
   pidió Gabriele el 19-oct-2026:

   · La portada: un cuadrante por área (Centro, Sur, Cataluña, Levante,
     Norte) con el % de furgonetas que están bien: se usaron en la última
     semana y sus km de cada día están entre 10 y 400.
   · Dentro de un área: cuatro cifras (activas, con visitas, sin visitas, km
     en rojo) que filtran la tabla al pulsarlas, y la tabla de furgonetas
     activas con su modelo, la persona de la ruta, su última visita, los km de
     los últimos 7 días y los acumulados desde el 1 de enero de 2025.

   La flota es el maestro de vehículos de VenCloud (M12); las visitas, los
   partes y la SAT; los km, el control de jornada (D5). Lo que no está se
   dice: una jornada sin cuentakilómetros no es un cero.

   El fichero ya llega con el ámbito del perfil aplicado: lo escribió la noche
   para este perfil, y la API no deja pedir otro. Esta página no decide qué
   furgonetas ve nadie: filtra y dibuja.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const num = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const dec = n => new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}).format(n);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const MAX_FILAS = 60, DIAS_KM = 7, DIAS_VISTA = 30;
const ORDEN_AREAS = ["Centro", "Sur", "Cataluña", "Levante", "Norte", "Otra zona"];

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

/* AREA: "" es la portada; "*" son todas las áreas juntas (un perfil de una
   sola área, o la vista suelta de preferidos). VER: la cifra que filtra. */
let D=null, TODAS=false, AREA="", VER="", UMBRAL={min:10, max:400}, SEMANA=7;
/* Area, delegacion, cliente y centro, con seleccion multiple y buscador
   (David, 22-oct, docs/73). La portada sale mientras no se elige nada. */
let F = null;
/* El reparto por centro de cada mes (docs/72): mes -> {dias} o null. De ahi
   salen las furgonetas que visitaron cada centro cada dia. */
const MESES = {};
/* La historia (docs/79): los días del fichero y los de cada mes de antes, que
   se piden al elegir un día. HISTORIA: mes -> true cuando ya está junto. */
let DIAS_TODOS = [];
const HISTORIA = {};

function fechaLarga(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s)
    : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function fechaCorta(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
}
function diaMes(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("es-ES",{weekday:"short", day:"numeric"});
}
function fechaNum(s){ const [a,m,d] = String(s||"").split("-"); return d ? `${d}/${m}/${a}` : String(s||""); }
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const entre = (a, b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 864e5);
function avisa(t, mal){ const a=$("#aviso"); a.textContent=t; a.hidden=!t; a.classList.toggle("mal", !!mal); }
function semaforo(p){
  const u = D.umbrales || {verde:95, amarillo:75};
  return p == null ? "" : p > u.verde ? "verde" : p >= u.amarillo ? "amarillo" : "rojo";
}

/* La última visita de una furgoneta el día elegido o antes. null si no
   visitó desde que hay datos (D.desde). */
function ultima(m, dia){
  const fs = (D.visitas||{})[m] || [];
  for(let i=fs.length-1; i>=0; i--) if(fs[i] <= dia) return fs[i];
  return null;
}
/* Los km de una furgoneta un día: {t: texto, c: clase, x: explicación, v: valor para el CSV, rojo, jornada}. */
function km(m, f){
  const dia = (D.km||{})[f];
  if(!dia) return {t:"s/d", c:"nada", x:"No se leyeron las jornadas de ese día.", v:"sin dato", rojo:false, jornada:false};
  const k = dia[m];
  if(!k) return {t:"—", c:"nada", x:"No abrió jornada ese día.", v:"", rojo:false, jornada:false};
  const [n, jor, falta] = k;
  const varias = jor > 1 ? ` (${jor} jornadas)` : "";
  if(n == null) return {t:"sin km", c:"falta", x:`Sin km: ${falta}${varias}.`, v:`sin km (${falta})`, rojo:true, jornada:true};
  const fuera = n < UMBRAL.min || n > UMBRAL.max;
  return {t:num(n), c:fuera ? "fuera" : "", x:`${num(n)} km${varias}${falta ? ` · otra ${falta}` : ""}`, v:n, rojo:fuera, jornada:true};
}
/* Los días de la semana que acaba en el elegido, y los de la tabla. */
const hasta = (dia, n) => DIAS_TODOS.filter(f=>f<=dia).slice(-n);
/* Desde cuándo se conocen las visitas para ese día: lo del fichero, o el
   primer día de los meses de la historia que hay seguidos hasta él. */
function desdeConocido(dia){
  if(dia >= D.desde) return D.desde;
  let m = dia.slice(0,7), desde = dia;
  while(HISTORIA[m]){
    desde = `${m}-01`;
    const d = new Date(+m.slice(0,4), +m.slice(5,7)-2, 1);
    m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  return desde;
}
/* Los meses de la historia de los días que se ven (la tabla de los últimos
   DIAS_VISTA): sus km y sus visitas se juntan con los del fichero. */
async function cargaHistoria(){
  const dia = $("#dia").value, fijos = new Set(D.dias);
  const faltan = [...new Set(hasta(dia, DIAS_VISTA).filter(f=>!fijos.has(f)).map(f=>f.slice(0,7)))]
    .filter(m=>!HISTORIA[m] && (D.meses_dias||{})[m]);
  if(!faltan.length) return;
  $("#todo").style.opacity = ".55";
  let fallo = false;
  await Promise.all(faltan.map(async m=>{
    try{
      const r = await fetch(`/api/furgonetas?mes=${encodeURIComponent(m)}`, {credentials:"same-origin"});
      if(r.status===401){ location.href = "/"; return; }
      if(!r.ok){ fallo = true; return; }
      const x = await r.json();
      D.km = D.km || {}; D.visitas = D.visitas || {};
      for(const [f, d] of Object.entries(x.dias||{})){
        if(fijos.has(f)) continue;
        if(d.km) D.km[f] = d.km;
        (d.v||[]).forEach(mat=>{ (D.visitas[mat] = D.visitas[mat] || []).push(f); });
      }
      Object.values(D.visitas).forEach(l=>l.sort());
      HISTORIA[m] = true;
    }catch(e){ fallo = true; }
  }));
  $("#todo").style.opacity = "";
  if(fallo) avisa("No se han podido leer todos los días de lo elegido: comprueba la conexión y vuelve a elegirlo.", true);
}

/* Lo de una furgoneta el día elegido: si está bien y por qué no. Bien = se
   usó en la última semana (visita o jornada) y ningún día de esa semana tuvo
   los km en rojo. */
function estado(x, dia){
  const semana = hasta(dia, SEMANA), d0 = semana[0] || dia;
  const u = ultima(x.m, dia);
  const kms = semana.map(f=>km(x.m, f));
  const usada = (u && u >= d0) || kms.some(k=>k.jornada);
  const rojos = kms.filter(k=>k.rojo).length;
  const motivos = [];
  if(!usada) motivos.push(`sin usar en ${semana.length} días`);
  if(rojos) motivos.push(`${rojos} ${rojos===1?"día":"días"} con km en rojo`);
  return {u, sin: u == null ? null : entre(u, dia), ok: !motivos.length, motivos, hoy: km(x.m, dia)};
}

/* Una furgoneta puede llevar rutas de varias delegaciones («A · B»): entra si
   alguna está en lo elegido. */
const delegsDe = x => String(x.d||"").split(" · ").filter(Boolean);
const enLugar = x => (!F.sel.areas.length || F.sel.areas.includes(x.z))
  && (!F.sel.delegs.length || delegsDe(x).some(d => F.sel.delegs.includes(d)));

/* Con cliente o centro: las matrículas que visitaron esos centros en la
   semana hasta el día elegido, del reparto por centro. `sin` son los días de
   esa semana que no lo tienen. */
function deLosCentros(dia){
  const semana = hasta(dia, SEMANA), m = new Set(); let sin = 0;
  semana.forEach(f=>{
    const mes = MESES[f.slice(0,7)], d = mes && (mes.dias||{})[f], por = d && d.furgonetas;
    if(!por){ sin++; return; }
    Object.entries(por).forEach(([c, a])=>{ if(F.pasaCentro(c)) (a[2]||[]).forEach(x=>m.add(x)); });
  });
  return {m, sin, dias: semana.length};
}
async function cargaMeses(){
  if(!F.porCentro()) return;
  const meses = [...new Set(hasta($("#dia").value, SEMANA).map(f=>f.slice(0,7)))].filter(m=>!(m in MESES));
  const l = await Promise.all(meses.map(m=>Filtros.mesCentros(m)));
  meses.forEach((m, i)=>{ MESES[m] = l[i]; });
}
async function repinta(){ await cargaHistoria(); await cargaMeses(); pinta(); }

/* ---------------------------------------------------------------- portada */
function pintaPortada(){
  const dia = $("#dia").value, por = {};
  (D.flota||[]).forEach(x=>{ const a = por[x.z] = por[x.z] || {n:0, ok:0, sinUso:0, km:0};
    const e = estado(x, dia); a.n++; if(e.ok) a.ok++;
    if(e.motivos.some(t=>t.startsWith("sin usar"))) a.sinUso++;
    if(e.motivos.some(t=>t.includes("km en rojo"))) a.km++; });
  const areas = Object.keys(por).sort((a,b)=>ORDEN_AREAS.indexOf(a)-ORDEN_AREAS.indexOf(b) || a.localeCompare(b,"es"));
  $("#sAreas").textContent = `Una furgoneta está bien si se usó en los ${SEMANA} días hasta el ${fechaCorta(dia)} `
    + `(con visitas o con jornada) y ninguno de esos días tuvo menos de ${num(UMBRAL.min)} km, más de ${num(UMBRAL.max)} o la jornada sin km. Pulsa un área para ver sus furgonetas.`;
  $("#areas").innerHTML = areas.map(a=>{ const x = por[a], p = x.n ? 100*x.ok/x.n : null;
    return `<button class="area ${semaforo(p)}" type="button" data-area="${esc(a)}">
      <div class="nom">${esc(a)}</div>
      <div class="pc">${p==null ? "—" : dec(p) + " %"}</div>
      <div class="nt">${num(x.ok)} de ${num(x.n)} furgonetas bien</div>
      <div class="nt">${num(x.sinUso)} sin usar · ${num(x.km)} con km en rojo</div>
    </button>`; }).join("");
  $("#areas").querySelectorAll("button.area").forEach(b=>b.addEventListener("click", ()=>abreArea(b.dataset.area)));
}

/* ---------------------------------------------------------------- un área */
function flotaArea(){
  const c = F.porCentro() ? deLosCentros($("#dia").value).m : null;
  return (D.flota||[]).filter(x=>enLugar(x) && (!c || c.has(x.m)));
}

function filas(){
  const dia = $("#dia").value, q = $("#busca").value.trim().toLowerCase(), fks = hasta(dia, DIAS_KM);
  return flotaArea()
    .filter(x=>!q || [x.m, x.n, x.mod, x.p, x.r, x.d].join(" ").toLowerCase().includes(q))
    .map(x=>Object.assign({}, x, estado(x, dia), {kms: fks.map(f=>km(x.m, f))}))
    .filter(x=> VER==="con" ? x.sin===0 : VER==="sin" ? x.sin!==0 : VER==="km" ? x.hoy.rojo : true)
    /* Primero las que no están bien, y entre ellas las que llevan más días sin visitar. */
    .sort((a,b)=> (a.ok - b.ok) || (b.sin==null ? 1e9 : b.sin) - (a.sin==null ? 1e9 : a.sin)
      || a.d.localeCompare(b.d, "es") || a.m.localeCompare(b.m, "es"));
}

function textoUltima(x, dia){
  if(x.sin === 0) return `<span class="si">Visitó</span>`;
  const cuando = x.u ? `<span class="tenue">${esc(fechaCorta(x.u))}</span><br>` : "";
  if(x.sin == null) return `${cuando}<span class="no">Más de ${num(entre(desdeConocido(dia), dia))} días</span>`;
  return `${cuando}<span class="no">${num(x.sin)} ${x.sin===1?"día":"días"}</span>`;
}

function kpis(){
  const dia = $("#dia").value, flota = flotaArea();
  const todas = flota.map(x=>Object.assign({}, x, estado(x, dia)));
  const con = todas.filter(x=>x.sin===0).length;
  const largas = todas.filter(x=>x.sin==null || x.sin > 7).length;
  const rojas = todas.filter(x=>x.hoy.rojo).length;
  const bien = todas.filter(x=>x.ok).length;
  const kpi = (id, et, vl, nt) => `<button class="kpi" type="button" data-ver="${id}" aria-pressed="${VER===id}">
    <div class="et">${esc(et)}</div><div class="vl">${vl}</div><div class="nt">${nt}</div></button>`;
  $("#kpis").innerHTML =
    kpi("", "Furgonetas activas", num(flota.length),
        `${num(bien)} bien (${flota.length ? dec(100*bien/flota.length) : "—"} %) · en el maestro de VenCloud`)
    + kpi("con", "Con visitas", num(con), `el ${esc(fechaCorta(dia))}`)
    + kpi("sin", "Sin visitas", `<span class="${flota.length-con ? "no" : ""}">${num(flota.length-con)}</span>`,
          `${num(largas)} ${largas===1?"lleva":"llevan"} más de 7 días`)
    + kpi("km", "Km en rojo", `<span class="${rojas ? "no" : ""}">${num(rojas)}</span>`,
          (D.km||{})[dia] ? `ese día: menos de ${num(UMBRAL.min)} o más de ${num(UMBRAL.max)} km, o sin km` : "no se leyeron las jornadas de ese día");
  $("#kpis").querySelectorAll("button.kpi").forEach(b=>b.addEventListener("click", ()=>{
    VER = (VER === b.dataset.ver) ? "" : b.dataset.ver; TODAS=false; pintaArea(); }));
}

const TITULO = {"":"Furgonetas activas", con:"Furgonetas con visitas ese día", sin:"Furgonetas sin visitas ese día", km:"Furgonetas con km en rojo ese día"};

function pintaArea(){
  const dia = $("#dia").value, fks = hasta(dia, DIAS_KM), fs = filas();
  $("#tArea").textContent = F.texto();
  kpis();
  $("#tTabla").textContent = TITULO[VER];
  $("#cuenta").textContent = `${num(fs.length)} ${fs.length===1?"furgoneta":"furgonetas"}`;
  const desde = D.km_desde ? fechaNum(D.km_desde) : null;
  $("#sTabla").textContent = "Cada furgoneta activa del maestro de vehículos, con la persona de su ruta, su última visita "
    + `y los km de sus jornadas de los últimos ${fks.length} días. Primero las que no están bien.`
    + (VER ? " Vuelve a pulsar la cifra para ver todas." : "") + textoCentros(dia);
  if(!fs.length){
    $("#tabla").innerHTML = `<p class="vacio">Ninguna${F.alguno() || $("#busca").value || VER ? " con este filtro" : ""}.</p>`;
  }else{
    const vis = fs.slice(0, TODAS ? fs.length : MAX_FILAS);
    $("#tabla").innerHTML = `<table><thead><tr><th>Matrícula</th><th>Modelo</th><th>Persona de la ruta</th><th>Delegación</th>
      <th>Última visita</th>
      ${fks.map(f=>`<th class="km${f===dia?" hoy":""}" title="${esc(fechaLarga(f))}">${esc(diaMes(f))}</th>`).join("")}
      <th class="num">${desde ? `Km desde ${esc(desde)}` : "Km acumulados"}</th><th>Estado</th></tr></thead><tbody>
      ${vis.map(x=>`<tr>
        <td data-et="Matrícula"><span class="mat">${esc(x.m)}</span></td>
        <td data-et="Modelo">${x.mod ? esc(x.mod) : `<span class="tenue" title="La ficha de VenCloud no tiene modelo">—</span>`}<br><span class="tenue">${esc(x.n)}</span></td>
        <td data-et="Persona de la ruta">${x.p ? esc(x.p) : `<span class="tenue">sin ruta</span>`}${
          x.pr==="jornada" ? `<br><span class="tenue">sin ruta · su última jornada</span>` : x.r ? `<br><span class="tenue">${esc(x.r)}</span>` : ""}</td>
        <td data-et="Delegación">${esc(x.d)}</td>
        <td data-et="Última visita">${textoUltima(x, dia)}</td>
        ${x.kms.map((k,i)=>`<td class="km${fks[i]===dia?" hoy":""}" data-et="${esc(diaMes(fks[i]))}" title="${esc(fechaLarga(fks[i]))}: ${esc(k.x)}"><span class="${k.c}">${esc(k.t)}</span></td>`).join("")}
        <td data-et="${desde ? `Km desde ${esc(desde)}` : "Km acumulados"}" class="num">${x.km==null ? `<span class="tenue">sin dato</span>` : num(x.km)}${
          x.skm ? `<br><span class="tenue">${num(x.skm)} ${x.skm===1?"jornada":"jornadas"} sin km</span>` : ""}</td>
        <td data-et="Estado" class="est">${x.ok ? `<span class="si">Bien</span>` : `<span class="no">${esc(x.motivos.join(" · "))}</span>`}</td>
      </tr>`).join("")}
      </tbody></table>`
      + (fs.length > vis.length ? `<p class="vacio"><button class="btn" type="button" id="bTodas">Ver todas (${num(fs.length)})</button></p>` : "");
    const b = $("#bTodas"); if(b) b.addEventListener("click", ()=>{ TODAS=true; pintaArea(); });
  }
  $("#leyenda").innerHTML = `<span><b class="no">En rojo</b>: menos de ${num(UMBRAL.min)} km o más de ${num(UMBRAL.max)} km ese día.</span>`
    + `<span><b class="no">sin km</b>: abrió jornada sin cuentakilómetros, sin cerrarla o mal anotada.</span>`
    + `<span><b>—</b>: no abrió jornada.</span><span><b>s/d</b>: no se leyeron las jornadas.</span>`
    + ((D.flota||[]).some(x=>x.mod) ? "" : `<span><b>Modelo</b>: VenCloud no tiene el modelo de ninguna furgoneta; debajo va el nombre de su ficha.</span>`)
    + (desde ? `<span><b>Km desde ${esc(desde)}</b>: suma de sus jornadas bien anotadas hasta el ${esc(fechaNum(D.ultimo_dia))}; las que no tienen km no suman y se dicen.</span>` : "");
  pintaDias();
}

/* Lo que significa el filtro de cliente o centro aquí, y lo que falta. */
function textoCentros(dia){
  if(!F.porCentro()) return "";
  const c = deLosCentros(dia);
  return ` Con cliente o centro salen las furgonetas que visitaron sus centros en los ${num(c.dias)} días hasta el ${fechaCorta(dia)}.`
    + (c.sin === c.dias ? " Esos días no tienen el reparto por centro: empezó a calcularse la noche del 22 de octubre de 2026."
      : c.sin ? ` ${num(c.sin)} de esos días no tienen el reparto por centro (empezó la noche del 22 de octubre de 2026).` : "");
}

/* Cuántas de la flota del área visitaron cada día hasta el elegido. */
function pintaDias(){
  const dia = $("#dia").value, flota = flotaArea().map(x=>x.m);
  const dias = hasta(dia, DIAS_VISTA).reverse();
  const filas = dias.map(f=>[f, flota.filter(m=>((D.visitas||{})[m]||[]).includes(f)).length]);
  const max = Math.max(1, flota.length);
  $("#cuentaDias").textContent = `${num(filas.length)} días`;
  $("#sDias").textContent = `De ${num(flota.length)} furgonetas activas. `
    + "Los fines de semana y los festivos salen muchas menos: compara con el mismo día de otras semanas.";
  $("#dias").innerHTML = `<div class="barras">${filas.map(([f, n])=>
    `<div class="fb${f===dia?" hoy":""}" title="${esc(fechaLarga(f))}: ${num(n)} de ${num(flota.length)} furgonetas con visitas">
      <span class="nom">${esc(fechaCorta(f))}</span>
      <span class="pis"><span class="b" style="width:${Math.max(.5, 100*n/max)}%"></span><span class="v">${num(n)}</span></span>
    </div>`).join("")}</div>`;
}

/* Los cuatro filtros: las delegaciones de la flota, y los clientes y centros
   de las fichas del informe general. */
async function montaFiltros(){
  const fi = await Filtros.fichas(), zonas = {};
  (D.flota||[]).forEach(x=>delegsDe(x).forEach(d=>{ zonas[d] = (fi.zonas||{})[d] || x.z; }));
  F = Filtros.cuatro($("#fLugar"), {zonas, centros: fi.centros || {},
    zonaDe: d => (fi.zonas||{})[d] || "Otra zona",
    ordenAreas: (a, b)=>ORDEN_AREAS.indexOf(a)-ORDEN_AREAS.indexOf(b) || a.localeCompare(b,"es"),
    alCambiar: ()=>{ VER = ""; TODAS = false; repinta(); }});
}

let VARIAS_AREAS = false;
function pinta(){
  AREA = VARIAS_AREAS && !Preferidos.solo && !F.alguno() ? "" : "*";
  const portada = AREA === "";
  $("#portada").hidden = !portada;
  $("#vistaArea").hidden = portada;
  document.querySelectorAll(".enArea").forEach(el=>{ el.hidden = portada; });
  if(QUITADAS.has("vehiculos")) $("#bCsv").hidden = true;
  $("#bAreas").hidden = !VARIAS_AREAS || !!Preferidos.solo;
  if(portada) pintaPortada(); else pintaArea();
}
/* Pulsar un área es elegirla en el filtro; «Todas las áreas» lo quita todo. */
function abreArea(a){
  VER = ""; TODAS = false; $("#busca").value = "";
  if(a) F.pon("areas", [a]); else F.limpia();
  window.scrollTo(0, 0);
}

function csv(){
  const dia = $("#dia").value, fks = hasta(dia, DIAS_KM);
  const q = v => { const s = String(v==null?"":v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const cab = ["Matrícula", "Modelo", "Nombre en VenCloud", "Persona de la ruta", "Ruta(s)", "Delegación", "Área",
    "Última visita", "Días sin visitas", ...fks.map(f=>`km ${f}`),
    D.km_desde ? `Km desde ${D.km_desde}` : "Km acumulados", "Jornadas sin km", "Estado"];
  const lineas = filas().map(x=>[x.m, x.mod, x.n, x.p + (x.pr==="jornada" ? " (última jornada)" : ""), x.r, x.d, x.z,
    x.u || `antes del ${desdeConocido(dia)}`, x.sin == null ? `más de ${entre(desdeConocido(dia), dia)}` : x.sin, ...x.kms.map(k=>k.v),
    x.km == null ? "sin dato" : x.km, x.skm == null ? "" : x.skm, x.ok ? "Bien" : x.motivos.join(" · ")]);
  const texto = "﻿" + [cab, ...lineas].map(l=>l.map(q).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([texto], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = `furgonetas_${F.alguno() ? F.texto().replace(/[^\w\-]+/g, "_") + "_" : ""}${dia}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

let QUITADAS = new Set();
(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  const yo = await r.json();
  if(yo.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  /* Lo que el administrador le quitó a este usuario dentro de esta página
     (docs/61): no se dibuja, y lo que sólo usa esa tabla ya no llega. */
  QUITADAS = new Set((yo.tablas_ocultas||{})["furgonetas"] || []);
  document.querySelectorAll("[data-tabla]").forEach(el=>{ if(QUITADAS.has(el.dataset.tabla)) el.hidden = true; });

  $("#quien").textContent = (yo.perfil ? yo.perfil + " · " : "") + (yo.nombre || yo.correo);

  let rf;
  try{ rf = await fetch("/api/furgonetas", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(rf.status === 401){ location.href = "/"; return; }
  $("#cargando").hidden = true;
  if(!rf.ok){
    let d={}; try{ d = await rf.json(); }catch(e){}
    avisa(d.error || "Las furgonetas no están disponibles ahora mismo.", true);
    return;
  }
  D = await rf.json();
  if(!Array.isArray(D.dias) || !D.dias.length){ avisa(D.sin_dato || "Todavía no hay ningún día calculado.", true); return; }
  if(D.sin_dato) avisa(D.sin_dato, true);
  UMBRAL = Object.assign(UMBRAL, D.umbrales_km || {});
  SEMANA = D.semana || SEMANA;
  const todos = new Set(D.dias);
  for(const [m, ds] of Object.entries(D.meses_dias||{}))
    for(const d of ds) todos.add(`${m}-${String(d).padStart(2,"0")}`);
  DIAS_TODOS = [...todos].sort();
  const dias = DIAS_TODOS.slice().reverse();
  $("#dia").innerHTML = dias.map(f=>`<option value="${esc(f)}">${esc(fechaLarga(f))}</option>`).join("");
  /* El día que llega en la dirección (desde el cuadrado), o ayer, o el último. */
  const q = new URLSearchParams(location.search), pedido = q.get("dia");
  const hoy = new Date(), ayer = isoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()-1));
  $("#dia").value = dias.includes(pedido) ? pedido : dias.includes(ayer) ? ayer : dias[0];
  if(!dias.includes(pedido) && !dias.includes(ayer) && !D.sin_dato)
    avisa(`Todavía no hay datos de ayer: lo último calculado es del ${fechaLarga(dias[0])}.`, true);
  /* Con una sola área no hay portada; en la vista suelta, tampoco. */
  const areas = [...new Set((D.flota||[]).map(x=>x.z))];
  VARIAS_AREAS = areas.length > 1;
  await montaFiltros();
  await cargaHistoria();
  await cargaMeses();
  $("#dia").addEventListener("change", ()=>{ TODAS=false; repinta(); });
  $("#busca").addEventListener("input", ()=>{ TODAS=false; pinta(); });
  $("#bAreas").addEventListener("click", ()=>abreArea(""));
  $("#bCsv").addEventListener("click", csv);
  $("#todo").hidden = false;
  pinta();
  const gen = D.generado ? new Date(D.generado) : null;
  $("#pie").innerHTML = "Furgoneta activa = vehículo activo del maestro de VenCloud, sin las fichas ficticias de los sitios fijos. "
    + "Una visita es la de un reponedor en los partes, sin los automáticos de SYSTEM, o la de un técnico de la SAT. "
    + "Los km son los finales menos los iniciales de sus jornadas de ruta, sin contar dos veces la misma jornada. "
    + "La persona es el reponedor titular de la ruta activa que lleva esa furgoneta; sin ruta, quien la llevó en su última jornada. "
    + `Las visitas se conocen desde el ${esc(fechaLarga(D.desde))}; los días de antes, por meses, con la flota activa de hoy. `
    + "Datos filtrados por el ámbito de tu perfil y servidos desde este mismo dominio."
    + (gen ? ` Calculado el ${esc(gen.toLocaleString("es-ES"))}.` : "");
  $("#pie").hidden = false;
  /* La estrella de preferidos de cada tabla, y la vista suelta de /preferidos/ (docs/62). */
  Preferidos.monta("furgonetas", {ocultar: ["#kpis", ".volver"].concat(Preferidos.solo === "dias" ? ["#bCsv"] : [])});
})();
</script>
