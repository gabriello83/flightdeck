     mas: hay redes de cliente que cortan las paginas que llaman fuera. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6f8b'/%3E%3Cpath d='M2 5h7v5H2zm7 1h3l2 2v2H9zM4.5 10.5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm7 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;
  --s1:#2a78d6; --sombra:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --verde:#15803d; --amarillo:#a16207; --rojo:#c62828;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --sombra:none; --verde:#4ade80; --amarillo:#facc15; --rojo:#f87171;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --sombra:none; --verde:#4ade80; --amarillo:#facc15; --rojo:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marca b{font-size:20px;letter-spacing:-.01em}
.marca span{color:var(--tinta-2);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button.btn,a.btn{
  font:inherit;font-size:13px;color:var(--tinta);background:var(--tarjeta);text-decoration:none;
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:6px 11px;cursor:pointer;
}
button.btn:hover,a.btn:hover{border-color:var(--tinta-3)}
button.btn[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.barra{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 6px}
.barra label{font-size:13px;color:var(--tinta-2);display:flex;align-items:center;gap:8px}
.barra select,.barra input{
  font:inherit;font-size:14px;color:var(--tinta);background:var(--tarjeta);
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:5px 8px;max-width:100%
}
.barra input{min-width:200px}
.nota{
  margin:12px 0 4px;padding:10px 13px;border:1px solid var(--borde);border-left:3px solid var(--s1);
  border-radius:8px;background:var(--tarjeta);color:var(--tinta-2);font-size:13px
}
.nota.mal{border-left-color:var(--rojo)}
[hidden]{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:11px 13px;box-shadow:var(--sombra)}
.kpi .et{font-size:12px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .vl{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .nt{font-size:12px;color:var(--tinta-3);margin-top:2px}
section.caja{
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;
  padding:12px 16px 14px;box-shadow:var(--sombra);margin-top:14px
}
.cabsec{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap}
section.caja h2{font-size:15px;margin:0;font-weight:650}
section.caja .sub{font-size:12.5px;color:var(--tinta-2);margin:2px 0 10px}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--tinta-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
   padding:6px 10px 6px 0;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--borde);vertical-align:top}
tr:last-child td{border-bottom:0}
.mat{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.tenue{color:var(--tinta-3);font-size:12px}
.si{color:var(--verde);font-weight:600}
.no{color:var(--rojo);font-weight:600}
.vacio{color:var(--tinta-3);font-size:13.5px;padding:8px 0}
footer{margin-top:26px;color:var(--tinta-3);font-size:12px;border-top:1px solid var(--borde);padding-top:12px}
#cargando{padding:40px 0;color:var(--tinta-2)}
@media (max-width:700px){
  .tabla table,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
  .tabla thead{display:none}
  .tabla tr{border-bottom:1px solid var(--borde);padding:9px 0}
  .tabla tr:last-child{border-bottom:0}
  .tabla td{border:0;padding:2px 0}
  .tabla td[data-et]:not(:empty)::before{content:attr(data-et) " · ";color:var(--tinta-3);font-size:12px}
  .barra input{min-width:0;width:100%}
  .barra label.busca{flex:1 1 100%}
}
.barras{display:grid;gap:4px}
.fb{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:10px;align-items:center;font-size:12.5px}
.fb .nom{color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .pis{display:flex;align-items:center;gap:8px;min-width:0}
.fb .b{height:12px;border-radius:3px;background:var(--s1);flex:none}
.fb .v{font-variant-numeric:tabular-nums;color:var(--tinta-2);white-space:nowrap}
.fb.hoy .nom{color:var(--tinta);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Los km de cada día: en rojo fuera de los umbrales, y sin número lo que no está. */
td.km{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:52px}
th.km{text-align:right}
th.km.hoy,td.km.hoy{background:color-mix(in srgb, var(--s1) 8%, transparent)}
.km .fuera{color:var(--rojo);font-weight:650}
.km .falta{color:var(--rojo);font-size:12px}
.km .nada{color:var(--tinta-3)}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--tinta-3);margin-top:10px}
.leyenda b{font-weight:600}
th.num{text-align:right}
@media (max-width:700px){
  .num,th.num,td.km{text-align:left}
  td.km.hoy{background:none}
  /* En el móvil los km van en una fila: día y cifra. */
  .tabla td.km{display:inline-block;width:auto;min-width:0;margin:2px 10px 0 0}
  .tabla td.km[data-et]::before{content:attr(data-et) " ";}
}
</style>
<script src="/comun/preferidos.js"></script>

<body>
<div class="env">
  <header class="top">
    <div class="marca">
      <b>Furgonetas</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/operativo/">Informe general</a>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>

  <div id="todo" hidden>
    <div class="barra">
      <label>Día <select id="dia"></select></label>
      <label>Delegación <select id="deleg"></select></label>
      <label>Ver <select id="ver">
        <option value="">Todas</option>
        <option value="sin">Sin visitas ese día</option>
        <option value="km">Con km en rojo</option>
      </select></label>
      <label class="busca">Buscar <input id="busca" type="search" placeholder="Matrícula, vehículo, delegación…"></label>
      <button class="btn" id="bCsv" type="button">Descargar CSV</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <section class="caja" id="cajaTabla" data-tabla="vehiculos">
      <div class="cabsec" data-estrella="vehiculos"><h2>Furgonetas activas</h2><span class="tenue" id="cuenta"></span></div>
      <p class="sub" id="sTabla"></p>
      <div class="tabla" id="tabla"></div>
      <div class="leyenda" id="leyenda"></div>
    </section>
    <section class="caja" data-tabla="dias">
      <div class="cabsec" data-estrella="dias"><h2>Furgonetas con visitas, día a día</h2><span class="tenue" id="cuentaDias"></span></div>
      <p class="sub" id="sDias"></p>
      <div id="dias"></div>
    </section>
  </div>

  <footer id="pie" hidden></footer>
</div>

<script>
/* ===================================================================
   Furgonetas · digivend.es  (docs/58)

   Lo que hay detrás del cuadrado de Furgonetas del informe general, como lo
   pidió Gabriele el 19-oct-2026: todas las furgonetas activas, si alguna no
   ha visitado y desde cuántos días, y los km de cada día, en rojo si son
   menos de 10 o más de 400.

   La flota es el maestro de vehículos de VenCloud (M12); las visitas, los
   partes; los km, el control de jornada (D5): km finales menos iniciales.
   Lo que no está se dice: una jornada sin cuentakilómetros no es un cero.

   El fichero ya llega con el ámbito del perfil aplicado: lo escribió la noche
   para este perfil, y la API no deja pedir otro. Esta página no decide qué
   furgonetas ve nadie: filtra y dibuja.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const num = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const MAX_FILAS = 60, DIAS_KM = 7, DIAS_VISTA = 30;

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

let D=null, TODAS=false, QUITADAS=new Set(), UMBRAL={min:10, max:400};

function fechaLarga(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s)
    : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function fechaCorta(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
}
function diaMes(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("es-ES",{weekday:"short", day:"numeric"});
}
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const entre = (a, b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 864e5);
function avisa(t, mal){ const a=$("#aviso"); a.textContent=t; a.hidden=!t; a.classList.toggle("mal", !!mal); }

/* La última visita de una furgoneta el día elegido o antes, y cuántos días
   lleva sin visitar. null si no visitó desde que hay datos (D.desde). */
function ultima(m, dia){
  const fs = (D.visitas||{})[m] || [];
  for(let i=fs.length-1; i>=0; i--) if(fs[i] <= dia) return fs[i];
  return null;
}
/* Los km de una furgoneta un día: {t: texto, c: clase, x: explicación, v: valor para el CSV}. */
function km(m, f){
  const dia = (D.km||{})[f];
  if(!dia) return {t:"s/d", c:"nada", x:"No se leyeron las jornadas de ese día.", v:"sin dato", rojo:false};
  const k = dia[m];
  if(!k) return {t:"—", c:"nada", x:"No abrió jornada ese día.", v:"", rojo:false};
  const [n, jor, falta] = k;
  const varias = jor > 1 ? ` (${jor} jornadas)` : "";
  if(n == null) return {t:"sin km", c:"falta", x:`Sin km: ${falta}${varias}.`, v:`sin km (${falta})`, rojo:true};
  const fuera = n < UMBRAL.min || n > UMBRAL.max;
  return {t:num(n), c:fuera ? "fuera" : "", x:`${num(n)} km${varias}${falta ? ` · otra ${falta}` : ""}`, v:n, rojo:fuera};
}
function diasKm(){
  const dia = $("#dia").value, lista = (D.dias||[]).filter(f=>f<=dia);
  return lista.slice(-DIAS_KM);
}
const enDeleg = (texto, dl) => !dl || String(texto||"").split(" · ").includes(dl);

/* Las filas que se ven: la flota con el filtro, y lo de cada una el día elegido. */
function filas(){
  const dia = $("#dia").value, dl = $("#deleg").value, ver = $("#ver").value;
  const q = $("#busca").value.trim().toLowerCase(), fks = diasKm();
  return (D.flota||[]).filter(x=>enDeleg(x[2], dl) && (!q || x.join(" ").toLowerCase().includes(q)))
    .map(([m, nombre, deleg])=>{
      const u = ultima(m, dia);
      const sin = u == null ? null : entre(u, dia);
      const kms = fks.map(f=>km(m, f));
      return {m, nombre, deleg, u, sin, kms, hoy:kms[kms.length-1]};
    })
    .filter(x=> ver==="sin" ? x.sin!==0 : ver==="km" ? x.kms.some(k=>k.rojo) : true)
    /* Primero las que llevan más días sin visitar: lo que hay que mirar. */
    .sort((a,b)=> (b.sin==null ? 1e9 : b.sin) - (a.sin==null ? 1e9 : a.sin)
      || a.deleg.localeCompare(b.deleg, "es") || a.m.localeCompare(b.m, "es"));
}

function textoSin(x, dia){
  if(x.sin === 0) return `<span class="si">Visitó</span>`;
  if(x.sin == null) return `<span class="no">Más de ${num(entre(D.desde, dia))} días</span>`;
  return `<span class="no">${num(x.sin)} ${x.sin===1?"día":"días"}</span>`;
}

function kpis(){
  const dia = $("#dia").value, dl = $("#deleg").value;
  const flota = (D.flota||[]).filter(x=>enDeleg(x[2], dl));
  const todas = flota.map(([m])=>({m, u:ultima(m, dia), k:km(m, dia)}));
  const con = todas.filter(x=>x.u===dia).length;
  const largas = todas.filter(x=>x.u==null || entre(x.u, dia) > 7).length;
  const rojas = todas.filter(x=>x.k.rojo).length;
  const kpi = (et, vl, nt) => `<div class="kpi"><div class="et">${esc(et)}</div><div class="vl">${vl}</div><div class="nt">${nt}</div></div>`;
  $("#kpis").innerHTML =
    kpi("Furgonetas activas", num(flota.length), dl ? `de ${esc(dl)} en el maestro de VenCloud` : "en el maestro de vehículos de VenCloud")
    + kpi("Con visitas", num(con), `el ${esc(fechaCorta(dia))}`)
    + kpi("Sin visitas", `<span class="${flota.length-con ? "no" : ""}">${num(flota.length-con)}</span>`,
          `${num(largas)} ${largas===1?"lleva":"llevan"} más de 7 días`)
    + kpi("Km en rojo", `<span class="${rojas ? "no" : ""}">${num(rojas)}</span>`,
          (D.km||{})[dia] ? `ese día: menos de ${num(UMBRAL.min)} o más de ${num(UMBRAL.max)} km, o sin km` : "no se leyeron las jornadas de ese día");
}

function pinta(){
  const dia = $("#dia").value, fks = diasKm(), fs = filas();
  kpis();
  $("#cuenta").textContent = `${num(fs.length)} ${fs.length===1?"furgoneta":"furgonetas"}`;
  $("#sTabla").textContent = "Cada furgoneta activa del maestro de vehículos, con su última visita hasta el día elegido "
    + `y los km de sus jornadas de los últimos ${fks.length} días. Primero las que llevan más días sin visitar.`;
  if(!fs.length){
    $("#tabla").innerHTML = `<p class="vacio">Ninguna${$("#deleg").value || $("#busca").value || $("#ver").value ? " con este filtro" : ""}.</p>`;
  }else{
    const vis = fs.slice(0, TODAS ? fs.length : MAX_FILAS);
    $("#tabla").innerHTML = `<table><thead><tr><th>Matrícula</th><th>Vehículo</th><th>Delegación</th>
      <th>Última visita</th><th>Sin visitas</th>
      ${fks.map(f=>`<th class="km${f===dia?" hoy":""}" title="${esc(fechaLarga(f))}">${esc(diaMes(f))}</th>`).join("")}</tr></thead><tbody>
      ${vis.map(x=>`<tr>
        <td data-et="Matrícula"><span class="mat">${esc(x.m)}</span></td>
        <td data-et="Vehículo">${esc(x.nombre)}</td>
        <td data-et="Delegación">${esc(x.deleg)}</td>
        <td data-et="Última visita">${x.u ? esc(fechaCorta(x.u)) : `<span class="tenue">antes del ${esc(fechaCorta(D.desde))}</span>`}</td>
        <td data-et="Sin visitas">${textoSin(x, dia)}</td>
        ${x.kms.map((k,i)=>`<td class="km${fks[i]===dia?" hoy":""}" data-et="${esc(diaMes(fks[i]))}" title="${esc(fechaLarga(fks[i]))}: ${esc(k.x)}"><span class="${k.c}">${esc(k.t)}</span></td>`).join("")}
      </tr>`).join("")}
      </tbody></table>`
      + (fs.length > vis.length ? `<p class="vacio"><button class="btn" type="button" id="bTodas">Ver todas (${num(fs.length)})</button></p>` : "");
    const b = $("#bTodas"); if(b) b.addEventListener("click", ()=>{ TODAS=true; pinta(); });
  }
  $("#leyenda").innerHTML = `<span><b class="no">En rojo</b>: menos de ${num(UMBRAL.min)} km o más de ${num(UMBRAL.max)} km ese día.</span>`
    + `<span><b class="no">sin km</b>: abrió jornada sin cuentakilómetros, sin cerrarla o mal anotada.</span>`
    + `<span><b>—</b>: no abrió jornada.</span><span><b>s/d</b>: no se leyeron las jornadas.</span>`;
  pintaDias();
}

/* Cuántas de la flota visitaron cada día hasta el elegido, con la delegación
   del filtro si la hay. */
function pintaDias(){
  const dia = $("#dia").value, dl = $("#deleg").value;
  const flota = (D.flota||[]).filter(x=>enDeleg(x[2], dl)).map(x=>x[0]);
  const dias = (D.dias||[]).filter(f=>f<=dia).slice(-DIAS_VISTA).reverse();
  const filas = dias.map(f=>[f, flota.filter(m=>((D.visitas||{})[m]||[]).includes(f)).length]);
  const max = Math.max(1, flota.length);
  $("#cuentaDias").textContent = `${num(filas.length)} días`;
  $("#sDias").textContent = (dl ? `Las de ${dl}, de ${num(flota.length)}. ` : `De ${num(flota.length)} furgonetas activas. `)
    + "Los fines de semana y los festivos salen muchas menos: compara con el mismo día de otras semanas.";
  $("#dias").innerHTML = `<div class="barras">${filas.map(([f, n])=>
    `<div class="fb${f===dia?" hoy":""}" title="${esc(fechaLarga(f))}: ${num(n)} de ${num(flota.length)} furgonetas con visitas">
      <span class="nom">${esc(fechaCorta(f))}</span>
      <span class="pis"><span class="b" style="width:${Math.max(.5, 100*n/max)}%"></span><span class="v">${num(n)}</span></span>
    </div>`).join("")}</div>`;
}

function pintaDelegs(){
  const antes = $("#deleg").value, todas = new Set();
  (D.flota||[]).forEach(x => String(x[2]||"").split(" · ").forEach(d => { if(d) todas.add(d); }));
  const l = [...todas].sort((a,b)=>a.localeCompare(b,"es"));
  $("#deleg").innerHTML = `<option value="">Todas</option>` + l.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("#deleg").value = l.includes(antes) ? antes : "";
}

function csv(){
  const dia = $("#dia").value, fks = diasKm();
  const q = v => { const s = String(v==null?"":v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const cab = ["Matrícula", "Vehículo", "Delegación", "Última visita", "Días sin visitas", ...fks.map(f=>`km ${f}`)];
  const lineas = filas().map(x=>[x.m, x.nombre, x.deleg, x.u || `antes del ${D.desde}`,
    x.sin == null ? `más de ${entre(D.desde, dia)}` : x.sin, ...x.kms.map(k=>k.v)]);
  const texto = "﻿" + [cab, ...lineas].map(l=>l.map(q).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([texto], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = `furgonetas_${dia}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  const yo = await r.json();
  if(yo.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  /* Lo que el administrador le quitó a este usuario dentro de esta página
     (docs/61): no se dibuja, y lo que sólo usa esa tabla ya no llega. */
  QUITADAS = new Set((yo.tablas_ocultas||{})["furgonetas"] || []);
  document.querySelectorAll("[data-tabla]").forEach(el=>{ if(QUITADAS.has(el.dataset.tabla)) el.hidden = true; });
  if(QUITADAS.has("vehiculos")) ["#bCsv", "#ver"].forEach(s=>{ const el=$(s); (el.closest("label")||el).hidden = true; });

  $("#quien").textContent = (yo.perfil ? yo.perfil + " · " : "") + (yo.nombre || yo.correo);

  let rf;
  try{ rf = await fetch("/api/furgonetas", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(rf.status === 401){ location.href = "/"; return; }
  $("#cargando").hidden = true;
  if(!rf.ok){
    let d={}; try{ d = await rf.json(); }catch(e){}
    avisa(d.error || "Las furgonetas no están disponibles ahora mismo.", true);
    return;
  }
  D = await rf.json();
  if(!Array.isArray(D.dias) || !D.dias.length){ avisa(D.sin_dato || "Todavía no hay ningún día calculado.", true); return; }
  if(D.sin_dato) avisa(D.sin_dato, true);
  UMBRAL = Object.assign(UMBRAL, D.umbrales_km || {});
  const dias = D.dias.slice().reverse();
  $("#dia").innerHTML = dias.map(f=>`<option value="${esc(f)}">${esc(fechaLarga(f))}</option>`).join("");
  /* El día que llega en la dirección (desde el cuadrado), o ayer, o el último. */
  const q = new URLSearchParams(location.search), pedido = q.get("dia");
  const hoy = new Date(), ayer = isoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()-1));
  $("#dia").value = dias.includes(pedido) ? pedido : dias.includes(ayer) ? ayer : dias[0];
  if(!dias.includes(pedido) && !dias.includes(ayer) && !D.sin_dato)
    avisa(`Todavía no hay datos de ayer: lo último calculado es del ${fechaLarga(dias[0])}.`, true);
  pintaDelegs();
  if(q.get("delegacion")) $("#deleg").value = q.get("delegacion");
  ["#dia","#deleg","#ver"].forEach(s=>$(s).addEventListener("change", ()=>{ TODAS=false; pinta(); }));
  $("#busca").addEventListener("input", ()=>{ TODAS=false; pinta(); });
  $("#bCsv").addEventListener("click", csv);
  $("#todo").hidden = false;
  pinta();
  const gen = D.generado ? new Date(D.generado) : null;
  $("#pie").innerHTML = "Furgoneta activa = vehículo activo del maestro de VenCloud, sin las fichas ficticias de los sitios fijos. "
    + "Una visita es la de un reponedor en los partes, sin los automáticos de SYSTEM. "
    + "Los km son los finales menos los iniciales de sus jornadas de ruta de ese día. "
    + `Las visitas se conocen desde el ${esc(fechaLarga(D.desde))}. `
    + "Datos filtrados por el ámbito de tu perfil y servidos desde este mismo dominio."
    + (gen ? ` Calculado el ${esc(gen.toLocaleString("es-ES"))}.` : "");
  $("#pie").hidden = false;
  /* La estrella de preferidos de cada tabla, y la vista suelta de /preferidos/ (docs/62). */
  Preferidos.monta("furgonetas", {ocultar: ["#kpis"].concat(Preferidos.solo === "dias" ? ["#bCsv", "label:has(#ver)"] : [])});
})();
