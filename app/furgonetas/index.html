     mas: hay redes de cliente que cortan las paginas que llaman fuera. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6f8b'/%3E%3Cpath d='M2 5h7v5H2zm7 1h3l2 2v2H9zM4.5 10.5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm7 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;
  --s1:#2a78d6; --sombra:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --verde:#15803d; --amarillo:#a16207; --rojo:#c62828;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --sombra:none; --verde:#4ade80; --amarillo:#facc15; --rojo:#f87171;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --sombra:none; --verde:#4ade80; --amarillo:#facc15; --rojo:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marca b{font-size:20px;letter-spacing:-.01em}
.marca span{color:var(--tinta-2);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button.btn,a.btn{
  font:inherit;font-size:13px;color:var(--tinta);background:var(--tarjeta);text-decoration:none;
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:6px 11px;cursor:pointer;
}
button.btn:hover,a.btn:hover{border-color:var(--tinta-3)}
button.btn[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.barra{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 6px}
.barra label{font-size:13px;color:var(--tinta-2);display:flex;align-items:center;gap:8px}
.barra select,.barra input{
  font:inherit;font-size:14px;color:var(--tinta);background:var(--tarjeta);
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:5px 8px;max-width:100%
}
.barra input{min-width:200px}
.nota{
  margin:12px 0 4px;padding:10px 13px;border:1px solid var(--borde);border-left:3px solid var(--s1);
  border-radius:8px;background:var(--tarjeta);color:var(--tinta-2);font-size:13px
}
.nota.mal{border-left-color:var(--rojo)}
.pestanas{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:11px 13px;box-shadow:var(--sombra)}
.kpi .et{font-size:12px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .vl{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .nt{font-size:12px;color:var(--tinta-3);margin-top:2px}
section.caja{
  background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;
  padding:12px 16px 14px;box-shadow:var(--sombra);margin-top:14px
}
.cabsec{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap}
section.caja h2{font-size:15px;margin:0;font-weight:650}
section.caja .sub{font-size:12.5px;color:var(--tinta-2);margin:2px 0 10px}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--tinta-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
   padding:6px 10px 6px 0;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--borde);vertical-align:top}
tr:last-child td{border-bottom:0}
.mat{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.tenue{color:var(--tinta-3);font-size:12px}
.si{color:var(--verde);font-weight:600}
.no{color:var(--rojo);font-weight:600}
.vacio{color:var(--tinta-3);font-size:13.5px;padding:8px 0}
footer{margin-top:26px;color:var(--tinta-3);font-size:12px;border-top:1px solid var(--borde);padding-top:12px}
#cargando{padding:40px 0;color:var(--tinta-2)}
@media (max-width:700px){
  .tabla table,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
  .tabla thead{display:none}
  .tabla tr{border-bottom:1px solid var(--borde);padding:9px 0}
  .tabla tr:last-child{border-bottom:0}
  .tabla td{border:0;padding:2px 0}
  .tabla td[data-et]:not(:empty)::before{content:attr(data-et) " · ";color:var(--tinta-3);font-size:12px}
  .barra input{min-width:0;width:100%}
  .barra label.busca{flex:1 1 100%}
}
.barras{display:grid;gap:4px}
.fb{display:grid;grid-template-columns:minmax(90px,170px) 1fr;gap:10px;align-items:center;font-size:12.5px}
.fb .nom{color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .pis{display:flex;align-items:center;gap:8px;min-width:0}
.fb .b{height:12px;border-radius:3px;background:var(--s1);flex:none}
.fb .v{font-variant-numeric:tabular-nums;color:var(--tinta-2);white-space:nowrap}
.fb.hoy .nom{color:var(--tinta);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
@media (max-width:700px){ .num,th.num{text-align:left} }
</style>
</head>
<body>
<div class="env">
  <header class="top">
    <div class="marca">
      <b>Furgonetas</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/operativo/">Informe general</a>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>

  <div id="todo" hidden>
    <div class="barra">
      <label>Día <select id="dia"></select></label>
      <label>Delegación <select id="deleg"></select></label>
      <label class="busca">Buscar <input id="busca" type="search" placeholder="Matrícula, reponedor, ruta…"></label>
      <button class="btn" id="bCsv" type="button">Descargar CSV</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="pestanas" id="pestanas" role="tablist"></div>
    <section class="caja">
      <div class="cabsec"><h2 id="tTabla"></h2><span class="tenue" id="cuenta"></span></div>
      <p class="sub" id="sTabla"></p>
      <div class="tabla" id="tabla"></div>
    </section>
    <section class="caja">
      <div class="cabsec"><h2>Furgonetas activas, día a día</h2><span class="tenue" id="cuentaDias"></span></div>
      <p class="sub" id="sDias"></p>
      <div id="dias"></div>
    </section>
  </div>

  <footer id="pie" hidden></footer>
</div>

<script>
/* ===================================================================
   Furgonetas · digivend.es  (docs/58)

   Lo que hay detrás del cuadrado de Furgonetas del informe general: cada
   vehículo con visitas reales ese día, con su delegación, sus rutas, sus
   reponedores, cuántas visitas y puntos de venta hizo y entre qué horas; las
   visitas que llegaron sin vehículo informado («xxxx-xxx» en VenCloud), por
   reponedor; y el resumen por delegación.

   El fichero ya llega con el ámbito del perfil aplicado: lo escribió la noche
   para este perfil, y la API no deja pedir otro. Esta página no decide qué
   vehículos ve nadie: filtra y dibuja.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const num = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const dec = n => new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}).format(n);
const pct = (a,b) => b ? dec(100*a/b) + " %" : "—";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const MAX_FILAS = 50, TOPE_FILAS = 1000, DIAS_VISTA = 30;

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

let D=null, PESTANA="vehiculos", TODAS=false;

function fechaLarga(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s)
    : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function fechaCorta(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s) : d.toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
}
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function avisa(t, mal){ const a=$("#aviso"); a.textContent=t; a.hidden=!t; a.classList.toggle("mal", !!mal); }

const delDia = () => (D.dias||{})[$("#dia").value] || {};
/* Una furgoneta es de la delegación si visitó allí: la que pasó por dos sale
   en las dos. */
const enDeleg = (texto, dl) => !dl || String(texto||"").split(" · ").includes(dl);
const busca = t => { const q = $("#busca").value.trim().toLowerCase(); return !q || t.join(" ").toLowerCase().includes(q); };

/* Cuántos de los últimos DIAS_VISTA días, hasta el elegido, salió cada
   vehículo con visitas. */
function diasActiva(){
  const dia = $("#dia").value, cuenta = {};
  const dias = Object.keys(D.dias||{}).filter(f=>f<=dia).sort().slice(-DIAS_VISTA);
  dias.forEach(f => ((D.dias[f]||{}).vehiculos||[]).forEach(v => { cuenta[v[0]] = (cuenta[v[0]]||0) + 1; }));
  return {cuenta, n: dias.length};
}

/* Las columnas de cada pestaña: [cabecera, valor para pantalla (html), valor para el CSV, numérica]. */
function actual(){
  const d = delDia(), dl = $("#deleg").value;
  if(PESTANA === "sin"){
    const cols = [
      ["Delegación", x=>esc(x[0]), x=>x[0]],
      ["Reponedor", x=>esc(x[1] || "—"), x=>x[1]],
      ["Ruta(s)", x=>esc(x[2]), x=>x[2]],
      ["Visitas", x=>num(x[3]), x=>x[3], true],
      ["Puntos de venta", x=>num(x[4]), x=>x[4], true],
      ["Vehículo en VenCloud", x=>`<span class="mat">${esc(x[5])}</span>`, x=>x[5]],
    ];
    return {cols, filas:(d.sin_vehiculo||[]).filter(x=>(!dl || x[0]===dl) && busca(x))};
  }
  if(PESTANA === "deleg"){
    const cols = [
      ["Delegación", x=>esc(x[0] || "Sin delegación"), x=>x[0]],
      ["Furgonetas", x=>num(x[1]), x=>x[1], true],
      ["Visitas", x=>num(x[2]), x=>x[2], true],
      ["Visitas por furgoneta", x=>x[1] ? dec((x[2]-x[3])/x[1]) : "—", x=>x[1] ? Math.round(10*(x[2]-x[3])/x[1])/10 : "", true],
      ["Visitas sin vehículo", x=>`${num(x[3])} <span class="tenue">${x[2] ? pct(x[3], x[2]) : ""}</span>`, x=>x[3], true],
    ];
    return {cols, filas:(d.delegaciones||[]).filter(x=>(!dl || x[0]===dl) && busca(x))};
  }
  const act = diasActiva();
  const cols = [
    ["Matrícula", x=>`<span class="mat">${esc(x[0])}</span>`, x=>x[0]],
    ["Delegación", x=>esc(x[1]), x=>x[1]],
    ["Ruta(s)", x=>esc(x[2]), x=>x[2]],
    ["Reponedor(es)", x=>esc(x[3]), x=>x[3]],
    ["Visitas", x=>num(x[4]), x=>x[4], true],
    ["Puntos de venta", x=>num(x[5]), x=>x[5], true],
    ["Minutos de visita", x=>num(x[6]), x=>x[6], true],
    ["Primera · última", x=>x[7] ? `${esc(x[7])} · ${esc(x[8])}` : "—", x=>x[7] ? `${x[7]}-${x[8]}` : ""],
    [`Días con visitas (${act.n} d)`, x=>num(act.cuenta[x[0]]||0), x=>act.cuenta[x[0]]||0, true],
  ];
  return {cols, filas:(d.vehiculos||[]).filter(x=>enDeleg(x[1], dl) && busca(x))};
}

function kpis(){
  const d = delDia(), dl = $("#deleg").value;
  const kpi = (et, vl, nt) => `<div class="kpi"><div class="et">${esc(et)}</div><div class="vl">${vl}</div><div class="nt">${nt}</div></div>`;
  let activas = d.activas, visitas = d.visitas, sin = d.visitas_sin_vehiculo;
  if(dl){
    const f = (d.delegaciones||[]).find(x=>x[0]===dl) || [dl, 0, 0, 0];
    [activas, visitas, sin] = [f[1], f[2], f[3]];
  }
  if(activas == null){ $("#kpis").innerHTML = ""; return; }
  const con = visitas - sin;
  $("#kpis").innerHTML =
    kpi("Furgonetas activas", num(activas), dl ? `con visitas en ${esc(dl)}` : "distintas, con alguna visita real")
    + kpi("Visitas", num(visitas), "visitas reales del parte")
    + kpi("Visitas por furgoneta", activas ? dec(con/activas) : "—", "de las que tienen vehículo")
    + kpi("Visitas sin vehículo", num(sin), visitas ? `${pct(sin, visitas)} de las visitas · no cuentan como furgoneta` : "");
}

function pinta(){
  const d = delDia();
  const pest = [["vehiculos", `Furgonetas · ${num((d.vehiculos||[]).length)}`],
                ["sin", `Visitas sin vehículo · ${num(d.visitas_sin_vehiculo||0)}`],
                ["deleg", "Por delegación"]];
  $("#pestanas").innerHTML = pest.map(([id,t])=>
    `<button class="btn" type="button" role="tab" data-p="${id}" aria-pressed="${id===PESTANA}">${esc(t)}</button>`).join("");
  $("#pestanas").querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ PESTANA=b.dataset.p; TODAS=false; pinta(); }));
  kpis();
  const TIT = {vehiculos:"Furgonetas con visitas", sin:"Visitas sin vehículo, por reponedor", deleg:"Por delegación"};
  const SUB = {
    vehiculos:"Cada vehículo con alguna visita real ese día, con las delegaciones, rutas y reponedores con los que salió. Las horas son las de inicio de la primera y la última visita.",
    sin:"Visitas reales cuyo parte no trae vehículo (VenCloud lo rellena con «xxxx-xxx»). Son visitas hechas, pero no se puede saber en qué furgoneta: no entran en la cifra del cuadrado.",
    deleg:"Las furgonetas de una delegación son las distintas que visitaron allí; una que pasó por dos cuenta en las dos, y el total de arriba es el de distintas.",
  };
  $("#tTabla").textContent = TIT[PESTANA];
  $("#sTabla").textContent = SUB[PESTANA];
  const {cols, filas} = actual();
  $("#cuenta").textContent = `${num(filas.length)} ${filas.length===1?"fila":"filas"}`;
  if(!filas.length){
    $("#tabla").innerHTML = `<p class="vacio">Ninguna el ${esc(fechaLarga($("#dia").value))}${$("#deleg").value || $("#busca").value ? " con este filtro" : ""}.</p>`;
  }else{
    const vis = filas.slice(0, TODAS ? TOPE_FILAS : MAX_FILAS);
    $("#tabla").innerHTML = `<table><thead><tr>${cols.map(c=>`<th${c[3]?' class="num"':""}>${esc(c[0])}</th>`).join("")}</tr></thead><tbody>
      ${vis.map(f=>`<tr>${cols.map(c=>`<td data-et="${esc(c[0])}"${c[3]?' class="num"':""}>${c[1](f)}</td>`).join("")}</tr>`).join("")}
      </tbody></table>`
      + (filas.length > vis.length
        ? (TODAS ? `<p class="vacio">Y ${num(filas.length-vis.length)} más: están todas en el CSV.</p>`
                 : `<p class="vacio"><button class="btn" type="button" id="bTodas">Ver todas (${num(filas.length)})</button></p>`)
        : "");
    const b = $("#bTodas"); if(b) b.addEventListener("click", ()=>{ TODAS=true; pinta(); });
  }
  pintaDias();
}

/* Las furgonetas activas de cada día hasta el elegido, con la delegación del
   filtro si la hay: para ver si el día elegido es normal. */
function pintaDias(){
  const dia = $("#dia").value, dl = $("#deleg").value;
  const dias = Object.keys(D.dias||{}).filter(f=>f<=dia).sort().slice(-DIAS_VISTA).reverse();
  const de = f => { const d = D.dias[f]||{};
    if(!dl) return [d.activas||0, d.visitas||0];
    const x = (d.delegaciones||[]).find(y=>y[0]===dl); return x ? [x[1], x[2]] : [0, 0]; };
  const filas = dias.map(f=>[f, ...de(f)]);
  const max = Math.max(1, ...filas.map(x=>x[1]));
  $("#cuentaDias").textContent = `${num(filas.length)} días`;
  $("#sDias").textContent = (dl ? `Las de ${dl}. ` : "") + "Los fines de semana y los festivos salen muchas menos: compara con el mismo día de otras semanas.";
  $("#dias").innerHTML = `<div class="barras">${filas.map(([f, n, v])=>
    `<div class="fb${f===dia?" hoy":""}" title="${esc(fechaLarga(f))}: ${num(n)} furgonetas, ${num(v)} visitas">
      <span class="nom">${esc(fechaCorta(f))}</span>
      <span class="pis"><span class="b" style="width:${Math.max(.5, 100*n/max)}%"></span><span class="v">${num(n)}</span></span>
    </div>`).join("")}</div>`;
}

function pintaDelegs(){
  const antes = $("#deleg").value, todas = new Set();
  Object.values(D.dias||{}).forEach(d => (d.delegaciones||[]).forEach(x => { if(x[0]) todas.add(x[0]); }));
  const l = [...todas].sort((a,b)=>a.localeCompare(b,"es"));
  $("#deleg").innerHTML = `<option value="">Todas</option>` + l.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("#deleg").value = l.includes(antes) ? antes : "";
}

function csv(){
  const {cols, filas} = actual();
  const q = v => { const s = String(v==null?"":v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const texto = "\ufeff" + [cols.map(c=>q(c[0])).join(";"), ...filas.map(f=>cols.map(c=>q(c[2](f))).join(";"))].join("\r\n");
  const url = URL.createObjectURL(new Blob([texto], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = `furgonetas_${PESTANA}_${$("#dia").value}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  const yo = await r.json();
  if(yo.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  $("#quien").textContent = (yo.perfil ? yo.perfil + " · " : "") + (yo.nombre || yo.correo);

  let rf;
  try{ rf = await fetch("/api/furgonetas", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(rf.status === 401){ location.href = "/"; return; }
  $("#cargando").hidden = true;
  if(!rf.ok){
    let d={}; try{ d = await rf.json(); }catch(e){}
    avisa(d.error || "Las furgonetas no están disponibles ahora mismo.", true);
    return;
  }
  D = await rf.json();
  const dias = Object.keys(D.dias||{}).sort().reverse();
  if(!dias.length){ avisa("Todavía no hay ningún día calculado.", true); return; }
  $("#dia").innerHTML = dias.map(f=>`<option value="${esc(f)}">${esc(fechaLarga(f))}</option>`).join("");
  /* El día que llega en la dirección (desde el cuadrado), o ayer, o el último. */
  const q = new URLSearchParams(location.search), pedido = q.get("dia");
  const hoy = new Date(), ayer = isoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()-1));
  $("#dia").value = dias.includes(pedido) ? pedido : dias.includes(ayer) ? ayer : dias[0];
  if(!dias.includes(pedido) && !dias.includes(ayer))
    avisa(`Todavía no hay datos de ayer: lo último calculado es del ${fechaLarga(dias[0])}.`, true);
  pintaDelegs();
  if(q.get("delegacion")) $("#deleg").value = q.get("delegacion");
  ["#dia","#deleg"].forEach(s=>$(s).addEventListener("change", ()=>{ TODAS=false; pinta(); }));
  $("#busca").addEventListener("input", ()=>{ TODAS=false; pinta(); });
  $("#bCsv").addEventListener("click", csv);
  $("#todo").hidden = false;
  pinta();
  const gen = D.generado ? new Date(D.generado) : null;
  $("#pie").innerHTML = "Furgoneta activa = un vehículo distinto con alguna visita real ese día en los partes de VenCloud; "
    + "no se suman de un día a otro. Una visita real es la de un reponedor, sin los partes automáticos de SYSTEM. "
    + "Datos filtrados por el ámbito de tu perfil y servidos desde este mismo dominio."
    + (gen ? ` Calculado el ${esc(gen.toLocaleString("es-ES"))}.` : "");
  $("#pie").hidden = false;
})();
</script>
</body>
</html>
