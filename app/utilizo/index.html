<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;

  --mal-fondo:#fbe3e1; --mal-tinta:#9b1c1c; --bien-tinta:#166534; --gris-fondo:#ecebe6;
  --ambar-fondo:#fdf0c4; --ambar-tinta:#6b4e00;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --fila:#222220; --sombra:none;

    --mal-fondo:#3d1d1b; --mal-tinta:#f4a59e; --bien-tinta:#7fd89d; --gris-fondo:#262624;
    --ambar-fondo:#3a2f0c; --ambar-tinta:#f3d06b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --fila:#222220; --sombra:none;
  --verde:#17803f; --amarillo:#e3ac06; --rojo:#c0392b;
  --mal-fondo:#3d1d1b; --mal-tinta:#f4a59e; --bien-tinta:#7fd89d; --gris-fondo:#262624;
  --ambar-fondo:#3a2f0c; --ambar-tinta:#f3d06b;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;

}
.env{max-width:1240px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}

button.btn,a.btn{

}
button.btn:hover,a.btn:hover{border-color:var(--tinta-3)}

.barra{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 6px}

  font:inherit;font-weight:700;color:var(--s1);background:none;border:0;padding:0;cursor:pointer;

}
.mat:focus-visible{outline:3px solid var(--s1);outline-offset:2px}

}

}

.persona-cab{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}
.persona-cab div{font-size:12px;color:var(--tinta-2)}

.horas{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:70px;margin-top:10px}

a.dia,a.mes{color:var(--s1)}

@media (max-width:760px){ .dos{grid-template-columns:1fr} }

.pestanas button{

}

<body>
<div class="env">
  <header class="top">
    <div class="marca" data-estrella="uso">
      <b>Utilizo</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/operativo/">Informe operativo</a>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="pestanas" id="pestanas" role="tablist" aria-label="Qué uso" hidden>
    <button type="button" role="tab" data-que="vencloud">VenCloud</button>
    <button type="button" role="tab" data-que="web">Dashboard</button>
    <button type="button" role="tab" data-que="ia">Vendi (IA)</button>
  </div>
  <div class="barra" id="barra" hidden>
    <label>Ver <select id="fPer"><option value="dia">Un día</option><option value="mes">Un mes</option></select></label>
    <label id="lDia">Día <select id="fDia"></select></label>
    <label id="lMes" hidden>Mes <select id="fMes"></select></label>
    <label id="lBusca">Buscar <input id="fBusca" type="search" placeholder="Usuario" autocomplete="off"></label>
  </div>
  <!-- Los filtros de área, delegación, cliente y centro de las demás secciones
       (docs/73) aquí no tienen con qué: se dice, en vez de enseñarlos vacíos. -->
  <p id="sinLugar" style="margin:6px 0 0;font-size:13px;color:var(--tinta-2)" hidden>Área, delegación, cliente y centro no se aplican aquí: es lo que hace cada persona en VenCloud, en toda la red.</p>
  <nav class="miga" id="miga" aria-label="Dónde estás" hidden></nav>
  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>
  <main id="vista"></main>
  <footer id="pie" hidden></footer>
</div>

<script src="/comun/xlsx.js"></script>
<script>
/* ===================================================================
   Utilizo · digivend.es  (docs/60)

   Cuanto usa VenCloud cada persona, dia a dia: acciones (altas, cambios y
   borrados del registro de actividad de VenCloud), horas con actividad, primera
   y ultima, y que toco. M.GARCIA y M2.GARCIA son una persona, y J.MARCOS y
   J2.MARCOS otra: llegan ya juntas. Con historico: se ve un dia o un mes
   entero, y de cada usuario su historia mes a mes. El detalle (por hora y que
   toco) solo llega de los dos ultimos meses. Esta pagina solo suma los dias
   del mes; el resto lo escribio la noche (infra/utilizo.py).

   Y en sus otras dos pestañas (docs/77), quien usa esta dashboard y cuanto
   (entradas con clave y paginas abiertas) y quien pregunta a Vendi y cuanto
   gasta. Eso no es de la noche: lo apunta la API al momento, y lo sirve
   /api/utilizo/plataforma por persona y dia.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const num  = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const esc  = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

const ACCION = {I:"Alta", U:"Cambio", D:"Borrado"};
let YO=null, D=null, P=null, ERR={};

function fechaCorta(s){
  const d = new Date(String(s).slice(0,10)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s||"") : d.toLocaleDateString("es-ES",{day:"numeric", month:"short", year:"numeric"});
}
function mesLargo(m){
  const d = new Date(String(m).slice(0,7)+"-01T00:00:00");
  return Number.isNaN(d.getTime()) ? String(m||"") : d.toLocaleDateString("es-ES",{month:"long", year:"numeric"});
}
function fechaLarga(s){
  const d = new Date(String(s).slice(0,10)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s||"") : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
}
function avisa(texto, mal){
  const a = $("#aviso");
  a.textContent = texto||""; a.hidden = !texto; a.classList.toggle("mal", !!mal);
}
const limpio = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40);
const deA = x => x && x.primera ? `${x.primera.slice(0,5)} – ${x.ultima.slice(0,5)}` : "—";
const sinTildes = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

/* ----------------------------------------------------- estado en la URL */
function ruta(){
  const q = new URLSearchParams(location.hash.slice(1));
  return {dia: q.get("dia") || "", p: q.get("p") || "", q: q.get("q") || "",
          per: q.get("per")==="mes" ? "mes" : "dia", mes: q.get("mes") || "",
          que: ["web","ia"].includes(q.get("que")) ? q.get("que") : "vencloud"};
}
function ir(cambios){
  const r = Object.assign(ruta(), cambios);
  const q = new URLSearchParams();
  if(r.per==="dia") r.per = "";
  if(r.que==="vencloud") r.que = "";
  for(const k of ["que","per","mes","dia","p","q"]) if(r[k]) q.set(k, r[k]);
  location.hash = q.toString();
}
$("#fDia").addEventListener("change", e=>ir({dia:e.target.value}));
$("#fMes").addEventListener("change", e=>ir({mes:e.target.value}));
$("#fPer").addEventListener("change", e=>ir({per:e.target.value}));
let tecleo = null;
$("#fBusca").addEventListener("input", e=>{
  clearTimeout(tecleo);
  tecleo = setTimeout(()=>ir({q:e.target.value.trim()}), 250);
});

function diaDe(r){ return r.dia && D.dias.includes(r.dia) ? r.dia : (D.dias[0] || ""); }
const delDia = (p, dia) => p.dias.find(d=>d.dia===dia);
let MESES = [];
function mesDe(r){ return r.mes && MESES.includes(r.mes) ? r.mes : (MESES[0] || ""); }
/* Lo de un usuario en un mes: la suma de sus dias. Lo que toco solo se suma de
   los dias que traen detalle (los dos ultimos meses). */
function delMes(p, mes){
  const dias = p.dias.filter(d=>d.dia.slice(0,7)===mes);
  if(!dias.length) return null;
  const que = {};
  dias.forEach(d=>(d.entidades||[]).forEach(([e,a,n])=>{ const k = e+"|"+a; que[k] = (que[k]||0) + n; }));
  return {dias: dias.length, acciones: dias.reduce((s,d)=>s+d.acciones, 0), horas: dias.reduce((s,d)=>s+d.horas, 0),
          lista: dias, entidades: Object.entries(que).map(([k,n])=>[...k.split("|"), n]).sort((a,b)=>b[2]-a[2])};
}
const SIN_DETALLE = "El detalle por hora y qué tocó sólo se guarda de los dos últimos meses.";

/* ------------------------------------------------------------ la vista */
document.querySelectorAll("#pestanas button").forEach(b=>b.addEventListener("click", ()=>
  ir({que:b.dataset.que, dia:"", mes:"", p:""})));

/* Cada pestaña pide lo suyo la primera vez que se abre, no antes. */
async function pinta(){
  avisa("");
  $("#sinLugar").hidden = true;   // solo en VenCloud
  const r = ruta();
  document.querySelectorAll("#pestanas button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.que===r.que)));
  const listo = r.que==="vencloud" ? await cargaVenCloud() : await cargaPlataforma();
  if(ruta().que !== r.que) return;   // cambio de pestaña mientras cargaba
  if(!listo){
    $("#barra").hidden = true; $("#miga").hidden = true; $("#pie").hidden = true;
    $("#vista").innerHTML = "";
    const e = ERR[r.que==="vencloud" ? "vencloud" : "plataforma"];
    avisa(e.texto, e.mal);
    return;
  }
  if(r.que==="vencloud") pintaVenCloud(r);
  else pintaPlataforma(r);
}

function pintaVenCloud(r){
  const dia = diaDe(r), mes = mesDe(r);
  $("#fPer").value = r.per;
  $("#lDia").hidden = r.per!=="dia"; $("#lMes").hidden = r.per!=="mes";
  $("#fDia").innerHTML = D.dias.map(d=>`<option value="${d}"${d===dia?" selected":""}>${esc(fechaLarga(d))} de ${d.slice(0,4)}</option>`).join("");
  $("#fMes").innerHTML = MESES.map(m=>`<option value="${m}"${m===mes?" selected":""}>${esc(mesLargo(m))}</option>`).join("");
  if(document.activeElement !== $("#fBusca")) $("#fBusca").value = r.q;
  $("#barra").hidden = false; $("#sinLugar").hidden = false;
  pieVenCloud();
  const p = r.p && D.personas.find(x=>x.nombre===r.p);
  if(p) return vistaPersona(p, r.per==="mes" ? null : dia, r.per==="mes" ? mes : dia.slice(0,7));
  $("#miga").hidden = true;
  $("#lBusca").hidden = false;
  if(r.per==="mes") vistaMes(mes, r);
  else vistaDia(dia, r);
}

function vistaDia(dia, r){
  const activos = D.personas.map(p=>({p, x:delDia(p, dia)})).filter(o=>o.x)
    .sort((a,b)=>b.x.acciones-a.x.acciones || a.p.nombre.localeCompare(b.p.nombre,"es"));
  const busca = sinTildes(r.q);
  const filas = busca ? activos.filter(o=>sinTildes(o.p.nombre+" "+o.p.cuentas.join(" ")).includes(busca)) : activos;
  const acciones = activos.reduce((s,o)=>s+o.x.acciones, 0);
  const horas = activos.reduce((s,o)=>s+o.x.horas, 0);
  const max = Math.max(1, ...activos.map(o=>o.x.acciones));
  const ultimos = D.dias.filter(d=>d<=dia).slice(0,30);
  const v = $("#vista");
  v.innerHTML = `<div class="kpis fijos">`
    + `<div class="kpi"><div class="et">Usuarios</div><div class="vl">${num(activos.length)}</div><div class="nt">con alguna acción el ${esc(fechaLarga(dia))}</div></div>`
    + `<div class="kpi"><div class="et">Acciones</div><div class="vl">${num(acciones)}</div><div class="nt">altas, cambios y borrados</div></div>`
    + `<div class="kpi"><div class="et">Horas con actividad</div><div class="vl">${num(horas)}</div><div class="nt">sumando las de cada usuario</div></div>`
    + `</div><section class="caja" id="tabla"></section>`;
  const caja = $("#tabla");
  caja.innerHTML = `<div class="cabsec"><h2>Uso de VenCloud el ${esc(fechaLarga(dia))}</h2>`
    + `<button class="btn primario" id="bExcel" type="button">Descargar Excel</button></div>`

    + `</tbody></table></div>`
    + `<h2 style="margin-top:16px">Mes a mes</h2><div class="tabla-env" id="mesames"><table><thead><tr><th>Mes</th><th class="n">Acciones</th><th class="n">Días</th><th class="n oculta-movil">Horas</th><th class="n oculta-movil">Media por día</th></tr></thead><tbody>`

  v.innerHTML = h;
  v.querySelectorAll("a.dia").forEach(a=>a.addEventListener("click", e=>{ e.preventDefault(); ir({per:"dia", dia:a.dataset.d}); }));
  v.querySelectorAll("a.mes").forEach(a=>a.addEventListener("click", e=>{ e.preventDefault(); ir({per:"mes", mes:a.dataset.m}); }));

/* ------------------------------------------------------------- los Excel */
const HOY = new Date();
const tit = que => [`Utilizo · ${que}`, `Generado el ${HOY.toLocaleDateString("es-ES")}`];
const COL_DIA = [{titulo:"Día",ancho:12},{titulo:"Usuario",ancho:16},{titulo:"Cuentas",ancho:22},{titulo:"Acciones",ancho:10},
  {titulo:"Horas con actividad",ancho:10},{titulo:"Primera",ancho:10},{titulo:"Última",ancho:10}];
const filaDia = (p, d, x) => [d, p.nombre, x.cuentas.join(" + "), x.acciones, x.horas, x.primera||"", x.primera ? x.ultima : ""];
function excelDia(dia){
  const hoy = [], historia = [], que = [];
  D.personas.forEach(p=>{
    const x = delDia(p, dia);
    if(x){
      hoy.push(filaDia(p, dia, x));
      (x.entidades||[]).forEach(([e,a,n])=>que.push([p.nombre, e, ACCION[a]||a, n]));
    }
    p.dias.forEach(y=>historia.push(filaDia(p, y.dia, y)));
  });
  hoy.sort((a,b)=>b[3]-a[3]);
  historia.sort((a,b)=>b[0].localeCompare(a[0]) || b[3]-a[3]);
  XLSX.descarga(XLSX.libro([
    {nombre:"Día", titulo:tit(`uso de VenCloud el ${fechaLarga(dia)}`), columnas:COL_DIA, filas:hoy},
    {nombre:"Qué tocó", titulo:tit(`qué tocó cada usuario el ${fechaLarga(dia)}`), filas:que,
     columnas:[{titulo:"Usuario",ancho:16},{titulo:"Qué",ancho:30},{titulo:"Acción",ancho:10},{titulo:"Veces",ancho:10}]},
    {nombre:"Día a día", titulo:tit("uso de VenCloud, día a día"), columnas:COL_DIA, filas:historia}]),
    `utilizo_${dia}.xlsx`);
}
const COL_MES = [{titulo:"Mes",ancho:9},{titulo:"Usuario",ancho:16},{titulo:"Cuentas",ancho:22},{titulo:"Acciones",ancho:10},
  {titulo:"Días con actividad",ancho:10},{titulo:"Horas con actividad",ancho:10},{titulo:"Media de acciones por día",ancho:12}];
const filaMes = (p, m, y) => [m, p.nombre, p.cuentas.join(" + "), y.acciones, y.dias, y.horas, Math.round(y.acciones/y.dias)];
function excelMes(mes){
  const resumen = [], dias = [];
  D.personas.forEach(p=>{
    const y = delMes(p, mes);
    if(!y) return;
    resumen.push(filaMes(p, mes, y));
    y.lista.forEach(x=>dias.push(filaDia(p, x.dia, x)));
  });
  resumen.sort((a,b)=>b[3]-a[3]);
  dias.sort((a,b)=>a[0].localeCompare(b[0]) || b[3]-a[3]);
  XLSX.descarga(XLSX.libro([
    {nombre:"Mes", titulo:tit(`uso de VenCloud en ${mesLargo(mes)}`), columnas:COL_MES, filas:resumen},
    {nombre:"Día a día", titulo:tit(`uso de VenCloud en ${mesLargo(mes)}, día a día`), columnas:COL_DIA, filas:dias}]),
    `utilizo_${mes}.xlsx`);
}
function excelPersona(p, dia, mes){
  const x = dia ? delDia(p, dia) : null;
  const hojas = [
    {nombre:"Mes a mes", titulo:tit(`${p.nombre}, mes a mes`), columnas:COL_MES,
     filas:MESES.map(m=>[m, delMes(p, m)]).filter(([,y])=>y).map(([m,y])=>filaMes(p, m, y))},
    {nombre:"Día a día", titulo:tit(`${p.nombre}, día a día`), columnas:COL_DIA, filas:p.dias.map(y=>filaDia(p, y.dia, y))}];
  if(x && x.entidades) hojas.push(
    {nombre:"Qué tocó", titulo:tit(`qué tocó ${p.nombre} el ${fechaLarga(dia)}`),
     filas:x.entidades.map(([e,a,n])=>[e, ACCION[a]||a, n]),
     columnas:[{titulo:"Qué",ancho:30},{titulo:"Acción",ancho:10},{titulo:"Veces",ancho:10}]},
    {nombre:"Por hora", titulo:tit(`acciones de ${p.nombre} por hora el ${fechaLarga(dia)}`),
     filas:Array.from({length:24},(_,h)=>[`${String(h).padStart(2,"0")}:00`, (x.por_hora||{})[h]||0]),
     columnas:[{titulo:"Hora",ancho:8},{titulo:"Acciones",ancho:10}]});
  XLSX.descarga(XLSX.libro(hojas), `utilizo_${limpio(p.nombre)}_${dia || mes}.xlsx`);
}

/* ===================================================================
   La dashboard y Vendi (docs/77)
   =================================================================== */
const PAGINA = {panel:"Panel", operativo:"Informe operativo", cuadro:"Cuadro de mando", rutas:"Rutas",
  incidencias:"Incidencias", devoluciones:"Devoluciones", furgonetas:"Furgonetas", almacenes:"Almacenes",
  telemetria:"Telemetría", tarifas:"Tarifas", revision:"Revisión clientes", utilizo:"Utilizo",
  preferidos:"Preferidos", cifras:"Cifras", consola:"Consola", avisos:"Avisos", otra:"Otra"};
const usd  = (n, dec=2) => new Intl.NumberFormat("es-ES",{style:"currency", currency:"USD",
  minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n||0);
const nomP = u => u.nombre || u.correo;
/* Si ese dia la persona tiene algo de esta pestaña. Un dia sin fila no es un
   cero inventado: desde que se cuenta, no haber abierto nada es eso, cero. */
const tiene = (que, x) => !!x && (que==="web" ? (x.vistas||x.entradas) > 0 : x.preguntas != null);
const diasDe = que => [...new Set(P.usuarios.flatMap(u=>Object.keys(u.dias).filter(d=>tiene(que, u.dias[d]))))].sort().reverse();

/* Lo de una persona en unos dias, sumado. */
function sumaDe(u, que, dentro){
  const lista = Object.keys(u.dias).filter(d=>dentro(d) && tiene(que, u.dias[d])).sort().map(d=>[d, u.dias[d]]);
  if(!lista.length) return null;
  const t = {dias:lista.length, lista, entradas:0, vistas:0, paginas:{}, preguntas:0, gasto:0, primera:"", ultima:""};
  lista.forEach(([,x])=>{
    t.entradas += x.entradas||0; t.vistas += x.vistas||0;
    t.preguntas += x.preguntas||0; t.gasto += x.gasto_usd||0;
    Object.entries(x.paginas||{}).forEach(([k,n])=>{ t.paginas[k] = (t.paginas[k]||0) + n; });
  });
  if(lista.length===1){ t.primera = lista[0][1].primera||""; t.ultima = lista[0][1].ultima||""; }
  t.top = Object.entries(t.paginas).sort((a,b)=>b[1]-a[1]);
  return t;
}
const topTxt = t => t.top.length ? `${esc(PAGINA[t.top[0][0]]||t.top[0][0])} <span class="peq">${num(t.top[0][1])}</span>` : "—";

async function cargaPlataforma(){
  if(P) return true;
  if(ERR.plataforma) return false;
  let rr;
  try{ rr = await fetch("/api/utilizo/plataforma", {credentials:"same-origin"}); }
  catch(e){ ERR.plataforma = {texto:"No hay conexión con el servidor.", mal:true}; return false; }
  if(rr.status === 401){ location.href = "/"; return false; }
  if(!rr.ok){
    let e={}; try{ e = await rr.json(); }catch(x){}
    ERR.plataforma = {texto: e.error || "El uso de la dashboard y de Vendi no está disponible ahora mismo.", mal:true};
    return false;
  }
  P = await rr.json();
  P.usuarios = P.usuarios || [];
  return true;
}

function pintaPlataforma(r){
  const que = r.que, dias = diasDe(que);
  const meses = [...new Set(dias.map(d=>d.slice(0,7)))];
  const desde = que==="web" ? P.desde_web : P.desde_ia;
  pie(que==="web"
    ? `Se cuenta desde el ${desde ? fechaCorta(desde) : "día en que se subió este cambio"}: antes no se apuntaba, así que de antes no hay datos. `
      + "Una entrada es cada vez que alguien entra con su correo y su clave; una página vista, cada página de la dashboard que abre (la sesión dura 12 horas, así que se pueden ver páginas sin volver a entrar). "
      + "Lo que no se puede medir es el tiempo que pasa mirando cada página. Las horas son las de España. El día de hoy va a medias, se ve al momento."
    : `Se cuenta desde el ${desde ? fechaCorta(desde) : "día en que se activó Vendi"}. `
      + "Una pregunta es cada mensaje que se le escribe a Vendi (o al muñeco que lleve cada uno); el gasto es lo que cobra Anthropic por esa pregunta en la API de Claude, en dólares, calculado con los tokens de cada respuesta. "
      + "Cada día va en hora UTC, la del contador de preguntas del asistente. El día de hoy va a medias.");
  if(!dias.length){
    $("#barra").hidden = true; $("#miga").hidden = true; $("#vista").innerHTML = "";
    avisa(que==="web" ? "Todavía no se ha apuntado ninguna visita a la dashboard: se empieza a contar desde que se subió este cambio."
                      : "Todavía nadie le ha preguntado nada a Vendi.");
    return;
  }
  const dia = r.dia && dias.includes(r.dia) ? r.dia : dias[0];
  const mes = r.mes && meses.includes(r.mes) ? r.mes : meses[0];
  $("#fPer").value = r.per;
  $("#lDia").hidden = r.per!=="dia"; $("#lMes").hidden = r.per!=="mes";
  $("#fDia").innerHTML = dias.map(d=>`<option value="${d}"${d===dia?" selected":""}>${esc(fechaLarga(d))} de ${d.slice(0,4)}</option>`).join("");
  $("#fMes").innerHTML = meses.map(m=>`<option value="${m}"${m===mes?" selected":""}>${esc(mesLargo(m))}</option>`).join("");
  if(document.activeElement !== $("#fBusca")) $("#fBusca").value = r.q;
  $("#barra").hidden = false;
  const u = r.p && P.usuarios.find(x=>x.correo===r.p);
  if(u) return vistaUsuario(u, que, r.per==="mes" ? null : dia, r.per==="mes" ? mes : dia.slice(0,7), dias, meses);
  $("#miga").hidden = true;
  $("#lBusca").hidden = false;
  vistaPlataforma(que, r.per, r.per==="mes" ? mes : dia, r, dias);
}

function vistaPlataforma(que, per, clave, r, dias){
  const dentro = per==="mes" ? (d=>d.slice(0,7)===clave) : (d=>d===clave);
  const cuando = per==="mes" ? `en ${mesLargo(clave)}` : `el ${fechaLarga(clave)}`;
  const orden = que==="web" ? (t=>t.vistas*1000+t.entradas) : (t=>t.gasto);
  const activos = P.usuarios.map(u=>({u, t:sumaDe(u, que, dentro)})).filter(o=>o.t)
    .sort((a,b)=>orden(b.t)-orden(a.t) || nomP(a.u).localeCompare(nomP(b.u),"es"));
  const busca = sinTildes(r.q);
  const filas = busca ? activos.filter(o=>sinTildes(nomP(o.u)+" "+o.u.correo+" "+o.u.perfil).includes(busca)) : activos;
  const sum = k => activos.reduce((s,o)=>s+o.t[k], 0);
  const ultimos = dias.filter(d=>d<=(per==="mes" ? clave+"-31" : clave)).slice(0,30);
  const v = $("#vista");
  if(que==="web"){
    v.innerHTML = `<div class="kpis fijos">`
      + `<div class="kpi"><div class="et">Personas</div><div class="vl">${num(activos.length)}</div><div class="nt">que usaron la dashboard ${esc(cuando)}</div></div>`
      + `<div class="kpi"><div class="et">Páginas vistas</div><div class="vl">${num(sum("vistas"))}</div><div class="nt">cada página que se abrió</div></div>`
      + `<div class="kpi"><div class="et">Entradas</div><div class="vl">${num(sum("entradas"))}</div><div class="nt">veces que se entró con la clave</div></div>`
      + `</div><section class="caja" id="tabla"></section>`;
  } else {
    const preg = sum("preguntas"), gasto = sum("gasto");
    v.innerHTML = `<div class="kpis fijos">`
      + `<div class="kpi"><div class="et">Personas</div><div class="vl">${num(activos.length)}</div><div class="nt">que preguntaron a Vendi ${esc(cuando)}</div></div>`
      + `<div class="kpi"><div class="et">Preguntas</div><div class="vl">${num(preg)}</div><div class="nt">entre todas</div></div>`
      + `<div class="kpi"><div class="et">Gasto</div><div class="vl">${usd(gasto)}</div><div class="nt">en la API de Claude</div></div>`
      + `<div class="kpi"><div class="et">Por pregunta</div><div class="vl">${preg ? usd(gasto/preg, 3) : "—"}</div><div class="nt">de media</div></div>`
      + `</div><section class="caja" id="tabla"></section>`;
  }
  const caja = $("#tabla");
  caja.innerHTML = `<div class="cabsec"><h2>${que==="web" ? "Uso de la dashboard" : "Uso de Vendi"} ${esc(cuando)}</h2>`
    + `<button class="btn primario" id="bExcel" type="button">Descargar Excel</button></div>`
    + `<p class="explica">${que==="web"
        ? "Cada persona que abrió la dashboard: cuántas páginas vio, cuántas veces entró con su clave, la página que más abrió y cuántos días la usó. Pulsa una persona para ver su historia."
        : "Cada persona que preguntó a Vendi: cuántas preguntas le hizo, lo que costaron y lo que sale cada una. Pulsa una persona para ver su historia."}</p>`;
  $("#bExcel").addEventListener("click", ()=>excelPlataforma(que, per, clave, activos));
  if(!filas.length){
    caja.insertAdjacentHTML("beforeend", `<p class="vacio">${busca ? "Nadie con ese nombre." : "Nadie."}</p>`);
    return;
  }
  const max = Math.max(1, ...activos.map(o=>que==="web" ? o.t.vistas : o.t.gasto));
  const barra = n => `<span class="barrita" style="width:${Math.max(2, Math.round(n/max*60))}px"></span>`;
  const persona = u => `<td><button class="mat" type="button" data-p="${esc(u.correo)}">${esc(nomP(u))}</button>`
    + (u.nombre ? `<div class="peq">${esc(u.correo)}</div>` : "") + `</td><td class="oculta-movil">${esc(u.perfil||"—")}</td>`;
  let cab, fila;
  if(que==="web" && per==="dia"){
    cab = `<th>Persona</th><th class="oculta-movil">Perfil</th><th class="n">Páginas vistas</th><th class="n">Entradas</th><th class="oculta-movil">Primera · última</th><th class="oculta-movil">La que más abrió</th><th class="n oculta-movil">Días con uso</th>`;
    fila = ({u,t}) => persona(u) + `<td class="n">${barra(t.vistas)}<b>${num(t.vistas)}</b></td><td class="n">${num(t.entradas)}</td>`
      + `<td class="oculta-movil">${esc(deA(t))}</td><td class="oculta-movil">${topTxt(t)}</td>`
      + `<td class="n oculta-movil">${num(ultimos.filter(d=>tiene("web", u.dias[d])).length)} <span class="peq">de ${num(ultimos.length)}</span></td>`;
  } else if(que==="web"){
    cab = `<th>Persona</th><th class="oculta-movil">Perfil</th><th class="n">Páginas vistas</th><th class="n">Entradas</th><th class="n">Días</th><th class="n oculta-movil">Páginas por día</th><th class="oculta-movil">La que más abrió</th>`;
    fila = ({u,t}) => persona(u) + `<td class="n">${barra(t.vistas)}<b>${num(t.vistas)}</b></td><td class="n">${num(t.entradas)}</td>`
      + `<td class="n">${num(t.dias)}</td><td class="n oculta-movil">${num(t.vistas/t.dias)}</td><td class="oculta-movil">${topTxt(t)}</td>`;
  } else {
    cab = `<th>Persona</th><th class="oculta-movil">Perfil</th><th class="n">Preguntas</th><th class="n">Gasto</th><th class="n oculta-movil">Por pregunta</th>` + (per==="mes" ? `<th class="n oculta-movil">Días</th>` : "");
    fila = ({u,t}) => persona(u) + `<td class="n">${num(t.preguntas)}</td><td class="n">${barra(t.gasto)}<b>${usd(t.gasto)}</b></td>`
      + `<td class="n oculta-movil">${t.preguntas ? usd(t.gasto/t.preguntas, 3) : "—"}</td>` + (per==="mes" ? `<td class="n oculta-movil">${num(t.dias)}</td>` : "");
  }
  caja.insertAdjacentHTML("beforeend", `<div class="tabla-env"><table><thead><tr>${cab}</tr></thead><tbody>`
    + filas.map(o=>`<tr>${fila(o)}</tr>`).join("") + `</tbody></table></div>`);
  caja.querySelectorAll(".mat").forEach(b=>b.addEventListener("click", ()=>ir({p:b.dataset.p})));
}

function vistaUsuario(u, que, dia, mes, dias, meses){
  $("#lBusca").hidden = true;
  const mi = $("#miga");
  mi.innerHTML = `<a href="#" id="volver">Todas las personas</a> › <b>${esc(nomP(u))}</b>`;
  mi.hidden = false;
  $("#volver").addEventListener("click", e=>{ e.preventDefault(); ir({p:""}); });
  const web = que==="web";
  const t = sumaDe(u, que, dia ? (d=>d===dia) : (d=>d.slice(0,7)===mes));
  let h = `<section class="caja"><div class="cabsec"><div><h2>${esc(nomP(u))} · ${esc(dia ? fechaLarga(dia) : mesLargo(mes))}</h2>`
    + `<div class="peq">${esc(u.correo)}${u.perfil ? " · " + esc(u.perfil) : ""}</div></div>`
    + `<button class="btn primario" id="bExcel" type="button">Descargar Excel</button></div>`;
  if(!t) h += `<p class="vacio">${web ? "No abrió la dashboard" : "No preguntó nada a Vendi"} ${dia ? "ese día" : "ese mes"}.</p>`;
  else if(web){
    h += `<div class="persona-cab"><div><b>${num(t.vistas)}</b>páginas vistas</div><div><b>${num(t.entradas)}</b>entradas</div>`
      + (dia ? `<div><b>${esc(deA(t))}</b>primera · última</div>` : `<div><b>${num(t.dias)}</b>días con uso</div>`) + `</div>`
      + (t.top.length ? `<h2 style="margin-top:16px">Qué páginas abrió</h2><div class="tabla-env"><table><thead><tr><th>Página</th><th class="n">Veces</th></tr></thead><tbody>`
          + t.top.map(([k,n])=>`<tr><td>${esc(PAGINA[k]||k)}</td><td class="n">${num(n)}</td></tr>`).join("") + `</tbody></table></div>` : "");
  } else {
    h += `<div class="persona-cab"><div><b>${num(t.preguntas)}</b>preguntas</div><div><b>${usd(t.gasto)}</b>gasto</div>`
      + `<div><b>${t.preguntas ? usd(t.gasto/t.preguntas, 3) : "—"}</b>por pregunta</div>` + (dia ? "" : `<div><b>${num(t.dias)}</b>días</div>`) + `</div>`;
  }
  const celdas = x => web
    ? (tiene("web", x) ? `<td class="n"><b>${num(x.vistas||0)}</b></td><td class="n">${num(x.entradas||0)}</td><td class="oculta-movil">${esc(deA(x))}</td>`
                        : `<td class="n">0</td><td class="n">0</td><td class="oculta-movil peq">sin uso</td>`)
    : (tiene("ia", x) ? `<td class="n"><b>${num(x.preguntas)}</b></td><td class="n">${usd(x.gasto_usd)}</td>`
                       : `<td class="n">0</td><td class="n">${usd(0)}</td>`);
  const cabDia = web ? `<th class="n">Páginas vistas</th><th class="n">Entradas</th><th class="oculta-movil">Primera · última</th>` : `<th class="n">Preguntas</th><th class="n">Gasto</th>`;
  h += `<h2 style="margin-top:16px">Día a día, ${esc(mesLargo(mes))}</h2><div class="tabla-env"><table><thead><tr><th>Día</th>${cabDia}</tr></thead><tbody>`
    + dias.filter(d=>d.slice(0,7)===mes).map(d=>`<tr><td><a href="#" class="dia" data-d="${d}">${esc(fechaCorta(d))}</a></td>${celdas(u.dias[d])}</tr>`).join("")
    + `</tbody></table></div>`;
  const cabMes = web ? `<th class="n">Páginas vistas</th><th class="n">Entradas</th><th class="n">Días</th>` : `<th class="n">Preguntas</th><th class="n">Gasto</th><th class="n">Días</th>`;
  h += `<h2 style="margin-top:16px">Mes a mes</h2><div class="tabla-env" id="mesames"><table><thead><tr><th>Mes</th>${cabMes}</tr></thead><tbody>`
    + meses.map(m=>{
        const y = sumaDe(u, que, d=>d.slice(0,7)===m);
        return `<tr><td><a href="#" class="mes" data-m="${m}">${esc(mesLargo(m))}</a></td>`
          + (!y ? (web ? `<td class="n">0</td><td class="n">0</td><td class="n">0</td>` : `<td class="n">0</td><td class="n">${usd(0)}</td><td class="n">0</td>`)
               : web ? `<td class="n"><b>${num(y.vistas)}</b></td><td class="n">${num(y.entradas)}</td><td class="n">${num(y.dias)}</td>`
                     : `<td class="n"><b>${num(y.preguntas)}</b></td><td class="n">${usd(y.gasto)}</td><td class="n">${num(y.dias)}</td>`) + `</tr>`;
      }).join("")
    + `</tbody></table></div></section>`;
  const v = $("#vista");
  v.innerHTML = h;
  v.querySelectorAll("a.dia").forEach(a=>a.addEventListener("click", e=>{ e.preventDefault(); ir({per:"dia", dia:a.dataset.d}); }));
  v.querySelectorAll("a.mes").forEach(a=>a.addEventListener("click", e=>{ e.preventDefault(); ir({per:"mes", mes:a.dataset.m}); }));
  $("#bExcel").addEventListener("click", ()=>excelUsuario(u, que));
}

/* Los Excel de la dashboard y de Vendi: lo que se ve y, detras, dia a dia. */
const COL_WEB = [{titulo:"Día",ancho:12},{titulo:"Persona",ancho:22},{titulo:"Correo",ancho:28},{titulo:"Perfil",ancho:18},
  {titulo:"Páginas vistas",ancho:10},{titulo:"Entradas",ancho:10},{titulo:"Primera",ancho:9},{titulo:"Última",ancho:9},{titulo:"Páginas",ancho:50}];
const COL_IA = [{titulo:"Día",ancho:12},{titulo:"Persona",ancho:22},{titulo:"Correo",ancho:28},{titulo:"Perfil",ancho:18},
  {titulo:"Preguntas",ancho:10},{titulo:"Gasto (USD)",ancho:12}];
const filaUso = (que, u, d, x) => que==="web"
  ? [d, nomP(u), u.correo, u.perfil||"", x.vistas||0, x.entradas||0, x.primera||"", x.ultima||"",
     Object.entries(x.paginas||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${PAGINA[k]||k} ${n}`).join(", ")]
  : [d, nomP(u), u.correo, u.perfil||"", x.preguntas||0, Math.round((x.gasto_usd||0)*10000)/10000];
const diaADia = (que, us) => us.flatMap(u=>Object.keys(u.dias).filter(d=>tiene(que, u.dias[d])).map(d=>filaUso(que, u, d, u.dias[d])))
  .sort((a,b)=>b[0].localeCompare(a[0]) || b[4]-a[4]);
function excelPlataforma(que, per, clave, activos){
  const nombre = que==="web" ? "dashboard" : "vendi";
  const cuando = per==="mes" ? `en ${mesLargo(clave)}` : `el ${fechaLarga(clave)}`;
  const resumen = que==="web"
    ? {columnas:[{titulo:"Persona",ancho:22},{titulo:"Correo",ancho:28},{titulo:"Perfil",ancho:18},{titulo:"Páginas vistas",ancho:10},
                 {titulo:"Entradas",ancho:10},{titulo:"Días con uso",ancho:10},{titulo:"La que más abrió",ancho:20}],
       filas:activos.map(({u,t})=>[nomP(u), u.correo, u.perfil||"", t.vistas, t.entradas, t.dias, t.top.length ? PAGINA[t.top[0][0]]||t.top[0][0] : ""])}
    : {columnas:[{titulo:"Persona",ancho:22},{titulo:"Correo",ancho:28},{titulo:"Perfil",ancho:18},{titulo:"Preguntas",ancho:10},
                 {titulo:"Gasto (USD)",ancho:12},{titulo:"Por pregunta (USD)",ancho:12},{titulo:"Días",ancho:8}],
       filas:activos.map(({u,t})=>[nomP(u), u.correo, u.perfil||"", t.preguntas, Math.round(t.gasto*10000)/10000,
                                   t.preguntas ? Math.round(t.gasto/t.preguntas*10000)/10000 : "", t.dias])};
  XLSX.descarga(XLSX.libro([
    {nombre: per==="mes" ? "Mes" : "Día", titulo:tit(`uso de ${que==="web" ? "la dashboard" : "Vendi"} ${cuando}`), ...resumen},
    {nombre:"Día a día", titulo:tit(`uso de ${que==="web" ? "la dashboard" : "Vendi"}, día a día`),
     columnas: que==="web" ? COL_WEB : COL_IA, filas:diaADia(que, P.usuarios)}]),
    `utilizo_${nombre}_${clave}.xlsx`);
}
function excelUsuario(u, que){
  XLSX.descarga(XLSX.libro([
    {nombre:"Día a día", titulo:tit(`${nomP(u)}, uso de ${que==="web" ? "la dashboard" : "Vendi"} día a día`),
     columnas: que==="web" ? COL_WEB : COL_IA, filas:diaADia(que, [u])}]),
    `utilizo_${que==="web" ? "dashboard" : "vendi"}_${limpio(nomP(u))}.xlsx`);
}

  pie("Sale del registro de actividad de VenCloud (control.activitylog): cada alta, cambio o borrado que hace un usuario, con su hora. Los procesos automáticos de VenCloud no cuentan. El día de hoy no sale hasta mañana, cuando está completo. Se guarda toda la historia; el detalle por hora y qué tocó, de los dos últimos meses."
    + (D.generado ? ` Calculado con la carga del ${fechaCorta(D.generado)}.` : ""));
}

async function cargaVenCloud(){
  if(D) return true;
  if(ERR.vencloud) return false;
  let rr;
  try{ rr = await fetch("/api/utilizo", {credentials:"same-origin"}); }
  catch(e){ ERR.vencloud = {texto:"No hay conexión con el servidor.", mal:true}; return false; }
  if(rr.status === 401){ location.href = "/"; return false; }
  if(!rr.ok){
    let e={}; try{ e = await rr.json(); }catch(x){}
    ERR.vencloud = {texto: e.error || "El uso de VenCloud no está disponible ahora mismo.", mal:true};
    return false;
  }
  const d = await rr.json();
  if(d.sin_dato){ ERR.vencloud = {texto:d.sin_dato}; return false; }
  d.dias = d.dias || []; d.personas = d.personas || [];
  if(!d.dias.length){ ERR.vencloud = {texto:"Todavía no ha llegado ningún día de actividad de VenCloud."}; return false; }
  MESES = [...new Set(d.dias.map(x=>x.slice(0,7)))].sort().reverse();
  D = d;
  return true;
}

(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  YO = await r.json();
  if(YO.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  $("#quien").textContent = (YO.perfil ? YO.perfil + " · " : "") + (YO.nombre || YO.correo);
  $("#pestanas").hidden = false;
  window.addEventListener("hashchange", pinta);
  await pinta();
  $("#cargando").hidden = true;
  /* La estrella de preferidos de cada tabla, y la vista suelta de /preferidos/ (docs/62). */
  Preferidos.monta("utilizo", {});
})();
