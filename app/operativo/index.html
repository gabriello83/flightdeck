<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe operativo · digivend</title>
<!-- Un solo origen. Esta pagina habla con /api/* del mismo dominio y con nadie
     mas: hay redes de cliente que cortan las paginas que llaman fuera. La
     cabecera de verdad la pone CloudFront; esta va por si se abre suelta. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M3 3h4v4H3zm6 0h4v4H9zM3 9h4v4H3zm6 0h4v4H9z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --fondo:#f4f4f2; --tarjeta:#fcfcfb; --borde:#e2e1dc; --borde-fuerte:#cdccc5;
  --tinta:#0b0b0b; --tinta-2:#52514e; --tinta-3:#78766f;
  --s1:#2a78d6;
  --sombra:0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --rango:rgba(42,120,214,.15);
  /* El semaforo. El amarillo lleva texto oscuro: con blanco no se lee. */
  --verde:#15803d; --amarillo:#f2b705; --rojo:#c62828;
  /* Los cuadrados sin semaforo, cada uno de su color. Ninguno es verde, ni
     ambar ni rojo, para que no se confundan con un estado. */
  --c-almacenes:#6d4fc2; --c-furgonetas:#1f6f8b; --c-pdvs:#2a62c9;
  --c-ventas:#a63d84; --c-reposiciones:#4a5568; --c-devoluciones:#7a4e1d; --c-revision:#3d5a80; --c-utilizo:#5b4b8a; --c-preferidos:#334155;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
    --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
    --s1:#3987e5; --sombra:none; --rango:rgba(57,135,229,.28);
    --verde:#17803f; --amarillo:#e3ac06; --rojo:#c0392b;
    --c-almacenes:#6a4fbf; --c-furgonetas:#1d6a84; --c-pdvs:#2a5fbf;
    --c-ventas:#9c3a7c; --c-reposiciones:#4b5563; --c-devoluciones:#7a4e1d; --c-revision:#3a557a; --c-utilizo:#55477f; --c-preferidos:#334155;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#121211; --tarjeta:#1a1a19; --borde:#30302d; --borde-fuerte:#45453f;
  --tinta:#ffffff; --tinta-2:#c3c2b7; --tinta-3:#9a9890;
  --s1:#3987e5; --sombra:none; --rango:rgba(57,135,229,.28);
  --verde:#17803f; --amarillo:#e3ac06; --rojo:#c0392b;
  --c-almacenes:#6a4fbf; --c-furgonetas:#1d6a84; --c-pdvs:#2a5fbf;
  --c-ventas:#9c3a7c; --c-reposiciones:#4b5563; --c-devoluciones:#7a4e1d; --c-revision:#3a557a; --c-utilizo:#55477f; --c-preferidos:#334155;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px;margin:0 auto;padding:18px 16px 72px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marca b{font-size:20px;letter-spacing:-.01em}
.marca span{color:var(--tinta-2);font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button.btn,a.btn{
  font:inherit;font-size:13px;color:var(--tinta);background:var(--tarjeta);text-decoration:none;
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:6px 11px;cursor:pointer;
}
button.btn:hover,a.btn:hover{border-color:var(--tinta-3)}
.barra{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 6px}
.barra label{font-size:13px;color:var(--tinta-2);display:flex;align-items:center;gap:8px}
.barra select{
  font:inherit;font-size:14px;color:var(--tinta);background:var(--tarjeta);
  border:1px solid var(--borde-fuerte);border-radius:8px;padding:5px 8px
}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.nota{
  margin:12px 0 4px;padding:10px 13px;border:1px solid var(--borde);border-left:3px solid var(--s1);
  border-radius:8px;background:var(--tarjeta);color:var(--tinta-2);font-size:13px
}
.nota.mal{border-left-color:var(--rojo)}
.cuadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.cuadro{
  --fondo-c:var(--tarjeta); --tinta-c:#fff;
  position:relative;display:flex;flex-direction:column;min-height:200px;
  aspect-ratio:1/1;max-height:290px;
  background:var(--fondo-c);color:var(--tinta-c);border-radius:14px;padding:16px 18px;
  text-decoration:none;box-shadow:var(--sombra);overflow:hidden;
  transition:transform .12s ease-out, box-shadow .12s ease-out;
}
a.cuadro:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
a.cuadro:focus-visible{outline:3px solid var(--s1);outline-offset:3px}
.cuadro .et{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;opacity:.92}
.cuadro .vl{
  font-size:clamp(34px,5vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.05;
  margin-top:auto;font-variant-numeric:tabular-nums;overflow-wrap:anywhere
}
.cuadro .sub{font-size:13.5px;line-height:1.4;margin-top:6px;opacity:.95;overflow-wrap:anywhere}
.cuadro .pie{font-size:12px;margin-top:12px;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.cuadro .estado{
  position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:650;
  padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.22)
}
.cuadro.amarillo{--tinta-c:#1d1a10}
.cuadro.amarillo .estado{background:rgba(0,0,0,.12)}
.cuadro .et svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px;fill:#f5b800;stroke:#e3a008;stroke-width:1.7}
.cuadro.sin{
  --tinta-c:var(--tinta);background:var(--tarjeta);border:1px dashed var(--borde-fuerte);box-shadow:none
}
.cuadro.sin .vl{font-size:22px;color:var(--tinta-2);font-weight:600;letter-spacing:-.01em}
.cuadro.sin .sub{color:var(--tinta-2)}
/* El calendario (Gabriele, 19-oct): el mes con sus dias; pulsando el titulo,
   los meses del año; otra vez, los años. Los dias sin dato van apagados. */
.fecha{position:relative}
.fecha > button.btn{font-size:14px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px}
.fecha > button.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.modo{display:inline-flex;border:1px solid var(--borde-fuerte);border-radius:8px;overflow:hidden}
.modo button{font:inherit;font-size:13px;border:0;background:var(--tarjeta);color:var(--tinta-2);padding:6px 11px;cursor:pointer}
.modo button[aria-pressed="true"]{background:var(--s1);color:#fff}
.cal{
  position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:300px;
  background:var(--tarjeta);border:1px solid var(--borde-fuerte);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px 12px
}
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.cal-cab button{font:inherit;border:0;background:none;color:var(--tinta);cursor:pointer;border-radius:8px;padding:5px 9px}
.cal-cab button:hover:not(:disabled){background:var(--fondo)}
.cal-cab button:disabled{color:var(--tinta-3);cursor:default;opacity:.4}
.cal-cab .tit{font-weight:650;font-size:14.5px}
.cal-rej{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-rej.ancha{grid-template-columns:repeat(3,1fr);gap:6px}
.cal-rej .ds{font-size:11.5px;color:var(--tinta-3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-rej button{
  font:inherit;font-size:13.5px;border:0;background:none;color:var(--tinta);border-radius:8px;
  height:34px;cursor:pointer;font-variant-numeric:tabular-nums;text-transform:capitalize
}
.cal-rej.ancha button{height:44px}
.cal-rej button:hover:not(:disabled){background:var(--fondo)}
.cal-rej button:disabled{color:var(--tinta-3);opacity:.45;cursor:default}
.cal-rej button.hoy{box-shadow:inset 0 0 0 1px var(--borde-fuerte)}
.cal-rej button.en{background:var(--rango);border-radius:0}
.cal-rej button.sel{background:var(--s1);color:#fff;border-radius:8px}
.cal-rej button:focus-visible,.cal-cab button:focus-visible,.cal-pie button:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.cal-pie{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;border-top:1px solid var(--borde);padding-top:10px}
.cal-pie button{font:inherit;font-size:12.5px;border:1px solid var(--borde-fuerte);background:var(--tarjeta);color:var(--tinta);border-radius:999px;padding:3px 10px;cursor:pointer}
.cal-pie .ayuda{font-size:12.5px;color:var(--tinta-2);width:100%}
footer{margin-top:26px;color:var(--tinta-3);font-size:12px;border-top:1px solid var(--borde);padding-top:12px}
#cargando{padding:40px 0;color:var(--tinta-2)}
@media (max-width:560px){
  .cal{position:fixed;left:16px;right:16px;top:auto;width:auto;margin-top:6px}
  .cuadros{grid-template-columns:1fr 1fr;gap:10px}
  .cuadro{aspect-ratio:auto;min-height:168px;padding:13px 13px}
  .cuadro .vl{font-size:28px}
  .cuadro .sub{font-size:12.5px}
  .cuadro .estado{position:static;align-self:flex-start;margin-top:6px}
  .cuadro .pie{justify-content:flex-end}
  .cuadro .pie .foto{display:none}
}
@media (max-width:360px){ .cuadros{grid-template-columns:1fr} }
</style>
</head>
<body>
<!-- La bienvenida animada, solo al entrar (comun/bienvenida.js). Va antes que
     la pagina para tapar el «Cargando…» desde el primer instante. -->
<script src="/comun/bienvenida.js"></script>
<script src="/comun/asistente.js"></script>
<div class="env">
  <header class="top">
    <div class="marca">
      <b>Informe general operativo</b>
      <span id="quien"></span>
    </div>
    <div class="acciones">
      <a class="btn" href="/panel/" id="bPanel">Panel completo</a>
      <button class="btn" id="bPreguntar" type="button" hidden>Preguntar</button>
      <button class="btn" id="bTema" type="button">Modo oscuro</button>
      <button class="btn" id="bSalir" type="button">Salir</button>
    </div>
  </header>

  <div class="barra" id="barra" hidden>
    <div class="modo" role="group" aria-label="Días">
      <button type="button" id="mUno" aria-pressed="true">Un día</button>
      <button type="button" id="mVarios" aria-pressed="false">Varios días</button>
    </div>
    <div class="fecha">
      <button class="btn" type="button" id="bFecha" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span id="tFecha"></span>
      </button>
      <div class="cal" id="cal" role="dialog" aria-label="Elegir día" hidden></div>
    </div>
    <label id="lArea" hidden>Área <select id="area"></select></label>
    <label id="lDeleg" hidden>Delegación <select id="deleg"></select></label>
    <div class="leyenda" aria-label="Colores">
      <span><i style="background:var(--verde)"></i><span id="lVerde"></span></span>
      <span><i style="background:var(--amarillo)"></i><span id="lAmarillo"></span></span>
      <span><i style="background:var(--rojo)"></i><span id="lRojo"></span></span>
    </div>
  </div>

  <div id="cargando">Cargando…</div>
  <div class="nota" id="aviso" hidden></div>
  <div class="cuadros" id="cuadros" hidden></div>

  <footer id="pie" hidden></footer>
</div>

<script>
/* ===================================================================
   Informe general operativo · digivend.es  (docs/51)

   Ocho cuadrados, cada uno con la cifra de un dia, que llevan a la seccion
   del panel que les toca. Lo que llega ya viene recortado por la API: el
   fichero es el del perfil de la sesion, con los cuadrados que sus sesiones
   permiten. Esta pagina no decide quien ve que: solo dibuja.

   Los colores de rutas, averias y telemetria son el semaforo; los demas
   cuadrados llevan cada uno su color, que no es un estado. Un cuadrado sin
   dato no sale en gris con un cero: sale con el motivo.
   =================================================================== */
const CLAVE_TEMA = "digivend.tema";
const eur  = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const num  = n => new Intl.NumberFormat("es-ES").format(Math.round(n||0));
const pct  = n => new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}).format(n||0) + " %";
const esc  = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);

function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribir(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function tema(){
  const t = leer(CLAVE_TEMA);
  if(t) document.documentElement.setAttribute("data-theme", t);
  const b = $("#bTema");
  const oscuro = () => document.documentElement.getAttribute("data-theme")==="dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const pinta = () => { b.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  pinta();
  b.addEventListener("click", ()=>{
    const n = oscuro() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n); escribir(CLAVE_TEMA,n); pinta();
  });
})();
$("#bSalir").addEventListener("click", async ()=>{
  try{ await fetch("/api/salir", {method:"POST", credentials:"same-origin"}); }catch(e){}
  location.href = "/";
});

/* A donde lleva cada cuadrado: la sesion del panel y el panel dentro de ella.
   Gabriele decidira en un segundo paso que se ve al pulsar cada uno; hasta
   entonces, la seccion que ya existe. Las que tienen pagina propia y `dia`
   se abren en el dia del cuadrado. */
const DESTINO = {
  // Rutas tiene su propia pagina: delegaciones, rutas, puntos de venta y festivos (docs/55).
  rutas:        {url:"/rutas/", dia:true},
  // Incidencias tiene su propia pagina, como el Power BI de Gabriele (docs/56).
  averias:      {url:"/incidencias/", dia:true},
  // Las devoluciones de dinero, con su pagina de tablas y graficos (docs/57).
  devoluciones: {url:"/devoluciones/"},
  // Almacenes tiene su propia pagina: productos, fotos, packs y bajo minimo (docs/54).
  almacenes:    {url:"/almacenes/"},
  // Furgonetas tiene su propia pagina: vehiculo a vehiculo y visitas sin vehiculo (docs/58).
  furgonetas:   {url:"/furgonetas/", dia:true},
  pdvs:         {sesion:"instalaciones", panel:"censo"},
  ventas:       {sesion:"venta_consumo", panel:"recaudacion"},
  reposiciones: {sesion:"venta_consumo", panel:"carga"},
  telemetria:   {sesion:"instalaciones", panel:"incidencias"},
  // Tarifas tiene su propia pagina, con delegaciones, centros y productos (docs/52).
  tarifas:      {url:"/tarifas/"},
  // Revision de clientes: sin planograma, sin tarifa, precio distinto y
  // planogramas creados, maquina a maquina (docs/59).
  revision:     {url:"/revision/"},
  // Utilizo: cuanto usa VenCloud cada persona, dia a dia (docs/60).
  utilizo:      {url:"/utilizo/"},
};
const TITULO = {
  rutas:"Rutas", averias:"Incidencias", devoluciones:"Devoluciones", almacenes:"Almacenes", furgonetas:"Furgonetas",
  pdvs:"Puntos de venta activos", ventas:"Ventas", reposiciones:"Reposiciones", telemetria:"Telemetría",
  tarifas:"Tarifas", revision:"Revisión clientes", utilizo:"Utilizo",
};

// Los cuadrados que no son de un dia sino la foto de la noche.
const FOTO = new Set(["pdvs", "almacenes", "tarifas", "devoluciones", "revision", "utilizo"]);
let YO=null, DATOS=null, PREFERIDOS=null;

function fechaLarga(s){
  const d = new Date(String(s)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? String(s)
    : d.toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function mesLargo(p){
  const d = new Date(String(p)+"-01T00:00:00");
  return Number.isNaN(d.getTime()) ? String(p) : d.toLocaleDateString("es-ES",{month:"long", year:"numeric"});
}

/* Lo que pinta cada cuadrado: valor, linea de debajo y, si lleva semaforo, su
   porcentaje. `d` es el dia elegido; `f`, la foto de la noche. */
function contenido(id, d, f){
  const x = FOTO.has(id) ? f[id] : d[id];
  if(!x) return null;
  if(x.sin_dato) return {sin:x.sin_dato};
  const c = contenidoDe(id, x);
  /* Varios dias: cuantos tienen el dato, si no son todos. Se dice; no se
     reparte lo que falta entre los demas. */
  if(c && !FOTO.has(id) && x.de > 1 && x.dias < x.de)
    c.sub += ` · solo ${num(x.dias)} de ${num(x.de)} días tienen el dato`;
  return c;
}
function contenidoDe(id, x){
  const varios = x.de > 1;
  switch(id){
    case "rutas": return {vl:pct(x.pct), pct:x.pct,
      sub:`${num(x.hechas)} de ${num(x.previstas)} visitas previstas`
        + (x.fuera_de_plan ? ` · ${num(x.fuera_de_plan)} fuera del plan` : "")};
    case "averias": return {vl:pct(x.pct), pct:x.pct,
      sub:`${num(x.a_tiempo)} de ${num(x.cerradas)} cerradas en menos de ${num(x.horas||24)} h`};
    case "telemetria": {
      /* El dato es siempre el de VenCloud. Si se han subido los ficheros de
         Nayax, Prodelfi y Nebula, debajo van las diferencias con ellos, y el
         cuadrado lleva a la pagina que las ensena (docs/53). */
      const df = x.diferencias;
      const n = df ? (df.sin_marca||0) + (df.solo_vencloud||0) + (df.fuera||0) : 0;
      return {vl:pct(x.pct), pct:x.pct,
        sub:(varios ? `${num(x.con_dex)} de ${num(x.auditables)} lecturas (DEX) esperadas, máquina a máquina y día a día`
                    : `${num(x.con_dex)} de ${num(x.auditables)} máquinas mandaron su lectura (DEX)`)
          + (df ? ` · ${num(n)} diferencias con Nayax, Prodelfi y Nebula` : "")};
    }
    case "devoluciones": {
      /* El dinero devuelto en el mes de ayer hasta ayer, contra los mismos
         dias del mes anterior (Gabriele, 20-oct-2026). Un fichero de antes
         del importe sigue diciendo cuantas. */
      const dia = Number(String(x.hasta).slice(8,10));
      if(x.importe == null) return {vl:num(x.total),
        sub:`en ${mesLargo(x.mes)}, hasta el día ${num(dia)} · ${num(x.mes_anterior)} el mes anterior a estas alturas`
          + (x.sin_cerrar ? ` · ${num(x.sin_cerrar)} sin cerrar` : "")
          + (x.especiales!=null ? ` · ${num(x.especiales)} de solicitudes especiales` : "")};
      return {vl:eur(x.importe),
        sub:`devueltos en ${mesLargo(x.mes)} hasta el día ${num(dia)}, de ${num(x.total)} ${x.total===1?"devolución":"devoluciones"}`
          + ` · ${eur(x.importe_anterior)} el mes anterior a estas alturas`
          + (x.sin_resolver ? ` · ${num(x.sin_resolver)} sin resolver` : "")
          + (x.rechazadas ? ` · ${num(x.rechazadas)} rechazadas` : "")};
    }
    case "almacenes": return {vl:eur(x.valor),
      sub:`Cierre de ${mesLargo(x.periodo)} · ${num((x.por_almacen||[]).length)} almacenes`
        + (x.bajo_minimo ? ` · ${num(x.bajo_minimo)} productos bajo mínimo` : "")};
    case "furgonetas": return {vl:num(x.activas),
      sub:`${varios ? "distintas con visitas en esos días" : "con visitas ese día"} · ${num(x.visitas)} visitas`
        + (x.visitas_sin_vehiculo ? ` (${num(x.visitas_sin_vehiculo)} sin vehículo)` : "")};
    case "pdvs": return {vl:num(x.activos), sub:`${num(x.maquinas)} máquinas instaladas`};
    case "tarifas": return {vl:pct(x.pct), pct:x.pct,
      sub:`${num(x.coinciden)} de ${num(x.controlados)} productos cobran su tarifa`
        + (x.sin_tarifa ? ` · ${num(x.sin_tarifa)} sin tarifa` : "")};
    case "revision": return {vl:num(x.sin_planograma),
      sub:`máquinas sin planograma`
        + (x.creados_ayer ? ` · ${num(x.creados_ayer)} creados ayer` : "")
        + (x.sin_tarifa!=null ? ` · ${num(x.sin_tarifa)} con productos sin tarifa` : "")
        + (x.precio_distinto!=null ? ` · ${num(x.precio_distinto)} con precio distinto` : "")};
    case "utilizo": {
      const dia = new Date(String(x.dia)+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long", day:"numeric", month:"long"});
      return {vl:num(x.usuarios), sub:`usuarios en VenCloud el ${dia} · ${num(x.acciones)} acciones`};
    }
    case "ventas": return {vl:eur(x.importe),
      sub:`${num(x.unidades)} unidades`
        + (x.maquinas!=null ? ` · ${num(x.maquinas)} máquinas` : varios ? ` en ${num(x.dias)} días` : "")
        + (x.fuente==="telemetria" ? " · por telemetría" : x.fuente==="visita_ventas" ? " · del parte, parcial" : "")};
    case "reposiciones": {
      const partes = (x.por_clase||[]).slice(0,3).map(c=>`${c.clase} ${num(c.unidades)}`).join(" · ");
      return {vl:num(x.unidades)+" ud",
        sub:(partes || "Sin reposición de producto")
          + (x.consumibles ? ` · y ${num(x.consumibles)} de carriles de café (café, azúcar, vasos)` : "")};
    }
  }
  return null;
}

function semaforo(p){
  const u = DATOS.umbrales || {verde:95, amarillo:75};
  if(p==null) return null;
  return p > u.verde ? "verde" : p >= u.amarillo ? "amarillo" : "rojo";
}
const ESTADO = {verde:"En objetivo", amarillo:"Vigilar", rojo:"Por debajo"};

      + `<div class="vl">${num(n)}</div>`

    el.innerHTML = `<div class="et">${esc(TITULO[id])}</div>`

      + `<div class="pie"><span class="foto">${FOTO.has(id) ? "foto de la última carga" : ""}</span>`
      + `<span>${va ? (propia || dest.url ? "Ver detalle →" : "Ver sección →") : dest ? "" : "Sin sección todavía"}</span></div>`;
    if(va) el.setAttribute("aria-label", `${TITULO[id]}: ${c.sin ? c.sin : c.vl}. Abrir la sección.`);

/* ===================================================================
   Lo elegido: un dia o varios, y area y delegacion (Gabriele, 19-oct).

   La noche deja cada dia con su cifra y su reparto por delegacion, ya con el
   ambito del usuario aplicado (docs/66). Aqui solo se elige y se suma: lo que
   se suma se suma, los porcentajes salen del total y las furgonetas son las
   distintas. Lo que un dia no tiene, se dice; no se rellena con los demas.
   =================================================================== */
const SEL = {modo:"uno", desde:null, hasta:null, area:"", deleg:""};
let DIAS = [], HAY = new Set();
const NO_SE_REPARTE = "Este cuadrado no se reparte por delegación: quita el filtro para verlo.";
const SIN_REPARTO = "Estos días son de antes de que el informe se repartiera por delegación.";

function masDias(iso, n){
  const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return isoLocal(d);
}
function diasEntre(a, b){
  const out = [];
  for(let x=a; x<=b; x=masDias(x,1)) out.push(x);
  return out;
}
function fechasElegidas(){
  return SEL.modo==="uno" ? [SEL.hasta] : diasEntre(SEL.desde, SEL.hasta);
}
function delegsElegidas(){
  if(SEL.deleg) return [SEL.deleg];
  if(SEL.area) return Object.keys(DATOS.zonas||{}).filter(k=>DATOS.zonas[k]===SEL.area);
  return null;
}

/* Un cuadrado de dia sumado sobre `fechas` y, si hay filtro, sobre `delegs`.
   Devuelve la misma forma que un dia, mas `dias` (los que aportan) y `de`
   (los del rango). */
function sumaCuadrado(id, fechas, delegs){
  const de = fechas.length;
  let dias = 0, motivo = null, reparto = false;
  const acc = {};
  const add = (k, v) => { acc[k] = (acc[k]||0) + (+v||0); };
  const vehiculos = new Set(); let sinLista = false;
  const clases = {};
  for(const f of fechas){
    const dia = (DATOS.dias||{})[f];
    if(!dia) continue;
    const x = dia[id];
    if(!x) continue;
    // Un dia sin dato: rutas sin plan, ventas sin venta, telemetria sin censo.
    // Las averias sin cierres si son un dato: cero cerradas.
    if(x.sin_dato && id!=="averias"){ motivo = x.sin_dato; continue; }
    let partes;
    if(delegs){
      const por = dia.por_delegacion;
      if(!por || !(id in por)){ reparto = true; continue; }
      partes = delegs.map(dl=>por[id][dl]).filter(Boolean);
    } else partes = null;
    dias++;
    switch(id){
      case "rutas":
        if(partes) partes.forEach(p=>{ add("previstas",p.previstas); add("hechas",p.hechas); add("fuera",p.fuera); });
        else { add("previstas",x.previstas); add("hechas",x.hechas); add("fuera",x.fuera_de_plan); }
        break;
      case "averias":
        if(partes) partes.forEach(p=>{ add("cerradas",p.cerradas); add("a_tiempo",p.a_tiempo); });
        else { add("cerradas",x.cerradas); add("a_tiempo",x.a_tiempo); }
        break;
      case "furgonetas":
        (partes || [x]).forEach(p=>{
          add("visitas",p.visitas); add("sin",p.visitas_sin_vehiculo);
          if(Array.isArray(p.vehiculos)) p.vehiculos.forEach(v=>vehiculos.add(v));
          else { sinLista = true; add("activas",p.activas); }
        });
        break;
      case "ventas":
        (partes || [x]).forEach(p=>{ add("importe",p.importe); add("unidades",p.unidades); add("maquinas",p.maquinas); });
        if(!partes) acc.fuente = acc.fuente===undefined || acc.fuente===x.fuente ? x.fuente : null;
        break;
      case "reposiciones":
        if(partes) partes.forEach(p=>{
          add("unidades",p.unidades); add("consumibles",p.consumibles);
          Object.entries(p.por_clase||{}).forEach(([k,u])=>{ clases[k]=(clases[k]||0)+u; });
        });
        else {
          add("unidades",x.unidades); add("consumibles",x.consumibles);
          (x.por_clase||[]).forEach(c=>{ clases[c.clase]=(clases[c.clase]||0)+c.unidades; });
        }
        break;
      case "telemetria":
        (partes || [x]).forEach(p=>{ add("auditables",p.auditables); add("con_dex",p.con_dex); });
        break;
    }
  }
  if(!dias){
    if(reparto) return {sin_dato: SIN_REPARTO};
    if(motivo) return {sin_dato: de===1 ? motivo : "Ninguno de esos días tiene este dato. " + motivo};
    return {sin_dato: de===1 ? "Ese día no tiene este dato." : "Ninguno de esos días tiene este dato."};
  }
  const base = {dias, de};
  const pctDe = (a,b) => b ? Math.round(1000*a/b)/10 : null;
  switch(id){
    case "rutas":
      if(!acc.previstas) return {sin_dato: delegs ? "Esa selección no tenía visitas previstas en el plan."
                                                  : "El plan no tenía ninguna visita prevista."};
      return Object.assign(base, {previstas:acc.previstas, hechas:acc.hechas||0,
        fuera_de_plan:acc.fuera||0, pct:pctDe(acc.hechas||0, acc.previstas)});
    case "averias":
      if(!acc.cerradas) return {sin_dato: de===1 ? "Ese día no se cerró ninguna avería."
                                                 : "En esos días no se cerró ninguna avería."};
      return Object.assign(base, {cerradas:acc.cerradas, a_tiempo:acc.a_tiempo||0, horas:24,
        pct:pctDe(acc.a_tiempo||0, acc.cerradas)});
    case "furgonetas":
      // Distintas en varios dias solo con la lista de matriculas de cada uno.
      if(sinLista && (de>1 || delegs)) return {sin_dato: "Las furgonetas distintas de varios días solo "
        + "se pueden contar en los días que guardan su lista de matrículas."};
      return Object.assign(base, {activas: sinLista ? acc.activas : vehiculos.size,
        visitas:acc.visitas||0, visitas_sin_vehiculo:acc.sin||0});
    case "ventas":
      return Object.assign(base, {importe:acc.importe||0, unidades:acc.unidades||0,
        // Las maquinas de varios dias no se suman: serian la misma muchas veces.
        maquinas: de===1 ? acc.maquinas||0 : null, fuente: de===1 && !delegs ? acc.fuente : null});
    case "reposiciones":
      return Object.assign(base, {unidades:acc.unidades||0, consumibles:acc.consumibles||0,
        por_clase:Object.entries(clases).map(([clase,unidades])=>({clase,unidades})).sort((a,b)=>b.unidades-a.unidades)});
    case "telemetria":
      return Object.assign(base, {auditables:acc.auditables||0, con_dex:acc.con_dex||0,
        pct:pctDe(acc.con_dex||0, acc.auditables)});
  }
  return null;
}

/* La foto de la noche, con el filtro: puntos de venta y almacenes se reparten
   por delegacion; los demas no, y lo dicen. */
function fotoFiltrada(delegs){
  const f = DATOS.foto || {};
  if(!delegs) return f;
  const out = {};
  for(const [id, x] of Object.entries(f)){
    if(!x || x.sin_dato){ out[id] = x; continue; }
    if(id==="pdvs"){
      const por = x.por_delegacion;
      if(!por){ out[id] = {sin_dato: "La foto de puntos de venta por delegación llega con la carga de la noche."}; continue; }
      const s = {activos:0, maquinas:0};
      delegs.forEach(dl=>{ if(por[dl]){ s.activos += por[dl].activos; s.maquinas += por[dl].maquinas; } });
      out[id] = s;
    } else if(id==="almacenes"){
      const lista = (x.por_almacen||[]).filter(a=>delegs.includes(a.delegacion));
      out[id] = lista.length ? {valor: lista.reduce((t,a)=>t+a.valor,0), periodo:x.periodo, por_almacen:lista}
                             : {sin_dato: "Ningún almacén de esa selección tiene cierre."};
    } else out[id] = {sin_dato: NO_SE_REPARTE};
  }
  return out;
}

const DE_UN_DIA = ["rutas","averias","furgonetas","ventas","reposiciones","telemetria"];
function vista(){
  const fechas = fechasElegidas(), delegs = delegsElegidas();
  const unoSolo = fechas.length===1 && !delegs;
  const d = {};
  for(const id of DE_UN_DIA){
    if(unoSolo){ const x = ((DATOS.dias||{})[fechas[0]]||{})[id]; if(x) d[id] = x; }
    else d[id] = sumaCuadrado(id, fechas, delegs);
  }
  return {d, f: fotoFiltrada(delegs)};
}

/* ------------------------------------------------------------- el calendario */
const CAL = {vista:"dias", y:0, m:0, pendiente:null};
const fmtMes = new Intl.DateTimeFormat("es-ES",{month:"long", year:"numeric"});
const fmtMesCorto = new Intl.DateTimeFormat("es-ES",{month:"short"});
function corta(iso){
  return new Date(iso+"T00:00:00").toLocaleDateString("es-ES",{day:"numeric", month:"short", year:"numeric"});
}
const mayuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
function pintaFecha(){
  $("#tFecha").textContent = SEL.modo==="uno" ? fechaLarga(SEL.hasta)
    : `${corta(SEL.desde)} – ${corta(SEL.hasta)} · ${num(diasEntre(SEL.desde, SEL.hasta).length)} días`;
  $("#mUno").setAttribute("aria-pressed", SEL.modo==="uno");
  $("#mVarios").setAttribute("aria-pressed", SEL.modo==="varios");
}
function mesDe(iso){ return iso.slice(0,7); }
function abreCal(){
  const ref = SEL.hasta || DIAS[DIAS.length-1];
  CAL.y = +ref.slice(0,4); CAL.m = +ref.slice(5,7)-1; CAL.vista = "dias"; CAL.pendiente = null;
  $("#cal").hidden = false; $("#bFecha").setAttribute("aria-expanded","true");
  pintaCal();
  const foco = $("#cal .cal-rej button.sel:not(:disabled)") || $("#cal .cal-rej button:not(:disabled)");
  if(foco) foco.focus();
}
function cierraCal(volver){
  if($("#cal").hidden) return;
  // Un rango a medias (solo el primer dia) se queda en ese dia.
  CAL.pendiente = null;
  $("#cal").hidden = true; $("#bFecha").setAttribute("aria-expanded","false");
  if(volver) $("#bFecha").focus();
}
function boton(txt, attrs, cls){
  return `<button type="button"${cls?` class="${cls}"`:""} ${attrs||""}>${txt}</button>`;
}
function pintaCal(){
  const c = $("#cal");
  const primero = DIAS[0], ultimo = DIAS[DIAS.length-1];
  const y0 = +primero.slice(0,4), y1 = +ultimo.slice(0,4);
  let cab, rej, ancha = false;
  if(CAL.vista==="dias"){
    const ini = new Date(CAL.y, CAL.m, 1);
    const clave = `${CAL.y}-${String(CAL.m+1).padStart(2,"0")}`;
    cab = boton("‹", `data-nav="-1" aria-label="Mes anterior"${clave<=mesDe(primero)?" disabled":""}`)
      + boton(mayuscula(fmtMes.format(ini)), `data-ir="meses" aria-label="Ver los meses de ${CAL.y}"`, "tit")
      + boton("›", `data-nav="1" aria-label="Mes siguiente"${clave>=mesDe(ultimo)?" disabled":""}`);
    const lun = ["L","M","X","J","V","S","D"].map(x=>`<span class="ds" aria-hidden="true">${x}</span>`).join("");
    const hueco = (ini.getDay()+6)%7;
    let celdas = "<span></span>".repeat(hueco);
    const n = new Date(CAL.y, CAL.m+1, 0).getDate();
    const hoy = isoLocal(new Date());
    const [a, b] = SEL.modo==="uno" ? [SEL.hasta, SEL.hasta]
      : CAL.pendiente ? [CAL.pendiente, CAL.pendiente] : [SEL.desde, SEL.hasta];
    for(let i=1;i<=n;i++){
      const iso = `${clave}-${String(i).padStart(2,"0")}`;
      const sel = iso===a || iso===b, en = iso>a && iso<b;
      // En varios dias se puede elegir cualquier dia del rango de datos: los
      // que falten se diran en cada cuadrado. En uno, solo los que tienen dato.
      const vale = SEL.modo==="uno" ? HAY.has(iso) : iso>=primero && iso<=ultimo;
      celdas += boton(String(i), `data-dia="${iso}" aria-label="${esc(fechaLarga(iso))}"${sel?' aria-pressed="true"':""}${vale?"":" disabled"}`,
        [sel?"sel":"", en?"en":"", iso===hoy?"hoy":""].filter(Boolean).join(" "));
    }
    rej = lun + celdas;
  } else if(CAL.vista==="meses"){
    ancha = true;
    cab = boton("‹", `data-navy="-1" aria-label="Año anterior"${CAL.y<=y0?" disabled":""}`)
      + boton(String(CAL.y), `data-ir="anios" aria-label="Ver los años"`, "tit")
      + boton("›", `data-navy="1" aria-label="Año siguiente"${CAL.y>=y1?" disabled":""}`);
    rej = "";
    for(let m=0;m<12;m++){
      const clave = `${CAL.y}-${String(m+1).padStart(2,"0")}`;
      const vale = clave>=mesDe(primero) && clave<=mesDe(ultimo);
      const sel = SEL.hasta && mesDe(SEL.hasta)===clave;
      rej += boton(fmtMesCorto.format(new Date(CAL.y, m, 1)).replace(".",""),
        `data-mes="${m}" aria-label="${esc(fmtMes.format(new Date(CAL.y, m, 1)))}"${vale?"":" disabled"}`, sel?"sel":"");
    }
  } else {
    ancha = true;
    cab = `<span></span>` + `<span class="tit">${y0===y1 ? y0 : `${y0} – ${y1}`}</span>` + `<span></span>`;
    rej = "";
    for(let y=y0;y<=y1;y++)
      rej += boton(String(y), `data-anio="${y}"`, SEL.hasta && +SEL.hasta.slice(0,4)===y ? "sel" : "");
  }
  let pie = "";
  if(SEL.modo==="varios"){
    pie = `<span class="ayuda">${CAL.pendiente ? "Ahora pulsa el último día." : "Pulsa el primer día y luego el último."}</span>`
      + boton("Últimos 7 días", `data-atajo="7"`) + boton("Últimos 30 días", `data-atajo="30"`)
      + boton("Este mes", `data-atajo="mes"`) + boton("Mes anterior", `data-atajo="anterior"`);
  } else {
    pie = boton("Último día calculado", `data-atajo="ultimo"`);
  }
  c.innerHTML = `<div class="cal-cab">${cab}</div><div class="cal-rej${ancha?" ancha":""}">${rej}</div><div class="cal-pie">${pie}</div>`;
}
function eligeRango(a, b){
  if(b < a) [a, b] = [b, a];
  SEL.desde = a; SEL.hasta = b;
}
function atajo(k){
  const ultimo = DIAS[DIAS.length-1];
  if(k==="ultimo"){ SEL.hasta = ultimo; return; }
  if(k==="7" || k==="30") return eligeRango(masDias(ultimo, 1-(+k)) < DIAS[0] ? DIAS[0] : masDias(ultimo, 1-(+k)), ultimo);
  if(k==="mes") return eligeRango(ultimo.slice(0,8)+"01" < DIAS[0] ? DIAS[0] : ultimo.slice(0,8)+"01", ultimo);
  if(k==="anterior"){
    const d = new Date(ultimo.slice(0,8)+"01T00:00:00"); d.setMonth(d.getMonth()-1);
    const ini = isoLocal(d), fin = masDias(ultimo.slice(0,8)+"01", -1);
    return eligeRango(ini < DIAS[0] ? DIAS[0] : ini, fin);
  }
}
function montaCal(){
  $("#bFecha").addEventListener("click", ()=> $("#cal").hidden ? abreCal() : cierraCal(true));
  $("#cal").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b || b.disabled) return;
    e.stopPropagation();
    if(b.dataset.nav){ CAL.m += +b.dataset.nav; if(CAL.m<0){CAL.m=11;CAL.y--;} if(CAL.m>11){CAL.m=0;CAL.y++;} }
    else if(b.dataset.navy) CAL.y += +b.dataset.navy;
    else if(b.dataset.ir) CAL.vista = b.dataset.ir;
    else if(b.dataset.anio){ CAL.y = +b.dataset.anio; CAL.vista = "meses"; }
    else if(b.dataset.mes){ CAL.m = +b.dataset.mes; CAL.vista = "dias"; }
    else if(b.dataset.atajo){ atajo(b.dataset.atajo); cierraCal(true); pinta(); return; }
    else if(b.dataset.dia){
      const iso = b.dataset.dia;
      if(SEL.modo==="uno"){ SEL.hasta = iso; cierraCal(true); pinta(); return; }
      if(!CAL.pendiente){ CAL.pendiente = iso; }
      else { eligeRango(CAL.pendiente, iso); CAL.pendiente = null; cierraCal(true); pinta(); return; }
    }
    pintaCal();
    const foco = $("#cal .cal-rej button.sel:not(:disabled)") || $("#cal .cal-cab .tit");
    if(foco && foco.focus) foco.focus();
  });
  document.addEventListener("click", e=>{ if(!e.target.closest(".fecha")) cierraCal(false); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") cierraCal(true); });
  const modo = m => {
    if(SEL.modo===m) return;
    SEL.modo = m;
    // De un dia a varios: la semana que acaba en ese dia. De varios a uno: el ultimo.
    if(m==="varios") eligeRango(masDias(SEL.hasta,-6) < DIAS[0] ? DIAS[0] : masDias(SEL.hasta,-6), SEL.hasta);
    else if(!HAY.has(SEL.hasta)) SEL.hasta = DIAS.filter(x=>x<=SEL.hasta).pop() || DIAS[DIAS.length-1];
    cierraCal(false); pinta();
  };
  $("#mUno").addEventListener("click", ()=>modo("uno"));
  $("#mVarios").addEventListener("click", ()=>modo("varios"));
}

/* ------------------------------------------------------------- area y delegacion */
function montaFiltros(){
  const zonas = DATOS.zonas || {};
  const delegs = Object.keys(zonas).sort((a,b)=>a.localeCompare(b,"es"));
  // Con una sola delegacion no hay nada que filtrar.
  if(delegs.length < 2) return;
  const areas = [...new Set(delegs.map(d=>zonas[d]))].sort((a,b)=>a.localeCompare(b,"es"));
  if(SEL.area && !areas.includes(SEL.area)) SEL.area = "";
  if(SEL.deleg && !delegs.includes(SEL.deleg)) SEL.deleg = "";
  const llenaDelegs = () => {
    const lista = delegs.filter(d=>!SEL.area || zonas[d]===SEL.area);
    if(SEL.deleg && !lista.includes(SEL.deleg)) SEL.deleg = "";
    $("#deleg").innerHTML = `<option value="">${SEL.area ? "Todas las de " + esc(SEL.area) : "Todas"}</option>`
      + lista.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
    $("#deleg").value = SEL.deleg;
  };
  if(areas.length > 1){
    $("#area").innerHTML = `<option value="">Todas</option>` + areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
    $("#area").value = SEL.area;
    $("#lArea").hidden = false;
  }
  llenaDelegs();
  $("#lDeleg").hidden = false;
  $("#area").addEventListener("change", ()=>{ SEL.area = $("#area").value; llenaDelegs(); pinta(); });
  $("#deleg").addEventListener("change", ()=>{ SEL.deleg = $("#deleg").value; pinta(); });
}

/* Lo elegido va en la direccion: se puede guardar o mandar el enlace. */
function leeDeUrl(){
  const q = new URLSearchParams(location.search);
  const ok = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
  if(ok(q.get("desde")) && ok(q.get("hasta"))){ SEL.modo = "varios"; eligeRango(q.get("desde"), q.get("hasta")); }
  else if(ok(q.get("dia"))) SEL.hasta = q.get("dia");
  SEL.area = q.get("area") || ""; SEL.deleg = q.get("delegacion") || "";
}
function guardaEnUrl(){
  const q = new URLSearchParams();
  if(SEL.modo==="varios"){ q.set("desde", SEL.desde); q.set("hasta", SEL.hasta); }
  else q.set("dia", SEL.hasta);
  if(SEL.area) q.set("area", SEL.area);
  if(SEL.deleg) q.set("delegacion", SEL.deleg);
  try{ history.replaceState(null, "", "?" + q.toString()); }catch(e){}
}

function avisa(texto, mal){
  const a = $("#aviso");
  a.textContent = texto; a.hidden = !texto; a.classList.toggle("mal", !!mal);
}

(async function arranca(){
  let r;
  try{ r = await fetch("/api/yo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(r.status === 401){ location.href = "/"; return; }
  if(!r.ok){ $("#cargando").textContent = "No se ha podido leer la sesión."; return; }
  YO = await r.json();
  /* Un cliente solo tiene el cuadro de mando (docs/49). */
  if(YO.tipo === "cliente"){ location.replace("/cuadro/"); return; }
  $("#quien").textContent = (YO.perfil ? YO.perfil + " · " : "") + (YO.nombre || YO.correo);
  document.title = (YO.perfil ? YO.perfil + " · " : "") + "Informe operativo · digivend";

  let ro;
  try{ ro = await fetch("/api/operativo", {credentials:"same-origin"}); }
  catch(e){ $("#cargando").textContent = "No hay conexión con el servidor."; return; }
  if(ro.status === 401){ location.href = "/"; return; }
  $("#cargando").hidden = true;
  if(!ro.ok){
    let d={}; try{ d = await ro.json(); }catch(e){}
    avisa(d.error || "El informe no está disponible ahora mismo.", true);
    return;
  }
  DATOS = await ro.json();
  /* El asistente contesta con este mismo informe, recortado igual en el
     servidor (docs/69). Las sugerencias, de los cuadrados que ve. */
  if(YO.asistente && YO.asistente.habilitado){
    const ve = new Set(DATOS.cuadrados || []);
    Asistente.monta({pagina:"operativo", boton:$("#bPreguntar"),
      hola:"¡Hola! Pregúntame por el informe general.",
      pie:"Sólo ve los datos de este informe. No ejecuta acciones ni consulta nada más.",
      sugerencias:()=>[
        ve.has("rutas") && "¿Qué delegación cumplió peor las rutas ayer?",
        ve.has("averias") && "¿Cómo van las averías cerradas en 24 h esta semana?",
        ve.has("ventas") && "¿Cuánto se vendió ayer y cómo va contra la semana pasada?",
        ve.has("furgonetas") && "¿Cuántas furgonetas salieron ayer?",
        ve.has("telemetria") && "¿Qué delegación tiene peor telemetría?",
      ].filter(Boolean)});
  }
  try{
    const rp = await fetch("/api/preferidos", {credentials:"same-origin"});
    if(rp.ok) PREFERIDOS = (await rp.json()).preferidos || [];
  }catch(e){}

  const u = DATOS.umbrales || {verde:95, amarillo:75};
  const n1 = n => new Intl.NumberFormat("es-ES").format(n);
  $("#lVerde").textContent = `más del ${n1(u.verde)} %`;
  $("#lAmarillo").textContent = `del ${n1(u.amarillo)} al ${n1(u.verde)} %`;
  $("#lRojo").textContent = `menos del ${n1(u.amarillo)} %`;

  DIAS = Object.keys(DATOS.dias||{}).sort();
  HAY = new Set(DIAS);
  if(!DIAS.length){ avisa("Todavía no hay ningún día calculado.", true); return; }
  const ultimo = DIAS[DIAS.length-1];
  /* Arranca en ayer. Si lo ultimo no es ayer, la carga de anoche no ha llegado
     y se dice: no se ensena el dia anterior como si fuera el de ayer. */
  const hoy = new Date(), ayer = isoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()-1));
  SEL.hasta = HAY.has(ayer) ? ayer : ultimo;
  if(!HAY.has(ayer))
    avisa(`Todavía no hay datos de ayer: lo último calculado es del ${fechaLarga(ultimo)}.`, true);
  /* Un enlace con dia, rango o delegacion abre en lo que dice, si existe. */
  leeDeUrl();
  if(SEL.modo==="varios"){
    eligeRango(SEL.desde < DIAS[0] ? DIAS[0] : SEL.desde, SEL.hasta > ultimo ? ultimo : SEL.hasta);
    if(SEL.desde > SEL.hasta){ SEL.modo = "uno"; SEL.hasta = ultimo; }
  } else if(!HAY.has(SEL.hasta)) SEL.hasta = HAY.has(ayer) ? ayer : ultimo;
  montaCal();
  montaFiltros();
  $("#barra").hidden = false;
  $("#cuadros").hidden = false;
  pinta();

  const gen = DATOS.generado ? new Date(DATOS.generado) : null;
  $("#pie").innerHTML = "Datos de VenCloud, filtrados por el ámbito de tu perfil y servidos desde este "
    + "mismo dominio." + (gen ? ` Calculado el ${esc(gen.toLocaleString("es-ES"))}.` : "")
    + " Puntos de venta, almacenes y tarifas son la foto de esa noche; el valor de los almacenes es el del "
    + "último cierre mensual de inventario. Donde no hay dato, se dice en vez de estimarse.";
  $("#pie").hidden = false;
})();
</script>
